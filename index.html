  /* ===================== Firewall-Klausur (NF/KF) ===================== */
  { id: 'nf01', type: 'nft', topo: 'klausur', q: 'Der Server soll vom Internet über HTTP und HTTPS erreichbar sein. Richte die Portweiterleitung im Router ein.',
    tables: nftTpl(['drop', 'accept', 'drop'], {}, { prerouting: ['iifname "ens18" tcp dport {80, 443} dnat to 192.168.98.10'] }, true), opts: NFT_OPTS_A,
    x: 'Portweiterleitung = DNAT = Zieladresse ändern, also **prerouting** (vor der Routing-Entscheidung) und für Pakete, die über ens18 **rein**kommen (`iifname`). In postrouting wäre DNAT falsch. forward hat hier policy accept, also ist keine Filterregel nötig.' },
  { id: 'nf02', type: 'nft', topo: 'klausur', q: 'Der Server und der Client haben keinen Internetzugriff. Richte NAT am Router ein.',
    tables: nftTpl(['drop', 'accept', 'drop'], {}, { postrouting: ['oifname "ens18" masquerade'] }, true), opts: NFT_OPTS_A,
    x: 'Quelladresse ersetzen = **masquerade** in **postrouting**, für alles, was über ens18 **raus**geht (`oifname`). `iifname` wäre in postrouting die falsche Richtung.' },
  { id: 'nf03', type: 'nft', topo: 'klausur', q: 'Der Webserver (DMZ) soll aus dem Internet per HTTP/HTTPS erreichbar sein. LAN und DMZ sollen ins Internet. Sonst darf nichts durch den Router (forward: policy drop).',
    tables: nftTpl(['drop', 'drop', 'accept'], { forward: 3 }, { forward: ['ct state established,related accept', 'iifname { "ens19", "ens20" } oifname "ens18" accept', 'iifname "ens18" oifname "ens19" ip daddr 192.168.98.10 tcp dport { 80, 443 } accept'],
      postrouting: ['oifname "ens18" masquerade'], prerouting: ['iifname "ens18" tcp dport { 80, 443 } dnat to 192.168.98.10'] }, true),
    opts: ['ct state established,related accept', 'iifname { "ens19", "ens20" } oifname "ens18" accept', 'iifname "ens18" oifname "ens19" ip daddr 192.168.98.10 tcp dport { 80, 443 } accept', 'iifname "ens18" oifname "ens19" ip daddr 10.50.0.20 tcp dport { 80, 443 } accept',
      'oifname "ens18" masquerade', 'iifname "ens18" tcp dport { 80, 443 } dnat to 192.168.98.10', 'oifname "ens18" tcp dport { 80, 443 } dnat to 192.168.98.10', 'iifname "ens18" accept', 'tcp dport { 80, 443 } accept'],
    x: 'Wichtig: forward sieht die Pakete **nach** dem DNAT, also mit Ziel 192.168.98.10, nicht 10.50.0.20. Bei policy drop braucht es `ct state established,related accept`, sonst kommen keine Antworten zurück. NAT-Antworten übersetzt conntrack automatisch. `iifname "ens18" accept` wäre viel zu offen.' },
  { id: 'nf04', type: 'nft', topo: 'klausur', q: 'Der Server soll aus dem Internet per SSH erreichbar sein, aber von außen über Port 2222 (intern Port 22). forward hat policy drop.',
    tables: nftTpl(['drop', 'drop', 'accept'], { forward: 2 }, { forward: ['ct state established,related accept', 'iifname "ens18" oifname "ens19" ip daddr 192.168.98.10 tcp dport 22 accept'], prerouting: ['iifname "ens18" tcp dport 2222 dnat to 192.168.98.10:22'] }, true),
    opts: ['ct state established,related accept', 'iifname "ens18" oifname "ens19" ip daddr 192.168.98.10 tcp dport 22 accept', 'iifname "ens18" oifname "ens19" ip daddr 192.168.98.10 tcp dport 2222 accept', 'iifname "ens18" tcp dport 2222 dnat to 192.168.98.10:22',
      'iifname "ens18" tcp dport 22 dnat to 192.168.98.10:2222', 'oifname "ens18" masquerade', 'iifname "ens18" tcp dport 2222 accept'],
    x: 'DNAT ändert Adresse **und** Port. forward prüft danach Ziel 192.168.98.10 mit Port **22**, nicht 2222. Masquerade ist hier nicht nötig: Die Antworten des Servers übersetzt conntrack zurück. Nicht benötigte Regeln geben Minuspunkte.' },
  { id: 'nf05', type: 'nft', topo: 'klausur', q: 'Schütze den Router selbst (input: policy drop): SSH nur aus dem LAN, DNS (UDP 53) für LAN und DMZ, Ping von überall, Antworten auf eigene Verbindungen erlauben.',
    tables: nftTpl(['drop', 'accept', 'accept'], { input: 4 }, { input: ['ct state established,related accept', 'icmp type echo-request accept', 'iifname { "ens19", "ens20" } udp dport 53 accept', 'iifname "ens20" tcp dport 22 accept'] }, false),
    opts: ['ct state established,related accept', 'icmp type echo-request accept', 'iifname { "ens19", "ens20" } udp dport 53 accept', 'iifname "ens20" tcp dport 22 accept', 'tcp dport 22 accept', 'udp dport 53 accept', 'oifname "ens20" tcp dport 22 accept', 'iifname "ens18" udp dport 53 accept'],
    x: 'Alles für den Router selbst landet in **input**. Dort gibt es nur `iifname`: `oifname` greift in input nie. `tcp dport 22 accept` ohne Interface würde SSH auch aus Internet und DMZ erlauben.' },
  { id: 'nf06', type: 'nft', topo: 'klausur', q: 'Der Router darf selbst nur DNS und HTTP/HTTPS nach außen (für apt). Admin-SSH auf den Router nur aus dem LAN. Antworten müssen durchkommen. input und output haben policy drop.',
    tables: nftTpl(['drop', 'drop', 'drop'], { input: 2, output: 3 }, { input: ['ct state established,related accept', 'iifname "ens20" tcp dport 22 accept'], output: ['ct state established,related accept', 'oifname "ens18" udp dport 53 accept', 'oifname "ens18" tcp dport { 80, 443 } accept'] }, false),
    opts: ['ct state established,related accept', 'iifname "ens20" tcp dport 22 accept', 'oifname "ens18" udp dport 53 accept', 'oifname "ens18" tcp dport { 80, 443 } accept', 'iifname "ens18" udp dport 53 accept', 'iifname "ens18" tcp dport { 80, 443 } accept', 'oifname "ens18" accept', 'tcp sport { 80, 443 } accept'],
    x: 'Vom Router selbst ausgehend: **output** mit `oifname`. Die Antworten der Update-Server kommen in **input** an, deshalb braucht auch input `ct state established,related accept`. Die SSH-Antworten an den Admin laufen durch output, auch dort hilft die ct-Regel.' },
  { id: 'nf07', type: 'nft', topo: 'klausur', q: 'DMZ isolieren (forward: policy drop): Das LAN darf ins Internet (alles) und in die DMZ nur per SSH, HTTP und HTTPS. Die DMZ darf nur HTTP/HTTPS ins Internet (Updates) und nie ins LAN. Antworten müssen durchkommen. NAT für beide Netze.',
    tables: nftTpl(['drop', 'drop', 'accept'], { forward: 4 }, { forward: ['ct state established,related accept', 'iifname "ens20" oifname "ens18" accept', 'iifname "ens20" oifname "ens19" tcp dport { 22, 80, 443 } accept', 'iifname "ens19" oifname "ens18" tcp dport { 80, 443 } accept'], postrouting: ['oifname "ens18" masquerade'] }, true),
    opts: ['ct state established,related accept', 'iifname "ens20" oifname "ens18" accept', 'iifname "ens20" oifname "ens19" tcp dport { 22, 80, 443 } accept', 'iifname "ens19" oifname "ens18" tcp dport { 80, 443 } accept', 'oifname "ens18" masquerade',
      'iifname "ens19" oifname "ens20" accept', 'oifname "ens19" tcp dport { 22, 80, 443 } accept', 'iifname "ens19" oifname "ens18" accept', 'iifname "ens20" accept'],
    x: '`oifname "ens19" tcp dport { 22, 80, 443 } accept` ließe auch das Internet in die DMZ. `iifname "ens20" accept` erlaubt LAN überallhin, das ist zwar bequem, aber nicht gefordert. Die Antworten der DMZ an das LAN regelt die ct-Regel. Neue Verbindungen DMZ → LAN bleiben verboten.' },
  { id: 'kf01', type: 'multi', q: 'Kreuze alle richtigen Aussagen an.',
    a: ['Eine Deep-Packet-Inspection-Firewall kann Anwendungsprotokolle unabhängig vom verwendeten Port erkennen', 'Eine Stateful Firewall kann Webseiten anhand der URL filtern und blockieren', 'Eine Stateful Firewall kann SSH-Verbindungen auch dann erkennen, wenn SSH nicht auf Port 22 verwendet wird',
      'Ein Paketfilter trifft Entscheidungen anhand von IP-Adressen, Ports und Protokollen', 'Eine Deep-Packet-Inspection-Firewall kann ohne zusätzliche Agenten erkennen, welches Programm die Pakete erzeugt hat', 'Eine Stateful Firewall kann die Anzahl gleichzeitiger Verbindungen begrenzen',
      'Eine Stateful Firewall erkennt Antwortpakete bestehender Verbindungen', 'Ein Paketfilter kann die Anzahl eingehender TCP-Verbindungen begrenzen'], c: [0, 3, 5, 6],
    x: 'Stateful kennt Verbindungen (State Table): Antworten erkennen und Verbindungen zählen bzw. begrenzen geht. Inhalte (URL, Protokoll auf anderem Port) erkennt erst DPI. Welches **Programm** auf dem PC sendet, sieht keine Netzwerk-Firewall, dafür braucht es einen Agenten bzw. eine Personal Firewall. Ein stateless Paketfilter kann nichts zählen.' },
  { id: 'kf02', type: 'multi', q: 'Kreuze alle richtigen Aussagen zu IDS und IPS an.',
    a: ['Ein IDS kann Administratoren alarmieren', 'Ein IPS kann nur Angriffe erkennen, aber niemals blockieren', 'Ein IDS dient der Erkennung von Angriffen', 'Ein IPS kann Angriffe aktiv blockieren',
      'Ein IPS arbeitet immer passiv und beeinflusst den Datenverkehr nicht', 'Sowohl IDS als auch IPS können bekannte Angriffsmuster erkennen', 'Ein IDS blockiert grundsätzlich jeden Angriff automatisch', 'Ein IDS ersetzt eine Firewall vollständig'], c: [0, 2, 3, 5],
    x: 'IDS = erkennen und melden (passiv). IPS = erkennen und blockieren (inline). Beide nutzen Signaturen und/oder Anomalien. Keines ersetzt die Firewall.' },
  { id: 'kf03', type: 'multi', q: 'Kreuze alle richtigen Aussagen an.',
    a: ['Ein NIDS bekommt den Verkehr häufig über einen Mirror- bzw. SPAN-Port', 'Ein IPS muss inline im Datenstrom sitzen, um blockieren zu können', 'Anomaliebasierte Erkennung kann auch unbekannte (Zero-Day-)Angriffe auffallen lassen',
      'Signaturbasierte Erkennung erzeugt grundsätzlich mehr Fehlalarme als anomaliebasierte', 'Ein False Negative ist ein Fehlalarm', 'Ein HIDS überwacht Dateien und Logs auf einem einzelnen Rechner'], c: [0, 1, 2, 5],
    x: 'Eher umgekehrt: Anomalieerkennung hat mehr Fehlalarme. False **Positive** = Fehlalarm, False **Negative** = übersehener Angriff.' },
  { id: 'kf04', type: 'multi', q: 'Kreuze alle richtigen Aussagen zu NAT mit nftables an.',
    a: ['DNAT ändert die Zieladresse und gehört in prerouting', 'Masquerade ersetzt die Quelladresse durch die Adresse des Ausgangs-Interfaces', 'Für Antworten auf genattete Verbindungen braucht man eine eigene Rückübersetzungsregel',
      'Nach einem DNAT sieht die forward-Chain bereits die neue Zieladresse', 'SNAT gehört in prerouting', 'NAT-Chains sehen nur das erste Paket einer Verbindung'], c: [0, 1, 3, 5],
    x: 'conntrack merkt sich die Übersetzung und dreht sie bei den Antworten automatisch um. SNAT/Masquerade gehört in postrouting.' },
  { id: 'kf05', type: 'mc', q: 'Warum ist `iifname "ens18" tcp dport {80, 443} dnat to 192.168.98.10` in der **postrouting**-Chain falsch?',
    a: ['Die Zieladresse muss vor der Routing-Entscheidung geändert werden, DNAT gehört in prerouting', 'In postrouting darf man keine Ports angeben', 'dnat funktioniert nur mit oifname', 'postrouting gibt es nur in der Tabelle filter'], c: 0,
    x: 'In postrouting ist schon entschieden, wohin das Paket geht (an den Router selbst). Dann ist es zu spät, das Ziel zu ändern. Merke: **pre** = Ziel (DNAT), **post** = Quelle (SNAT/Masquerade).' },
  { id: 'kf06', type: 'mc', q: 'Portweiterleitung: `iifname "ens18" tcp dport 2222 dnat to 192.168.98.10:22`. Welcher Port muss in der zugehörigen forward-Regel stehen?',
    a: ['22, denn forward sieht das Paket nach dem DNAT', '2222, denn der Client hat 2222 gewählt', 'Beide', 'Keiner, forward prüft keine Ports'], c: 0,
    x: 'prerouting (DNAT) kommt vor forward. Die Regel lautet z. B. `iifname "ens18" oifname "ens19" ip daddr 192.168.98.10 tcp dport 22 accept`.' },
  { id: 'kf07', type: 'mc', q: 'Was bedeutet `priority dstnat` bei der prerouting-Chain?',
    a: ['-100: Die Chain läuft vor den Filter-Chains (priority 0)', '100: Die Chain läuft nach dem Filter', '0: gleichzeitig mit dem Filter', 'Die Chain ist deaktiviert'], c: 0,
    x: 'Namen statt Zahlen: dstnat = -100, filter = 0, srcnat = 100. Kleinere Zahl = früher.' },
  { id: 'kf08', type: 'tf', q: 'Masquerade eignet sich besonders, wenn die WAN-Adresse per DHCP vergeben wird und sich ändern kann.', c: true,
    x: 'Richtig. masquerade nimmt automatisch die aktuelle Adresse von oifname. Bei fester Adresse geht auch `snat to 10.50.0.20`.' },
  { id: 'kf09', type: 'mc', q: 'forward hat policy drop und nur `iifname "ens20" oifname "ens18" accept`. Der Client öffnet eine Webseite. Was passiert?',
    a: ['Die Anfrage geht raus, die Antwort wird verworfen. Es fehlt `ct state established,related accept`', 'Alles funktioniert', 'Schon die Anfrage wird verworfen', 'Die Antwort läuft durch input und wird dort erlaubt'], c: 0,
    x: 'Die Antwort kommt über ens18 herein und geht über ens20 raus. Dafür gibt es keine Regel, also greift policy drop. Die ct-Regel erlaubt Pakete bestehender Verbindungen.' },
  { id: 'kf10', type: 'mc', q: 'LAN = ens20, WAN = ens18. Welche Regel erlaubt dem LAN den Internetzugang in der forward-Chain?',
    a: ['iifname "ens20" oifname "ens18" accept', 'iifname "ens18" oifname "ens20" accept', 'oifname "ens20" accept', 'ip saddr 192.168.99.0/24 iifname "ens18" accept'], c: 0,
    x: 'Die Anfrage kommt über das LAN **herein** (iif ens20) und geht über das WAN **hinaus** (oif ens18).' },
  { id: 'kf11', type: 'multi', q: 'Kreuze alle richtigen Aussagen an.',
    a: ['Ein Application Level Gateway (Proxy) kann Inhalte wie URLs prüfen', 'Eine NGFW kombiniert SPI, Anwendungserkennung und IPS', 'Ein Paketfilter erkennt Malware in übertragenen Dateien', 'Eine WAF schützt Webanwendungen vor SQL-Injection', 'Eine SPI-Firewall prüft den Inhalt von HTTPS-Verbindungen'], c: [0, 1, 3],
    x: 'Paketfilter und SPI arbeiten auf Schicht 3/4. Inhalte prüfen ALG, WAF, NGFW. HTTPS-Inhalte nur mit TLS-Inspection.' },
  { id: 'kf12', type: 'mc', q: 'Eine input-Regel lautet `iifname "ens18" tcp dport 22 reject`. Was sieht der Ext-Client bei `ssh 10.50.0.20`?',
    a: ['Sofort „Connection refused“', '„Connection timed out“ nach einer Weile', '„No route to host“', 'Eine Passwortabfrage'], c: 0,
    x: 'reject antwortet sofort (TCP-Reset bzw. ICMP), drop verwirft still, dann wartet der Client bis zum Timeout.' },
  { id: 'fg1', type: 'gen', gen: 'chainFlows' }, { id: 'fg2', type: 'gen', gen: 'chainFlows' },
  { id: 'mg1', type: 'gen', gen: 'matrix', rules: 'm1' }, { id: 'mg2', type: 'gen', gen: 'matrix', rules: 'm2' }, { id: 'mg3', type: 'gen', gen: 'matrix', rules: 'm3' },

  /* ===================== Server & Virtualisierung (V) ===================== */
  { id: 'v01', type: 'multi', q: 'Welche Merkmale unterscheiden Server-Systeme typischerweise von PC-Systemen?',
    a: ['ECC-Arbeitsspeicher, der Speicherfehler erkennt und korrigiert', 'Redundante, im Betrieb tauschbare Netzteile', 'Hot-Swap-Festplatten im RAID-Verbund', 'Fernwartung unabhängig vom Betriebssystem (z. B. iLO, iDRAC, IPMI)', 'Leistungsstarke Gaming-Grafikkarte', 'Für 8 Stunden Betrieb am Tag ausgelegt'], c: [0, 1, 2, 3],
    x: 'Server sind auf Dauerbetrieb (24/7), Ausfallsicherheit und Fernwartung ausgelegt, oft im Rack-Format, mit mehr Speicher- und Netzwerkanschlüssen.' },
  { id: 'v02', type: 'mc', q: 'Was kennzeichnet Blade-Server gegenüber Rackmount-Servern?',
    a: ['Viele schmale Einschübe teilen sich in einem Chassis Stromversorgung, Kühlung und Netzwerk, das ergibt eine hohe Packungsdichte', 'Jeder Blade hat eigene Netzteile und Lüfter und steht frei im Raum', 'Blade-Server sind immer Tower-Gehäuse', 'Blade-Server brauchen kein Netzwerk'], c: 0,
    x: 'Rackmount-Server sind eigenständige Geräte (z. B. 1 HE oder 2 HE) mit eigenen Netzteilen. Blades sparen Platz und Kabel, aber das Chassis ist ein gemeinsamer Abhängigkeitspunkt und es entsteht Herstellerbindung.' },
  { id: 'v03', type: 'multi', q: 'Welche Kriterien entscheiden über die Auswahl eines Servers für einen Zweck?',
    a: ['Anforderungen der Dienste an CPU, RAM, Speicher und Netzwerk', 'Verfügbarkeit bzw. Redundanz (z. B. Netzteile, RAID)', 'Skalierbarkeit und Erweiterbarkeit', 'Gesamtkosten (Anschaffung, Strom, Wartung, Lizenzen) und Support', 'Die Farbe des Gehäuses'], c: [0, 1, 2, 3],
    x: 'Dazu kommen Formfaktor bzw. Platz im Rack, Energieeffizienz, Kompatibilität (z. B. zum Hypervisor) und Garantie bzw. Service-Level.' },
  { id: 'v04', type: 'multi', q: 'Wofür wird Virtualisierung eingesetzt?',
    a: ['Mehrere Server auf einer Hardware betreiben (Konsolidierung)', 'Hardware besser auslasten', 'Systeme voneinander isolieren', 'Test- und Schulungsumgebungen schnell bereitstellen', 'Die Rechenleistung über die der Hardware hinaus steigern'], c: [0, 1, 2, 3],
    x: 'Virtualisierung teilt vorhandene Ressourcen auf, sie schafft keine zusätzliche Leistung. Durch den Overhead ist eine VM sogar minimal langsamer als Bare Metal.' },
  { id: 'v05', type: 'multi', q: 'Welche Aufgaben übernimmt der Hypervisor?',
    a: ['Er verteilt CPU, RAM, Speicher und Netzwerk an die VMs', 'Er isoliert die VMs voneinander', 'Er stellt den VMs virtuelle Hardware bereit', 'Er installiert automatisch Anwendungen in den VMs'], c: [0, 1, 2],
    x: 'Der Hypervisor (Virtual Machine Monitor) steuert den Zugriff der VMs auf die echte Hardware und plant deren Ausführung (Scheduling).' },
  { id: 'v06', type: 'mc', q: 'Was ist der wesentliche Unterschied zwischen einem Container und einer VM?',
    a: ['Container teilen sich den Kernel des Host-Betriebssystems, eine VM hat ein eigenes Betriebssystem mit eigenem Kernel', 'Container sind immer langsamer als VMs', 'VMs laufen nur unter Linux', 'Container brauchen einen Typ-2-Hypervisor'], c: 0,
    x: 'Container sind dadurch schlank und starten in Sekunden, isolieren aber schwächer. Eine VM emuliert komplette Hardware.' },
  { id: 'v07', type: 'mc', q: 'Was unterscheidet einen Typ-1- von einem Typ-2-Hypervisor?',
    a: ['Typ 1 läuft direkt auf der Hardware (bare metal), Typ 2 als Anwendung auf einem Host-Betriebssystem', 'Typ 1 ist nur für Windows, Typ 2 nur für Linux', 'Typ 2 ist immer schneller', 'Typ 1 braucht ein Host-Betriebssystem'], c: 0,
    x: 'Typ 1 (bare metal, „native“): weniger Overhead, für Rechenzentren. Typ 2 (hosted): für Arbeitsplätze und Tests.' },
  { id: 'v08', type: 'drops', q: 'Ordne die Produkte dem Hypervisor-Typ zu.', opts: ['Typ 1 (bare metal)', 'Typ 2 (hosted)'],
    items: [{ p: 'VMware ESXi', c: 'Typ 1 (bare metal)' }, { p: 'Proxmox VE (KVM)', c: 'Typ 1 (bare metal)' }, { p: 'Microsoft Hyper-V', c: 'Typ 1 (bare metal)' }, { p: 'Xen / XCP-ng', c: 'Typ 1 (bare metal)' },
      { p: 'Oracle VirtualBox', c: 'Typ 2 (hosted)' }, { p: 'VMware Workstation', c: 'Typ 2 (hosted)' }, { p: 'Parallels Desktop', c: 'Typ 2 (hosted)' }],

const SQ = {
  rootDash: (w, tab) => w.tabs[tab].stack.some(s => s.m === tab && s.root && s.dash),
  addr: (w, mid, ifn, cidr) => { const f = ifOf(w.m[mid], ifn), c = NET.cidr(cidr); return !!(f && f.addrs.some(a => a.a === c.a && a.p === c.p)); },
  up: (w, mid, ifn) => { const f = ifOf(w.m[mid], ifn); return !!(f && f.up); },
  defVia: (w, mid, gw) => w.m[mid].routes.some(r => r.dst === 'default' && r.via === gw),
  ping: (w, from, ip) => connect(w, from, ip, 'icmp').ok,
  pingName: (w, from, name) => { const r = resolveName(w, from, name); return !r.err && connect(w, from, r.ip, 'icmp').ok; },
  pinged: (w, from, dst) => w.events.some(e => e.type === 'ping' && e.from === from && (e.dst === dst || e.host === dst) && e.ok),
  sshOk: (w, from, ip) => connect(w, from, ip, 'tcp', 22).ok,
  boot: (w, ids2) => bootPreview(w, ids2)
};
const IF_ROUTER = TPL.ifaces('\n# The primary network interface\nallow-hotplug ens18\niface ens18 inet dhcp\n\n# DMZ\nauto ens19\niface ens19 inet static\n    address 192.168.98.1/24\n\n# LAN\nauto ens20\niface ens20 inet static\n    address 192.168.99.1/24\n');
const IF_SERVER = TPL.ifaces('\n# DMZ\nauto ens3\niface ens3 inet static\n    address 192.168.98.10/24\n    gateway 192.168.98.1\n');
const NFT_NAT = TPL.nft + '\ntable ip nat {\n\tchain postrouting {\n\t\ttype nat hook postrouting priority srcnat; policy accept;\n\t\toifname "ens18" masquerade\n\t}\n}\n';
const NFT_T6 = '#!/usr/sbin/nft -f\n\nflush ruleset\n\ntable inet filter {\n\tchain input {\n\t\ttype filter hook input priority filter; policy drop;\n\t\tiif "lo" accept\n\t\tct state established,related accept\n\t\ticmp type echo-request accept\n\t\tiifname "ens19" tcp dport 22 accept\n\t}\n\tchain forward {\n\t\ttype filter hook forward priority filter; policy accept;\n\t}\n\tchain output {\n\t\ttype filter hook output priority filter; policy accept;\n\t}\n}\n\ntable ip nat {\n\tchain postrouting {\n\t\ttype nat hook postrouting priority srcnat; policy accept;\n\t\toifname "ens18" masquerade\n\t}\n}\n';
function setHost(m, h) { m.hostname = h; m.files['/etc/hostname'] = h + '\n'; m.files['/etc/hosts'] = TPL.hosts(h); }
function labRouterDone(w) { const r = w.m.router; setHost(r, 'router-firewall'); r.files['/etc/network/interfaces'] = IF_ROUTER; bootMachine(w, r); return w; }
function labFull() {
  const w = labRouterDone(newLab());
  const r = w.m.router, s = w.m.server, win = w.m.win;
  r.files['/etc/sysctl.conf'] = TPL.sysctl.replace('#net.ipv4.ip_forward=1', 'net.ipv4.ip_forward=1');
  r.files['/etc/nftables.conf'] = NFT_NAT; r.nftEnabled = true; r.pkgs.sudo = true; r.sudoGroup = true;
  bootMachine(w, r);
  setHost(s, 'server'); s.files['/etc/network/interfaces'] = IF_SERVER; s.pkgs.sudo = true; s.sudoGroup = true; bootMachine(w, s);
  const f = ifOf(win, 'Ethernet'); f.dhcp = false; f.addrs = [{ a: '192.168.99.10', p: 24 }]; win.gw = '192.168.99.1'; win.dns = ['192.168.95.40']; winApply(w, win);
  return w;
}

function spr(name, px, sub) {
  const rows = SPRITES[name];
  const w = Math.max.apply(null, rows.map(r => r.length)), h = rows.length;
  const at = (row, x) => { let ch = row[x] || '.'; if (sub && sub[ch]) ch = sub[ch]; return ch; };
  let out = '';
  rows.forEach((row, y) => {
    let x = 0;
    while (x < w) {
      const ch = at(row, x);
      if (ch === '.') { x++; continue; }
      let x2 = x + 1;
      while (x2 < w && at(row, x2) === ch) x2++;
      out += '<rect x="' + x + '" y="' + y + '" width="' + (x2 - x) + '" height="1" fill="' + (PAL[ch] || ch) + '"/>';
      x = x2;
    }
  });
  return '<svg class="spr" viewBox="0 0 ' + w + ' ' + h + '" width="' + (w * px) + '" height="' + (h * px) + '" shape-rendering="crispEdges" aria-hidden="true">' + out + '</svg>';
}

const SAVE_KEY = 'paketkontrolle.v1';
function freshSave() { return { v: 1, credits: 0, stars: {}, stack: [], settings: { sound: true, auto: true, crt: true } }; }
let SAVE = freshSave();
function loadSave() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return;
    const s = JSON.parse(raw);
    if (!s || s.v !== 1) return;
    const d = freshSave();
    SAVE = Object.assign(d, s);
    SAVE.settings = Object.assign(freshSave().settings, s.settings || {});
    if (!Array.isArray(SAVE.stack)) SAVE.stack = [];
    if (!SAVE.stars || typeof SAVE.stars !== 'object') SAVE.stars = {};
  } catch (e) { /* ohne Speicher weiterspielen */ }
}
function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(SAVE)); } catch (e) { /* egal */ } }
function totalStars() { return DAYS.reduce((a, d) => a + (SAVE.stars[d.id] || 0), 0); }

function stackAdd(item) {
  const ex = SAVE.stack.find(s => s.key === item.key);
  if (ex) ex.streak = 0; else SAVE.stack.push(Object.assign({ streak: 0 }, item));
  persist();
}
function stackHit(key, ok) {
  const ex = SAVE.stack.find(s => s.key === key);
  if (!ex) return null;
  if (!ok) { ex.streak = 0; persist(); return 0; }
  ex.streak++;
  if (ex.streak >= 2) { SAVE.stack = SAVE.stack.filter(s => s !== ex); persist(); return 'cleared'; }
  persist();
  return ex.streak;
}

/* ---------- 8-Bit-Sound ---------- */
const AudioFX = (() => {
  let ac = null;
  function ctx() {
    if (!ac) { const C = window.AudioContext || window.webkitAudioContext; if (!C) return null; ac = new C(); }
    if (ac.state === 'suspended') ac.resume();
    return ac;
  }
  function tone(freq, dur, o) {
    o = o || {};
    const a = ctx(); if (!a) return;
    const t = a.currentTime + (o.at || 0);
    const osc = a.createOscillator(), g = a.createGain();
    osc.type = o.type || 'square';
    osc.frequency.setValueAtTime(freq, t);
    if (o.to) osc.frequency.exponentialRampToValueAtTime(o.to, t + dur);
    g.gain.setValueAtTime(o.vol || 0.045, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(g); g.connect(a.destination);
    osc.start(t); osc.stop(t + dur + 0.03);
  }
  function noise(dur, vol) {
    const a = ctx(); if (!a) return;
    const n = Math.floor(a.sampleRate * dur), buf = a.createBuffer(1, n, a.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const src = a.createBufferSource(); src.buffer = buf;
    const f = a.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 800;
    const g = a.createGain(); g.gain.value = vol;
    src.connect(f); f.connect(g); g.connect(a.destination); src.start();
  }
  const fx = {
    click() { tone(660, 0.04, { vol: 0.025 }); },
    step() { tone(330, 0.03, { vol: 0.018 }); },
    stamp() { noise(0.12, 0.22); tone(120, 0.12, { type: 'triangle', vol: 0.12, to: 55 }); },
    ok() { tone(523, 0.07); tone(659, 0.07, { at: 0.07 }); tone(784, 0.13, { at: 0.14 }); },
    bad() { tone(220, 0.16, { type: 'sawtooth', vol: 0.04, to: 110 }); tone(150, 0.22, { at: 0.11, vol: 0.035, to: 90 }); },
    win() { [523, 659, 784, 1046].forEach((f, i) => tone(f, 0.11, { at: i * 0.1 })); tone(1046, 0.35, { at: 0.42, type: 'triangle', vol: 0.06 }); },
    lose() { [392, 330, 262, 196].forEach((f, i) => tone(f, 0.18, { at: i * 0.16, type: 'triangle', vol: 0.07 })); },
    ring() { for (let i = 0; i < 3; i++) { tone(880, 0.06, { at: i * 0.17 }); tone(1100, 0.06, { at: i * 0.17 + 0.07 }); } },
    memo() { tone(440, 0.05, { vol: 0.03 }); tone(554, 0.06, { at: 0.06, vol: 0.03 }); }
  };
  return { play(n) { if (!SAVE.settings.sound) return; try { if (fx[n]) fx[n](); } catch (e) { /* kein Ton */ } } };
})();

/* ---------- Bildschirm-Steuerung ---------- */
let TIMERS = [];
function later(fn, ms) { const t = setTimeout(fn, ms); TIMERS.push(t); return t; }
let SCREEN = {};
let MODAL = null;
function go(fn, arg) {
  TIMERS.forEach(clearTimeout); TIMERS = [];
  closeModal();
  const app = $('#app');
  app.innerHTML = '';
  SCREEN = fn(app, arg) || {};
  window.scrollTo(0, 0);
}
document.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const tag = e.target && e.target.tagName;
  if (tag === 'INPUT' || tag === 'TEXTAREA') return;
  if (tag === 'SELECT' && e.key !== 'Enter') return;
  /* Normale Knöpfe außerhalb des Spielfelds reagieren selbst auf Enter/Leertaste */
  if ((e.key === 'Enter' || e.key === ' ') && tag === 'BUTTON' && !e.target.disabled && !e.target.closest('.stage, .desk, .modal')) return;
  const h = MODAL ? MODAL.onKey : SCREEN.onKey;
  if (h && h(e) === true) e.preventDefault();
});
function openModal(html, opts) {
  closeModal();
  const back = document.createElement('div');
  back.className = 'modal-back';
  back.innerHTML = '<div class="modal ' + (opts && opts.paper ? 'paper' : '') + '" role="dialog" aria-modal="true">' + html + '</div>';
  document.body.appendChild(back);
  MODAL = { el: back, onKey: null };
  return MODAL;
}
function closeModal() { if (MODAL) { MODAL.el.remove(); MODAL = null; } }
let toastTimer = null;
function toast(msg) {
  let t = $('.toast');
  if (!t) { t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); document.body.appendChild(t); }
  t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 2300);
}

  app.innerHTML = '<header class="hud"><button class="btn tiny" data-act="home">&lt; Titel</button><div class="hud-title">DIENSTPLAN<small>Woche 1: Grundlagen · Woche 2: Klausurphase. Jeder Tag ist jederzeit spielbar.</small></div><div class="hud-right">' +
    hudItems([{ icon: 'coin', v: SAVE.credits + ' Cr', title: 'Kontostand' }, { icon: 'star', v: totalStars() + '/' + DAYS.length * 3, title: 'Sterne' }]) + '</div></header>' +
    [1, 2].map(wk => '<h2 class="week-h"><span>WOCHE ' + wk + '</span>' + (wk === 1 ? 'Grundlagen' : 'Klausurphase: schwerer, mit Linux-Labor und Probeklausur') + '</h2><div class="plan">' + DAYS.filter(d => d.week === wk).map(d => {
      const s = SAVE.stars[d.id] || 0;
      return '<button class="day ' + (d.boss ? 'boss ' : '') + (next === d ? 'next' : '') + '" data-day="' + d.id + '">' +
        '<div class="day-top"><span>TAG ' + d.n + '</span><span class="mode">' + esc(d.modeLabel.toUpperCase()) + '</span></div>' +
        '<div class="day-body"><div class="day-t">' + esc(d.title) + '</div><div class="day-d">' + esc(d.desc || DAY_DESC[d.id]) + '</div></div>' +
        '<div class="day-foot"><span class="stars">' + starsHTML(s, 3) + '</span>' +
        (s ? '<span class="tagpill done">ERLEDIGT</span>' : (next === d ? '<span class="tagpill">ALS NÄCHSTES</span>' : '')) + '</div></button>';
    }).join('') + '</div>').join('');
  $('[data-act="home"]', app).onclick = () => go(screenTitle);
  $$('.day', app).forEach(b => { b.onclick = () => { AudioFX.play('click'); go(screenMemo, DAYS.find(d => d.id === b.dataset.day)); }; });
  return {
    onKey(e) {
      const n = parseInt(e.key, 10);
      if (n >= 1 && n <= 9) { go(screenMemo, DAYS[n - 1]); return true; }
      if (e.key === 'Escape') { go(screenTitle); return true; }
    }
  };
}
function screenMemo(app, day) {
  const m = day.memo;
  app.innerHTML = '<div class="memo-wrap"><article class="memo-paper">' +
    '<div class="memo-head"><div class="memo-face">' + spr('chef', 5) + '</div><div><div class="memo-from">MEMO · TAG ' + day.n + ' · Chefin Brandt, Netzwerkabteilung</div><h2>' + esc(m.head) + '</h2></div></div>' +
    m.body +
    '<div class="keybox"><span class="px">MERKZETTEL</span>' + m.key + '</div>' +
    '<div class="controls">Steuerung: ' + esc(m.controls) + '</div>' +
    '<div class="memo-actions"><button class="btn" data-act="back">&lt; Dienstplan</button><button class="btn go big" data-act="start">Schicht beginnen &gt;</button></div>' +
    '</article></div>';
  AudioFX.play('memo');
  $('[data-act="back"]', app).onclick = () => go(screenPlan);
  $('[data-act="start"]', app).onclick = () => startDay(day);
  return {
    onKey(e) {
      if (e.key === 'Enter' || e.key === ' ') { startDay(day); return true; }
      if (e.key === 'Escape') { go(screenPlan); return true; }
    }
  };
}
function startDay(day) {
  AudioFX.play('click');
  if (day.mode === 'cards' || day.mode === 'exam') {
    const cards = [];
    day.draw.forEach(([g, n]) => sample(GROUPS[g], n).forEach(id => cards.push(materialize(CARDS[id]))));
    go(runCards, { day, title: 'TAG ' + day.n + ' · ' + esc(day.title.toUpperCase()), sub: esc(day.modeLabel), cards, exam: day.mode === 'exam' });
  } else if (day.mode === 'sim') go(runSim, day);
  else if (day.mode === 'shift') go(runShift, day);
  else if (day.mode === 'build') go(runBuild, day);
}

/* =====================================================================
   KARTEN-MODUS (Quizshow, Hook-Wege, Terminal, IHK-Tabellen, Nachsitzen)

const TYPE_META = { mc: 'MULTIPLE CHOICE', tf: 'WAHR ODER FALSCH', multi: 'MEHRERE RICHTIG', path: 'HOOK-WEG', pick: 'HOOK FINDEN',
  fill: 'TERMINAL', table: 'IHK-TABELLE', packet: 'NACHSITZEN AM SCHALTER', drops: 'DROPDOWNS', nft: 'NFTABLES-VORLAGE' };
const PRAISE = ['Stark!', 'Genau so.', 'Sauber gelöst.', 'Richtig, weiter so!', 'Läuft bei dir.', 'Das sitzt.'];
const COMFORT = ['Knapp daneben. Die Frage kommt gleich nochmal.', 'Nicht schlimm, lies dir die Erklärung durch.', 'Fehler sind zum Lernen da. Die kommt wieder.'];
const INTRO = ['Nächste Frage!', 'Konzentration …', 'Nimm dir Zeit.', 'Die hier ist beliebt in Prüfungen.', 'Weiter geht\'s.'];
const cardKey = c => c.type === 'packet' ? c.key : c.inline ? 'inline:' + c.id : 'card:' + c.id;
function qHead(card, extra) {
  return '<div class="q-meta">' + TYPE_META[card.type] + (extra ? ' · ' + extra : '') + (card.inline ? ' · NEU ERZEUGT' : '') + '</div>' +
    (card.topo ? topoHTML(card.topo) : '') + (card.out ? termBlock(card.outTitle, card.out) : '') +
    '<div class="q">' + fmt(card.q || 'Ergänze die fehlenden Felder.') + '</div>';
}

function runCards(app, cfg) {
  if (cfg.exam) return runExam(app, cfg);
  const stackMode = !!cfg.stackMode;
  const items = cfg.cards.map((c, k) => ({ c, k, tries: 0, ok: false }));
  const queue = items.slice();
  const total = items.length;
  const st = { pos: 0, firstOk: 0, credits: 0, streak: 0, jokers: { fifty: 2, hint: 2 }, answered: false, ctl: null, cleared: 0 };
  app.innerHTML = '<div class="s-cards">' + hudHTML(cfg.title, cfg.sub || '') +
    '<div class="cards-grid"><aside class="host"><div class="host-face">' + spr('chef', 5) + '</div>' +
    '<div class="bubble" data-r="bubble" aria-live="polite"></div><div class="jokers" data-r="jokers"></div><div class="progress" data-r="progress"></div></aside>' +
    '<section class="stage-wrap"><div class="stage" data-r="stage"></div><div class="verdict" data-r="verdict" hidden></div></section></div></div>';
  const R = k => $('[data-r="' + k + '"]', app);
  wireQuit(app, () => go(stackMode ? screenTitle : screenPlan));
  const say = t => { R('bubble').innerHTML = t; };

  function hud() {
    R('hud').innerHTML = hudItems([
      { icon: 'coin', v: st.credits + ' Cr', title: 'Verdienst' },
      { icon: 'flame', v: 'x' + (st.streak >= 3 ? 2 : 1), cls: 'combo', title: 'Serie' },
      { label: stackMode ? 'Vom Stapel' : 'Gelöst', v: (stackMode ? st.cleared : items.filter(i => i.ok).length) + '/' + total }
    ]);
  }
  function progress() {
    R('progress').innerHTML = '<small>' + (stackMode ? 'Zweimal hintereinander richtig = vom Stapel' : 'Fortschritt') + '</small><div class="bar">' +
      items.map(i => '<span class="seg ' + (i.ok ? 'on' : i.tries ? 're' : '') + '"></span>').join('') + '</div>';
  }
  function jokers() {
    const card = queue[st.pos] && queue[st.pos].c;
    const hint = card && (card.hint || TYPE_HINT[card.type]);
    R('jokers').innerHTML = '<button class="btn tiny" data-j="fifty" ' + (st.jokers.fifty && card && card.type === 'mc' && !st.answered ? '' : 'disabled') + '>50:50 (' + st.jokers.fifty + ')</button>' +
      '<button class="btn tiny" data-j="hint" ' + (st.jokers.hint && hint && !st.answered ? '' : 'disabled') + '>Tipp (' + st.jokers.hint + ')</button>';
    $('[data-j="fifty"]', app).onclick = () => { if (st.ctl && st.ctl.fifty && st.ctl.fifty()) { st.jokers.fifty--; AudioFX.play('click'); say('Zwei falsche Antworten sind weg.'); jokers(); } };
    $('[data-j="hint"]', app).onclick = () => { st.jokers.hint--; AudioFX.play('click'); say('<b>Tipp:</b> ' + fmt(hint)); jokers(); };
  }
  function load() {
    const it = queue[st.pos];
    st.answered = false;
    R('verdict').hidden = true;
    const stage = R('stage');
    stage.innerHTML = '';
    st.ctl = renderCard(it.c, stage, onAnswer) || {};
    say(it.tries ? 'Die kennst du schon. Diesmal klappt\'s!' : (stackMode ? 'Aus deinem Fehlerstapel.' : INTRO[Math.floor(Math.random() * INTRO.length)]));
    hud(); progress(); jokers();
  }
  function onAnswer(ok, info) {
    if (st.answered) return;
    st.answered = true;
    const it = queue[st.pos];
    const key = cardKey(it.c);
    let gain = 0, again = '';
    if (stackMode) {
      const r = stackHit(key, ok);
      if (ok && r === 'cleared') { it.ok = true; st.cleared++; gain = 2; again = 'Vom Stapel geflogen!'; }
      else if (ok) { queue.push(it); again = 'Noch einmal richtig, dann fliegt sie vom Stapel.'; gain = 1; }
      else { it.tries++; queue.splice(Math.min(st.pos + 3, queue.length), 0, it); again = 'Kommt gleich nochmal.'; }
    } else if (ok) {
      it.ok = true;
      if (!it.tries) st.firstOk++;
      gain = it.tries ? 1 : 3 + (st.streak >= 2 ? 1 : 0);
      stackHit(key, true);
    } else {
      it.tries++;
      stackAdd(it.c.inline ? { key, kind: 'inline', card: it.c } : { key, kind: 'card', id: it.c.id });
      queue.splice(Math.min(st.pos + 3, queue.length), 0, it);
      again = 'Kommt gleich nochmal und liegt auf deinem Fehlerstapel.';
    }
    st.streak = ok ? st.streak + 1 : 0;
    st.credits += gain;
    AudioFX.play(ok ? 'ok' : 'bad');
    say(ok ? PRAISE[Math.floor(Math.random() * PRAISE.length)] : COMFORT[Math.floor(Math.random() * COMFORT.length)]);
    const v = R('verdict');
    v.className = 'verdict ' + (ok ? 'ok' : 'bad');
    v.hidden = false;
    const part = !ok && info && info.frac > 0 ? '<span class="partial">' + Math.round(info.frac * 100) + ' % DER PUNKTE</span>' : '';
    v.innerHTML = '<div class="v-head">' + spr(ok ? 'check' : 'cross', 4) + (ok ? 'RICHTIG' : 'LEIDER FALSCH') + part + (gain ? '<span class="plus">+' + gain + ' Cr</span>' : '') + '</div>' +
      '<div class="v-body">' + (info && info.x ? info.x : fmt(it.c.x)) + '</div>' +
      '<div class="v-foot"><span class="again">' + again + '</span><button class="btn go" data-act="next">Weiter <kbd>Enter</kbd></button></div>';
    $('[data-act="next"]', v).onclick = next;
    hud(); progress(); jokers();
    later(() => { const r = v.getBoundingClientRect(); if (r.bottom > window.innerHeight) window.scrollBy({ top: r.bottom - window.innerHeight + 20, behavior: 'smooth' }); }, 60);
  }
  function next() {
    if (!st.answered) return;
    st.pos++;
    if (st.pos >= queue.length) { finish(); return; }
    load();
    const top = R('stage').getBoundingClientRect().top;
    if (top < 0) window.scrollBy({ top: top - 80, behavior: 'smooth' });
  }
  function finish() {
    if (stackMode) {
      go(screenReport, { kind: 'stack', title: 'NACHSITZEN', credits: st.credits, passed: true,
        stats: [['Karten bearbeitet', total], ['Vom Stapel geflogen', st.cleared], ['Noch auf dem Stapel', SAVE.stack.length]] });
      return;
    }
    const ratio = st.firstOk / total;
    const stars = ratio >= 0.9 ? 3 : ratio >= 0.7 ? 2 : 1;
    const wrong = items.filter(i => i.tries);
    go(screenReport, { kind: 'cards', day: cfg.day, title: cfg.title, stars, passed: true, credits: st.credits,
      stats: [['Karten', total], ['Beim ersten Versuch richtig', st.firstOk + ' / ' + total], ['Fehlversuche', items.reduce((a, i) => a + i.tries, 0)]],
      mistakes: wrong.map(i => '<div class="mq">' + fmt(i.c.q || i.c.title) + '</div><div class="ma">' + fmt(i.c.x) + '</div>') });
  }
  load();
  return {
    onKey(e) {
      if (st.answered) { if (e.key === 'Enter' || e.key === ' ') { next(); return true; } return; }
      if (e.key === 'Enter' && e.target && e.target.tagName === 'BUTTON' && !e.target.closest('.stage')) return;
      return st.ctl && st.ctl.onKey ? st.ctl.onKey(e) : undefined;
    }
  };
}

function renderCard(card, stage, answer) {
  renderCard.last = card;   /* für automatische Tests */
  switch (card.type) {
    case 'mc': return rMC(card, stage, answer);
    case 'tf': return rTF(card, stage, answer);
    case 'multi': return rMulti(card, stage, answer);
    case 'path': return rPath(card, stage, answer);
    case 'pick': return rPick(card, stage, answer);
    case 'fill': return rFill(card, stage, answer);
    case 'table': return rTable(card, stage, answer);
    case 'packet': return rPacket(card, stage, answer);
    case 'drops': return rDrops(card, stage, answer);
    case 'nft': return rNft(card, stage, answer);
  }
  return {};
}

function rMC(card, stage, answer) {
  const opts = shuffle(card.a.map((t, i) => ({ t, ok: i === card.c })));
  stage.innerHTML = qHead(card) + '<div class="answers' + (card.preOpts ? ' pre' : '') + '">' + opts.map((o, i) => '<button class="ans" data-i="' + i + '"><span class="k">' + (i + 1) + '</span><span>' + fmt(o.t).replace(/\n/g, '<br>') + '</span></button>').join('') + '</div>';
  const btns = $$('.ans', stage);
  let done = false;
  function choose(i) {
    if (done || !btns[i] || btns[i].disabled) return;
    done = true;
    btns[i].classList.add('chosen');
    btns.forEach((b, j) => { b.disabled = true; if (opts[j].ok) b.classList.add('right'); });
    if (!opts[i].ok) btns[i].classList.add('wrong');
    answer(opts[i].ok, { given: opts[i].t });
  }
  btns.forEach((b, i) => { b.onclick = () => choose(i); });
  return {
    onKey(e) { const n = parseInt(e.key, 10); if (n >= 1 && n <= opts.length) { choose(n - 1); return true; } },
    fifty() {
      const wrong = btns.filter((b, j) => !opts[j].ok && !b.disabled);
      if (wrong.length < 2) return false;
      shuffle(wrong).slice(0, wrong.length - 1).forEach(b => { b.classList.add('gone'); b.disabled = true; });
      return true;
    }
  };
}
function rTF(card, stage, answer) {
  stage.innerHTML = qHead(card) + '<div class="answers tf"><button class="ans" data-v="1"><span class="k">W</span>WAHR</button><button class="ans" data-v="0"><span class="k">F</span>FALSCH</button></div>';
  const btns = $$('.ans', stage);
  let done = false;
  function choose(v) {
    if (done) return;
    done = true;
    btns.forEach(b => { b.disabled = true; const bv = b.dataset.v === '1'; if (bv === v) b.classList.add('chosen'); if (bv === card.c) b.classList.add('right'); else if (bv === v) b.classList.add('wrong'); });
    answer(v === card.c, { given: v ? 'WAHR' : 'FALSCH' });
  }
  btns[0].onclick = () => choose(true);
  btns[1].onclick = () => choose(false);
  return {
    onKey(e) {
      const k = e.key.toLowerCase();
      if (k === 'w' || k === '1') { choose(true); return true; }
      if (k === 'f' || k === '2') { choose(false); return true; }
    }
  };
}
function rMulti(card, stage, answer) {
  const opts = shuffle(card.a.map((t, i) => ({ t, ok: card.c.indexOf(i) >= 0 })));
  const need = card.c.length;
  stage.innerHTML = qHead(card, need + ' richtige') + '<div class="answers">' + opts.map((o, i) => '<button class="ans" data-i="' + i + '" aria-pressed="false"><span class="k">' + (i + 1) + '</span><span>' + fmt(o.t) + '</span></button>').join('') + '</div>' +
    '<div class="board-actions"><button class="btn go" data-act="submit">Antwort einloggen <kbd>Enter</kbd></button><span class="muted" data-r="cnt">0 von ' + need + ' gewählt</span></div>';
  const btns = $$('.ans', stage), sel = new Set();
  let done = false;
  function toggle(i) {
    if (done) return;
    if (sel.has(i)) sel.delete(i); else sel.add(i);
    btns[i].classList.toggle('sel', sel.has(i));
    btns[i].setAttribute('aria-pressed', String(sel.has(i)));
    $('[data-r="cnt"]', stage).textContent = sel.size + ' von ' + need + ' gewählt';
    AudioFX.play('click');
  }
  function submit() {
    if (done) return;
    if (!sel.size) { toast('Wähle zuerst deine Antworten aus.'); return; }
    done = true;
    let ok = true;
    btns.forEach((b, i) => {
      b.disabled = true;
      if (opts[i].ok) b.classList.add('right');
      if (sel.has(i) !== opts[i].ok) { ok = false; if (sel.has(i)) b.classList.add('wrong'); }
    });
    $('[data-act="submit"]', stage).disabled = true;
    let cs = 0, ws = 0; sel.forEach(i => { if (opts[i].ok) cs++; else ws++; });
    answer(ok, { frac: Math.max(0, (cs - ws) / need), given: Array.from(sel).map(i => opts[i].t) });
  }
  btns.forEach((b, i) => { b.onclick = () => toggle(i); });
  $('[data-act="submit"]', stage).onclick = submit;
  return {
    onKey(e) {
      const n = parseInt(e.key, 10);
      if (n >= 1 && n <= opts.length) { toggle(n - 1); return true; }
      if (e.key === 'Enter') { submit(); return true; }
    }
  };
}

/* ---------- Hook-Board ---------- */
const HK = {
  pre: { l: 'PREROUTING', x: 3, y: 31, w: 18 },
  in: { l: 'INPUT', x: 24, y: 16, w: 18 },
  out: { l: 'OUTPUT', x: 64, y: 16, w: 18 },
  fwd: { l: 'FORWARD', x: 44, y: 31, w: 18 },
  post: { l: 'POSTROUTING', x: 76, y: 31, w: 19 }
};
const BH = 46;
const pct = v => (v / BH * 100).toFixed(3) + '%';
function boardHTML(isStatic) {
  const tri = (x, y, d) => {
    const a = 1.5, b = 0.95;
    const pts = d === 'r' ? [[x, y], [x - a, y - b], [x - a, y + b]] : d === 'u' ? [[x, y], [x - b, y + a], [x + b, y + a]] : [[x, y], [x - b, y - a], [x + b, y - a]];
    return '<polygon points="' + pts.map(p => p.join(',')).join(' ') + '"/>';
  };
  const lines = ['0,35 3,35', '21,35 30.5,35', '35.5,35 44,35', '62,35 76,35', '95,35 100,35', '33,32.5 33,24', '33,16 33,6 36,6', '70,6 73,6 73,16', '73,24 73,28 85.5,28 85.5,31'];
  const svg = '<svg class="wires" viewBox="0 0 100 46" preserveAspectRatio="none" aria-hidden="true">' +
    lines.map(l => '<polyline points="' + l + '" vector-effect="non-scaling-stroke"/>').join('') +
    tri(3, 35, 'r') + tri(30.5, 35, 'r') + tri(44, 35, 'r') + tri(76, 35, 'r') + tri(100, 35, 'r') + tri(33, 24, 'u') + tri(36, 6, 'r') + tri(73, 16, 'd') + tri(85.5, 31, 'd') +
    '<text x="33" y="44.6" text-anchor="middle">Routing-Entscheidung</text><text x="0.6" y="29.6">von außen</text><text x="99.4" y="29.6" text-anchor="end">nach außen</text></svg>';
  const tag = isStatic ? 'div' : 'button';
  const boxes = Object.keys(HK).map(k => { const h = HK[k]; return '<' + tag + ' class="hk" data-h="' + k + '" style="left:' + h.x + '%;top:' + pct(h.y) + ';width:' + h.w + '%;height:' + pct(8) + '">' + h.l + '<span class="ord"></span></' + tag + '>'; }).join('');
  const local = '<div class="lp" style="left:36%;top:' + pct(1.5) + ';width:34%;height:' + pct(9) + '">ROUTER SELBST<small>lokale Prozesse: sshd, DNS …</small></div>';
  const diamond = '<div class="diamond" style="left:30.5%;top:' + pct(32.5) + ';width:5%;height:' + pct(5) + '" title="Routing-Entscheidung"></div>';
  return '<div class="board ' + (isStatic ? 'static' : '') + '">' + svg + local + diamond + boxes + '<div class="pk" data-r="pk" hidden>' + spr('env', 2, { X: '#ffcd75' }) + '</div></div>';
}
const WAY = {
  fwd: [[0, 35], [12, 35], [33, 35], [53, 35], [85.5, 35], [100, 35]],
  in: [[0, 35], [12, 35], [33, 35], [33, 20], [33, 6], [53, 6]],
  out: [[53, 6], [73, 6], [73, 20], [73, 28], [85.5, 28], [85.5, 35], [100, 35]]
};
function animPacket(board, kind) {
  const pk = $('[data-r="pk"]', board), pts = WAY[kind];
  pk.hidden = false; pk.style.transition = 'none';
  pk.style.left = pts[0][0] + '%'; pk.style.top = pct(pts[0][1]);
  void pk.offsetWidth; pk.style.transition = '';
  let i = 1;
  (function step() {
    if (i >= pts.length) return;
    pk.style.left = pts[i][0] + '%'; pk.style.top = pct(pts[i][1]);
    AudioFX.play('step'); i++;
    later(step, 300);
  })();
}
function rPath(card, stage, answer) {
  stage.innerHTML = qHead(card, 'Hooks der Reihe nach anklicken') + boardHTML(false) +
    '<div class="path-line" data-r="pl">Dein Weg: <b>…</b></div>' +
    '<div class="board-actions"><button class="btn go" data-act="check">Prüfen <kbd>Enter</kbd></button><button class="btn" data-act="reset">Zurücksetzen <kbd>Rück</kbd></button></div>';
  const board = $('.board', stage), path = [];
  let done = false;
  function paint() {
    $$('.hk', board).forEach(b => { const i = path.indexOf(b.dataset.h); b.classList.toggle('chosen', i >= 0); $('.ord', b).textContent = i >= 0 ? String(i + 1) : ''; });
    $('[data-r="pl"]', stage).innerHTML = 'Dein Weg: ' + (path.length ? path.map(h => '<b>' + HK[h].l + '</b>').join(' &gt; ') : '<b>…</b>');
  }
  function click(h) { if (done) return; const i = path.indexOf(h); if (i >= 0) path.splice(i, 1); else path.push(h); AudioFX.play('click'); paint(); }
  function reset() { if (done) return; path.length = 0; paint(); }
  function check() {
    if (done) return;
    if (!path.length) { toast('Klick zuerst die Hooks an.'); return; }
    done = true;
    const ok = path.join() === card.c.join();
    $$('.hk', board).forEach(b => {
      const h = b.dataset.h; b.disabled = true; b.classList.remove('chosen');
      if (card.c.indexOf(h) >= 0) b.classList.add(path.indexOf(h) >= 0 ? 'good' : 'miss');
      else if (path.indexOf(h) >= 0) b.classList.add('badh');
      const i = card.c.indexOf(h); $('.ord', b).textContent = i >= 0 ? String(i + 1) : '';
    });

function drawPackets(sc, rs, pool, n) {
  const all = pool.map(spec => { const pkt = makePacket(sc, spec); return { spec, pkt, v: processPacket(sc, rs, pkt).verdict }; });
  const out = all.filter(x => x.spec.must).slice(0, n);
  const rest = shuffle(all.filter(x => !x.spec.must));
  const cap = Math.ceil(n / 2);
  let acc = out.filter(x => x.v === 'accept').length, drp = out.length - acc;
  rest.forEach(x => {
    if (out.length >= n) return;
    if (x.v === 'accept' && acc < cap) { out.push(x); acc++; }
    else if (x.v === 'drop' && drp < cap) { out.push(x); drp++; }
  });
  rest.forEach(x => { if (out.length < n && out.indexOf(x) < 0) out.push(x); });
  return shuffle(out).map(x => x.pkt);
}

      let el = qnodes.get(x.uid);
      if (!el) {
        el = document.createElement('div'); el.className = 'qenv';
        el.innerHTML = spr('env', 3, { X: envColor(x.pkt) });
        el.style.left = 'calc(61% + 28px - ' + ((k + 1) * 54) + 'px)';
        host.appendChild(el); qnodes.set(x.uid, el); void el.offsetWidth;
      }
      el.classList.toggle('cur', k === 0);
      el.style.left = 'calc(61% + 28px - ' + (k * 54) + 'px)';
    });
  }
  function boothLeave(uid, v) {
    const el = qnodes.get(uid); if (!el) return;
    qnodes.delete(uid);
    if (v === 'accept') { el.classList.add('go-acc'); R('lamp').classList.add('on'); later(() => R('lamp').classList.remove('on'), 700); later(() => el.remove(), 700); }
    else { el.classList.add('go-drp'); later(() => el.classList.add('fall'), 430); later(() => el.remove(), 950); }
  }

  function hud() {
    const mins = 8 * 60 + Math.round(Math.min(st.i, unique + 6) * (540 / Math.max(unique, 1)));
    const clock = String(Math.floor(mins / 60)).padStart(2, '0') + ':' + String(mins % 60 - (mins % 60) % 5).padStart(2, '0');
    const mult = st.streak >= 6 ? 3 : st.streak >= 3 ? 2 : 1;
    const items = [{ icon: 'clock', v: clock, title: 'Schichtuhr' }, { icon: 'coin', v: st.credits + ' Cr', title: 'Verdienst heute' }, { icon: 'flame', v: 'x' + mult, cls: 'combo', title: 'Combo' }];
    if (day.hearts) { let hs = ''; for (let i = 0; i < day.hearts; i++) hs += spr(i < st.hearts ? 'heart' : 'heart0', 3); items.push({ html: hs, title: 'Leben' }); }
    else items.push({ icon: 'warn', v: st.warnings, cls: 'warn', title: 'Verwarnungen' });
    items.push({ label: 'Rest', v: Math.max(queue.length - st.i, 0), title: 'Pakete in der Schlange' });
    R('hud').innerHTML = hudItems(items);
  }

  function load() {
    if (st.i >= queue.length) { finish(false); return; }
    const it = queue[st.i];
    if (it.phase !== st.phase) {
      const first = st.phase === -1;
      st.phase = it.phase;
      const ph = day.phases[it.phase];
      desk.setRuleset(RULESETS[ph.rs], !first);
      if (!first && ph.memo) { phaseMemo(ph); return; }
    }
    if (day.calls && st.since >= day.calls.every && st.callIdx < st.calls.length) { st.since = 0; phoneCall(); return; }
    desk.setPacket(it.pkt, st.i + 1);
    booth(); hud();
    st.t0 = performance.now();
    st.waiting = false;
  }
  function insertRetry(it) {
    const tries = (it.tries || 0) + 1;
    if (tries > 2) return false;   /* höchstens zweimal neu anstellen, danach wartet es im Fehlerstapel */
    let last = st.i;
    for (let j = st.i; j < queue.length; j++) if (queue[j].phase === it.phase) last = j;
    const pos = Math.min(st.i + 4, last + 1);
    queue.splice(pos, 0, { uid: uidc++, uid0: it.uid0 != null ? it.uid0 : it.uid, pkt: it.pkt, phase: it.phase, retry: true, tries });
    return true;
  }
  desk.onDecide(r => {
    const it = queue[st.i];
    AudioFX.play('stamp');
    boothLeave(it.uid, r.v);
    const secs = (performance.now() - st.t0) / 1000;
    const key = packetKey(rsOf(it).id, it.pkt);
    let gain = 0, complaint = null;
    if (r.ok) {
      st.streak++;
      if (!it.retry) st.firstOk++;
      const mult = st.streak >= 6 ? 3 : st.streak >= 3 ? 2 : 1;
      gain = (it.retry ? 2 : 5) * mult + (secs < 12 && !it.retry ? 2 : 0);
      st.credits += gain;
      later(() => AudioFX.play('ok'), 150);
      stackHit(key, true);
      if (day.complaints && it.pkt.ct === 'established' && r.res.verdict === 'drop') complaint = COMPLAINTS[Math.floor(Math.random() * COMPLAINTS.length)];
    } else {
      st.streak = 0; st.warnings++; st.credits -= 3;
      later(() => AudioFX.play('bad'), 150);
      const id0 = it.uid0 != null ? it.uid0 : it.uid;
      if (!st.mistakes.some(m => m.id0 === id0)) st.mistakes.push({ id0, pkt: it.pkt, r });
      stackAdd({ key, kind: 'packet', scen: sc.id, rs: rsOf(it).id, pkt: it.pkt, chooseChain: !!day.chooseChain, showNames: !!day.showNames, showIif: !!day.showIif });
      st.requeued = insertRetry(it);
      if (day.hearts) { st.hearts--; if (st.hearts <= 0) st.over = true; }
    }
    hud();
    const withChain = !!day.chooseChain;
    let sub = '';
    if (!r.ok) {
      const mine = (withChain ? (r.chain ? HOOK_LABEL[r.chain] : '?') + ' · ' : '') + r.v.toUpperCase();
      sub = '<div class="slip-sub">Deine Entscheidung: ' + mine + '<br>Richtig wäre: ' + verdictLine(r.res, withChain) + (withChain && !r.okChain ? '<br><b>Falsche Chain!</b>' : '') + '</div>';
    }
    const auto = r.ok && SAVE.settings.auto && !complaint;
    const html = (r.ok ? '<div class="slip-h ok"><span>KORREKT</span><span>+' + gain + ' Cr' + (st.streak >= 3 ? ' · Combo!' : '') + '</span></div>'
      : '<div class="slip-h bad"><span>VERWARNUNG</span><span>-3 Cr' + (day.hearts ? ' · -1 Leben' : '') + '</span></div>') + sub +
      explainHTML(sc, it.pkt, r.res) +
      (complaint ? '<div class="complaint"><b>Anruf:</b> ' + esc(complaint) + '<br>Laut Regelbuch richtig verworfen. Ohne ct-Regel kommen Antworten aber nicht durch.</div>' : '') +
      (!r.ok && !st.over ? '<div class="slip-sub">' + (st.requeued ? 'Das Paket stellt sich gleich noch einmal an.' : 'Das Paket wartet jetzt auf deinem Fehlerstapel.') + '</div>' : '') +
      '<div class="slip-foot">' + (auto ? '<span class="autobar"><i style="animation-duration:1.8s"></i></span>' : '<span></span>') +
      '<button class="btn go" data-act="next">' + (st.over ? 'Kündigung lesen' : 'Nächstes Paket') + ' <kbd>Leertaste</kbd></button></div>';
    const slip = desk.showSlip(html);
    $('[data-act="next"]', slip).onclick = next;
    st.waiting = true;
    if (auto) st.autoT = later(next, 1800);
    later(() => { const b = slip.getBoundingClientRect(); if (b.bottom > window.innerHeight) window.scrollBy({ top: b.bottom - window.innerHeight + 16, behavior: 'smooth' }); }, 80);
  });
  function next() {
    if (!st.waiting) return;
    st.waiting = false;
    clearTimeout(st.autoT);
    if (st.over) { finish(true); return; }
    desk.hideSlip();
    st.i++; st.since++;
    load();
  }
  function phaseMemo(ph) {
    AudioFX.play('memo');
    const m = openModal('<div class="modal-h">' + spr('chef', 4) + '<div><div class="memo-from">MITTEILUNG · 12:00 UHR · CHEFIN BRANDT</div><h2>Neues Regelbuch!</h2></div></div>' +
      '<div class="memo-body" style="font-size:22px">' + ph.memo + '</div><div class="memo-actions"><span></span><button class="btn go" data-act="ok">Verstanden <kbd>Enter</kbd></button></div>', { paper: true });
    const close = () => { closeModal(); load(); };
    $('[data-act="ok"]', m.el).onclick = close;
    m.onKey = e => { if (e.key === 'Enter' || e.key === ' ') { close(); return true; } };
  }
  function phoneCall() {
    const card = st.calls[st.callIdx++];
    AudioFX.play('ring');
    const m = openModal('<div class="modal-h"><div class="ring">' + spr('chef', 4) + '</div><div><div class="memo-from">ANRUF · CHEFIN BRANDT</div><h2>Kurze Frage zwischendurch!</h2></div></div>' +
      '<div class="stage" data-r="cs"></div><div class="verdict" data-r="cv" hidden></div>');
    let answered = false;
    const hang = () => { closeModal(); load(); };
    const ctl = rMC(card, $('[data-r="cs"]', m.el), ok => {
      answered = true;
      if (ok) { st.credits += 8; st.callOk++; AudioFX.play('ok'); stackHit('card:' + card.id, true); }
      else { AudioFX.play('bad'); stackAdd({ key: 'card:' + card.id, kind: 'card', id: card.id }); }
      hud();
      const v = $('[data-r="cv"]', m.el);
      v.hidden = false; v.className = 'verdict ' + (ok ? 'ok' : 'bad');
      v.innerHTML = '<div class="v-head">' + spr(ok ? 'check' : 'cross', 4) + (ok ? 'RICHTIG' : 'FALSCH') + (ok ? '<span class="plus">+8 Cr</span>' : '') + '</div><div class="v-body">' + fmt(card.x) + '</div>' +
        '<div class="v-foot"><span></span><button class="btn go" data-act="hang">Auflegen <kbd>Enter</kbd></button></div>';
      $('[data-act="hang"]', v).onclick = hang;
    });
    m.onKey = e => { if (answered) { if (e.key === 'Enter' || e.key === ' ') { hang(); return true; } return; } return ctl.onKey(e); };
  }
  function finish(lost) {
    let stars, passed;
    if (day.boss) { passed = !lost; stars = lost ? 0 : st.hearts; }
    else { const ratio = st.firstOk / unique; stars = ratio >= 0.9 ? 3 : ratio >= 0.75 ? 2 : ratio >= 0.5 ? 1 : 0; passed = stars > 0; }
    const stats = [['Pakete', unique], ['Beim ersten Mal richtig', st.firstOk + ' / ' + unique], ['Verwarnungen', st.warnings]];
    if (day.calls) stats.push(['Anrufe richtig', st.callOk + ' / ' + st.calls.length]);
    go(screenReport, { kind: 'shift', day, stars, passed, lost, boss: !!day.boss, credits: st.credits, stats,
      mistakes: st.mistakes.map(m => '<div class="mq">' + esc(pktSummary(sc, m.pkt)) + '</div><div class="ma">Richtig: ' + verdictLine(m.r.res, !!day.chooseChain) + '</div>' + explainHTML(sc, m.pkt, m.r.res)) });
  }
  load();
  return {
    onKey(e) {
      if (st.waiting) { if (e.key === ' ' || e.key === 'Enter') { next(); return true; } return; }
      return desk.onKey(e);
    }
  };
}

/* =====================================================================
   BAUMEISTER (Puzzle)
   ===================================================================== */
function runBuild(app, day) {
  const results = [];
  let pi = 0;
  function refName(sc, ref) {
    if (ref === 'lo') return '127.0.0.1 (lo)';
    if (ref.indexOf('R:') === 0) { const f = ifByName(sc, ref.slice(2)); return sc.router + ' ' + f.name + ' (' + f.ip + ')'; }
    return ref;
  }
  function loadPuzzle() {
    const pz = PUZZLES.find(p => p.id === day.puzzles[pi]);
    const sc = SCENARIOS[pz.scen];
    const chains = {}; pz.chains.forEach(c => { chains[c.name] = []; });
    let active = pz.chains[0].name, runs = 0, running = false, solved = false, solShown = false;
    const pkts = pz.tests.map(t => makePacket(sc, t));
    app.innerHTML = '<div class="s-build">' + hudHTML('TAG ' + day.n + ' · BAUMEISTER', 'Auftrag ' + (pi + 1) + ' von ' + day.puzzles.length + ': ' + esc(pz.title)) +
      '<div class="build-top"><div class="panel"><div class="panel-h"><span>AUFTRAG ' + (pi + 1) + '/' + day.puzzles.length + '</span><span>' + esc(pz.title) + '</span></div>' +
      '<div class="task"><div>' + pz.task + '</div><div class="muted">Policy der Chains: drop. Baustein anklicken (landet in der aktiven Chain) oder hineinziehen.</div></div></div>' +
      '<div class="panel"><div class="panel-h"><span>NETZPLAN</span><span>' + esc(sc.name) + '</span></div><div data-r="map">' + mapHTML(sc) + '</div></div></div>' +
      '<div class="build-mid"><div class="panel"><div class="panel-h"><span>BAUSTEINE</span><span>beliebig oft nutzbar</span></div><div class="pool" data-r="pool">' +
      shuffle(pz.pool.slice()).map(t => '<button class="brick" draggable="true" data-t="' + esc(t) + '">' + esc(t) + '</button>').join('') + '</div></div>' +
      '<div class="chainboxes" data-r="chains"></div></div>' +
      '<div class="panel"><div class="panel-h"><span>TESTPAKETE</span><span data-r="score"></span></div><div class="tests"><div class="tbl-wrap"><table><thead><tr><th>Paket</th><th>Soll</th><th>Ergebnis</th></tr></thead><tbody>' +
      pz.tests.map(t => '<tr><td>' + esc(t.label || (refName(sc, t.from) + ' → ' + refName(sc, t.to) + ' · ' + SVC[t.svc].name + (t.reply ? ' (Antwort)' : ''))) + '</td><td><span class="pill ' + (t.expect === 'accept' ? 'acc' : 'drp') + '">' + t.expect.toUpperCase() + '</span></td><td class="res">–</td></tr>').join('') +
      '</tbody></table></div><div data-r="lint"></div><div class="build-foot"><button class="btn go big" data-act="sim">Simulation starten <kbd>Enter</kbd></button><span data-r="msg" class="muted"></span>' +
      '<span style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" data-act="sol" hidden>Musterlösung zeigen</button><button class="btn go" data-act="next" hidden>' + (pi + 1 < day.puzzles.length ? 'Nächster Auftrag &gt;' : 'Feierabend &gt;') + '</button></span></div></div></div></div>';
    const R = k => $('[data-r="' + k + '"]', app);
    wireQuit(app, () => go(screenPlan));
    function hud() {
      R('hud').innerHTML = hudItems([{ label: 'Simulationen', v: runs }, { icon: 'star', v: results.reduce((a, r) => a + (r ? r.stars : 0), 0) + '/' + day.puzzles.length * 3, title: 'Sterne bisher' }]);
    }
    function renderChains() {
      R('chains').innerHTML = pz.chains.map(c => '<div class="chainbox ' + (active === c.name ? 'active' : '') + '" data-chain="' + c.name + '">' +
        '<button class="chainbox-h" data-act="activate">chain ' + c.name + ' { type filter hook ' + c.hook + ' priority 0; policy ' + c.policy + ';' + (active === c.name ? '<span class="tag">AKTIV</span>' : '') + '</button>' +
        '<ol class="slots" data-chain="' + c.name + '">' + (chains[c.name].length ? chains[c.name].map((t, i) => '<li class="slot" draggable="true" data-i="' + i + '"><span class="no">#' + (i + 1) + '</span><span class="txt">' + esc(t) + '</span>' +
          '<span class="ctl"><button data-op="up" aria-label="Regel nach oben">&#9650;</button><button data-op="down" aria-label="Regel nach unten">&#9660;</button><button data-op="del" aria-label="Regel entfernen">&#10005;</button></span></li>').join('')
          : '<li class="dropzone-hint">Baustein hierher ziehen oder anklicken</li>') + '</ol>' +
        '<div class="chainbox-f">}  passt keine Regel: policy ' + c.policy + '</div></div>').join('');
      $$('.chainbox', app).forEach(box => {
        const cn = box.dataset.chain;
        $('[data-act="activate"]', box).onclick = () => { active = cn; renderChains(); AudioFX.play('click'); };
        $$('.slot', box).forEach(sl => {
          const i = +sl.dataset.i;
          $$('[data-op]', sl).forEach(b => {
            b.onclick = ev => {
              ev.stopPropagation();
              const arr = chains[cn];
              if (b.dataset.op === 'up' && i > 0) { const t = arr[i - 1]; arr[i - 1] = arr[i]; arr[i] = t; }
              if (b.dataset.op === 'down' && i < arr.length - 1) { const t = arr[i + 1]; arr[i + 1] = arr[i]; arr[i] = t; }
              if (b.dataset.op === 'del') arr.splice(i, 1);
              AudioFX.play('click'); changed(); renderChains();
            };
          });
          sl.addEventListener('dragstart', ev => { ev.dataTransfer.setData('text/plain', 's|' + cn + '|' + i); ev.dataTransfer.effectAllowed = 'move'; sl.classList.add('dragging'); });
          sl.addEventListener('dragend', () => sl.classList.remove('dragging'));
        });
        const list = $('.slots', box);
        const insIndex = y => { const sl = $$('.slot', list); for (let k = 0; k < sl.length; k++) { const r = sl[k].getBoundingClientRect(); if (y < r.top + r.height / 2) return k; } return sl.length; };
        const clearIns = () => { $$('.slot', list).forEach(s => s.classList.remove('ins-before')); list.classList.remove('over'); };
        list.addEventListener('dragover', ev => {
          ev.preventDefault(); list.classList.add('over');
          const k = insIndex(ev.clientY); $$('.slot', list).forEach((s, j) => s.classList.toggle('ins-before', j === k));
        });
        list.addEventListener('dragleave', ev => { if (!list.contains(ev.relatedTarget)) clearIns(); });
        list.addEventListener('drop', ev => {
          ev.preventDefault();
          const k = insIndex(ev.clientY); clearIns();
          const data = ev.dataTransfer.getData('text/plain');
          if (!data) return;
          const parts = data.split('|');
          if (parts[0] === 'p') { chains[cn].splice(k, 0, parts.slice(1).join('|')); }
          else if (parts[0] === 's') {
            const from = parts[1], fi = +parts[2];
            const [t] = chains[from].splice(fi, 1);
            let at = k; if (from === cn && fi < k) at--;
            chains[cn].splice(at, 0, t);
          }
          active = cn; AudioFX.play('click'); changed(); renderChains();
        });
      });
    }
    function changed() { if (!solved) R('msg').textContent = ''; }
    $$('.brick', app).forEach(b => {
      b.onclick = () => { chains[active].push(b.dataset.t); AudioFX.play('click'); changed(); renderChains(); };
      b.addEventListener('dragstart', ev => { ev.dataTransfer.setData('text/plain', 'p|' + b.dataset.t); ev.dataTransfer.effectAllowed = 'copy'; b.classList.add('dragging'); });
      b.addEventListener('dragend', () => b.classList.remove('dragging'));
    });
    function lint(hits) {
      const notes = [];
      pz.chains.forEach(c => chains[c.name].forEach((t, i) => {
        const r = parseRule(t);
        if (c.hook === 'input' && r.m.oif) notes.push('<code>' + esc(t) + '</code> in ' + c.name + ' greift nie: In INPUT gibt es kein Ausgangs-Interface.');
        else if (c.hook === 'output' && r.m.iif) notes.push('<code>' + esc(t) + '</code> in ' + c.name + ' greift nie: Lokal erzeugte Pakete haben kein Eingangs-Interface.');
        else if (hits && !hits[c.name][i]) notes.push('<code>' + esc(t) + '</code> in ' + c.name + ' hat bei keinem Testpaket entschieden. Ist sie überflüssig?');
      }));
      R('lint').innerHTML = notes.length ? '<div class="lint"><b>Hinweise:</b><br>' + notes.join('<br>') + '</div>' : '';
    }
    function simulate() {
      if (running) return;
      if (!pz.chains.some(c => chains[c.name].length)) { toast('Leg zuerst Regeln in eine Chain.'); return; }
      running = true; runs++; hud();
      const rs = buildRS({ id: 'pz', tables: [{ fam: 'inet', name: 'filter', chains: pz.chains.map(c => ({ name: c.name, type: 'filter', hook: c.hook, prio: 0, policy: c.policy, rules: chains[c.name].slice() })) }] });
      const hits = {}; pz.chains.forEach(c => { hits[c.name] = chains[c.name].map(() => 0); });
      const rows = $$('tbody tr', app).filter(tr => tr.closest('.tests'));
      rows.forEach(r => { $('.res', r).textContent = '…'; });
      let passed = 0;
      R('msg').textContent = 'Simulation läuft …';
      pkts.forEach((p, i) => later(() => {
        rows.forEach(r => r.classList.remove('run')); rows[i].classList.add('run');
        const res = processPacket(sc, rs, p), ok = res.verdict === pz.tests[i].expect;
        if (res.chain && res.idx >= 0) hits[res.chain.name][res.idx]++;
        if (ok) passed++;
        $('.res', rows[i]).innerHTML = '<span class="' + (ok ? 'res-ok' : 'res-bad') + '">' + (ok ? 'OK' : 'FALSCH') + '</span> · ' + res.verdict.toUpperCase() +
          ' <span class="muted">(' + (res.chain ? res.chain.name + ' ' + (res.idx >= 0 ? '#' + (res.idx + 1) : 'policy') : 'keine Chain') + ')</span>';
        markMap(R('map'), p, res);
        AudioFX.play(ok ? 'click' : 'step');
        if (i === pkts.length - 1) later(() => done(passed, hits), 300);
      }, 280 * i));
    }
    function done(passed, hits) {
      running = false;
      $$('tbody tr', app).forEach(r => r.classList.remove('run'));
      const total = pz.tests.length;
      R('score').textContent = passed + ' / ' + total + ' bestanden';
      if (passed === total) {
        if (!solved) { solved = true; const stars = solShown ? 1 : runs === 1 ? 3 : runs <= 3 ? 2 : 1; results[pi] = { stars, runs }; }
        AudioFX.play('win');
        R('msg').innerHTML = '<b style="color:var(--ok-hi)">Auftrag erfüllt!</b> ' + starsHTML(results[pi].stars, 3).replace(/<svg/g, '<svg style="display:inline-block"');
        $('[data-act="next"]', app).hidden = false;
        $('[data-act="sol"]', app).hidden = true;
        lint(hits);
      } else {
        AudioFX.play('bad');
        R('msg').textContent = passed + ' von ' + total + ' Tests bestanden. Schau dir die roten Zeilen an und passe die Regeln an.';
        if (runs >= 3 && !solShown) $('[data-act="sol"]', app).hidden = false;
        lint(null);
      }
      hud();
    }
    $('[data-act="sim"]', app).onclick = simulate;
    $('[data-act="sol"]', app).onclick = () => {
      solShown = true;
      pz.chains.forEach(c => { chains[c.name] = (pz.solution[c.name] || []).slice(); });
      renderChains();
      $('[data-act="sol"]', app).hidden = true;
      toast('Musterlösung eingesetzt. Starte die Simulation und schau, warum sie passt.');
    };
    $('[data-act="next"]', app).onclick = () => {
      pi++;
      if (pi < day.puzzles.length) { loadPuzzle(); window.scrollTo(0, 0); }
      else {
        const avg = results.reduce((a, r) => a + r.stars, 0) / results.length;
        go(screenReport, { kind: 'build', day, stars: Math.max(1, Math.round(avg)), passed: true, credits: results.reduce((a, r) => a + r.stars * 6, 0),
          stats: day.puzzles.map((id, k) => [PUZZLES.find(p => p.id === id).title, results[k].stars + ' Sterne · ' + results[k].runs + ' Simulation' + (results[k].runs === 1 ? '' : 'en')]) });
      }
    };
    renderChains(); hud();
    SCREEN = {
      onKey(e) {
        if (e.key === 'Enter' && e.target && e.target.tagName === 'BUTTON') return;
        if (e.key === 'Enter') { if (solved && !$('[data-act="next"]', app).hidden) $('[data-act="next"]', app).click(); else simulate(); return true; }
      }
    };
  }
  loadPuzzle();
  return SCREEN;
}

/* =====================================================================
   TAGESBERICHT
   ===================================================================== */
function screenReport(app, Rp) {
  const day = Rp.day;
  const lines = [];
  let net = Rp.credits;
  if (Rp.kind === 'shift') {
    lines.push(['Verdienst der Schicht', Rp.credits]);
    sample(EXPENSES, 2).forEach(e => { lines.push([e[0], -e[1]]); net -= e[1]; });
  } else lines.push([Rp.kind === 'stack' ? 'Nachsitz-Prämie' : 'Prämie', Rp.credits]);
  SAVE.credits += net;
  if (day && Rp.stars > (SAVE.stars[day.id] || 0)) SAVE.stars[day.id] = Rp.stars;
  persist();
  AudioFX.play(Rp.passed ? 'win' : 'lose');
  let headline = 'TAGESBERICHT', cls = '';
  if (Rp.boss && Rp.passed) { headline = 'FESTANGESTELLT!'; cls = 'win'; }
  else if (Rp.boss) { headline = 'GEKÜNDIGT!'; cls = 'lose'; }
  else if (!Rp.passed) { headline = 'SCHICHT NICHT BESTANDEN'; cls = 'lose'; }
  const sign = v => (v >= 0 ? '+' : '') + v + ' Cr';
  const nextDay = day ? DAYS[DAYS.indexOf(day) + 1] : null;
  const lead = Rp.boss && Rp.passed ? 'Drei Zonen, NAT und Anrufe der Chefin: Du hast alles im Griff. Willkommen im Team!'
    : Rp.boss ? 'Drei Fehler im Rechenzentrum. Lies die Erklärungen unten und versuch es nochmal.'
    : !Rp.passed ? 'Weniger als die Hälfte war beim ersten Mal richtig. Lies die Fehler unten und starte die Schicht neu.'
    : Rp.kind === 'stack' ? 'Gut nachgesessen. Was noch nicht sitzt, bleibt auf dem Stapel.' : 'Schicht erledigt. Hier ist deine Abrechnung.';
  app.innerHTML = '<div class="report"><article class="report-paper">' +
    '<div class="memo-from">' + (day ? 'TAG ' + day.n + ' · ' + esc(day.title.toUpperCase()) : esc(Rp.title || '')) + '</div>' +
    '<div class="verdict-big ' + cls + '">' + headline + '</div>' +
    (day ? '<div class="report-stars">' + starsHTML(Rp.stars, 3).replace(/width="27" height="27"/g, 'width="45" height="45"') + '</div>' : '') +
    '<p style="font-size:22px">' + lead + '</p>' +
    '<dl class="ledger">' + (Rp.stats || []).map(s => '<dt>' + esc(s[0]) + '</dt><dd style="margin:0">' + esc(s[1]) + '</dd>').join('') + '</dl>' +
    '<div class="ledger">' + lines.map(l => '<span>' + esc(l[0]) + '</span><span class="' + (l[1] < 0 ? 'neg' : 'pos') + '">' + sign(l[1]) + '</span>').join('') +
    '<span class="sum">Auf dein Konto</span><span class="sum">' + sign(net) + '</span><span>Kontostand</span><span>' + SAVE.credits + ' Cr</span></div>' +
    (Rp.mistakes && Rp.mistakes.length ? '<h2>Deine Fehler zum Nachlesen</h2><div class="mistakes">' + Rp.mistakes.map(m => '<div class="mistake">' + m + '</div>').join('') + '</div>' +
      '<p style="font-size:20px">Alle Fehler liegen auf deinem <b>Fehlerstapel</b>. Beim Nachsitzen kommen sie wieder, bis du sie zweimal hintereinander richtig hast.</p>' : '') +
    '</article><div class="report-actions">' +
    (day ? '<button class="btn" data-act="again">Nochmal spielen</button>' : '') +
    (SAVE.stack.length ? '<button class="btn warnb" data-act="stack">Nachsitzen (' + SAVE.stack.length + ')</button>' : '') +
    '<button class="btn" data-act="plan">Dienstplan</button>' +
    (nextDay && Rp.passed ? '<button class="btn go" data-act="next">Tag ' + nextDay.n + ' &gt;</button>' : '') + '</div></div>';
  const bind = (a, fn) => { const b = $('[data-act="' + a + '"]', app); if (b) b.onclick = fn; };
  bind('again', () => go(screenMemo, day));
  bind('stack', () => go(screenStack));
  bind('plan', () => go(screenPlan));
  bind('next', () => go(screenMemo, nextDay));
  return {
    onKey(e) {
      if (e.key === 'Enter') { if (nextDay && Rp.passed) go(screenMemo, nextDay); else go(screenPlan); return true; }
      if (e.key === 'Escape') { go(screenPlan); return true; }
    }
  };
}

function stackToCard(s) {
  if (s.kind === 'card') return CARDS[s.id] || null;
  if (s.kind === 'inline') return s.card || null;
  if (s.kind === 'packet' && s.pkt && SCENARIOS[s.scen] && RULESETS[s.rs]) {
    return { type: 'packet', id: s.key, key: s.key, q: 'Ein Paket aus deinem Fehlerstapel. Prüf es nochmal!', scen: s.scen, rs: s.rs, pkt: s.pkt,
      chooseChain: s.chooseChain, showNames: s.showNames, showIif: s.showIif };

  return null;
}

/* ---------- Dropdown-Liste (Zuordnung, Matrix, Werte) ---------- */
function rDrops(card, stage, answer) {
  let lastH = null;
  const rows = card.items.map((it, i) => {
    const head = it.h && it.h !== lastH ? '<div class="dr-h">' + esc(it.h) + '</div>' : '';
    if (it.h) lastH = it.h;
    const id = 'dr-' + card.id + '-' + i;
    return head + '<div class="dr-row"><label class="dr-p" for="' + id + '">' + fmt(it.p) + '</label>' +
      '<select class="sel dr-s" id="' + id + '"><option value="">-- wählen --</option>' + optsHTML(it.o || card.opts || []) + '</select>' +
      '<div class="dr-x" hidden></div></div>';
  }).join('');
  stage.innerHTML = qHead(card, card.items.length + ' Dropdowns') + '<div class="drops">' + rows + '</div>' +
    '<div class="board-actions"><button class="btn go" data-act="sub">Abgeben <kbd>Enter</kbd></button><span class="muted" data-r="cnt">0 von ' + card.items.length + ' ausgefüllt</span></div>';
  const sels = $$('.dr-s', stage);
  let done = false;
  sels.forEach(s => s.addEventListener('change', () => { $('[data-r="cnt"]', stage).textContent = sels.filter(x => x.value).length + ' von ' + sels.length + ' ausgefüllt'; }));
  function submit() {
    if (done) return;
    const empty = sels.find(s => !s.value);
    if (empty) { toast('Es sind noch Dropdowns offen.'); empty.focus(); return; }
    done = true;
    let nGood = 0;
    sels.forEach((s, i) => {
      const it = card.items[i], good = s.value === it.c, x = s.parentNode.querySelector('.dr-x');
      s.disabled = true; s.classList.add(good ? 'okc' : 'badc');
      if (good) nGood++;
      const why = (good ? '' : '<b>richtig: ' + esc(it.c) + '</b>' + (it.x ? ' · ' : '')) + (it.x ? esc(it.x) : '');
      if (why) { x.innerHTML = why; x.hidden = false; x.classList.toggle('good', good); }
    });
    $('[data-act="sub"]', stage).disabled = true;
    answer(nGood === sels.length, { frac: nGood / sels.length, given: sels.map(s => s.value) });
  }
  $('[data-act="sub"]', stage).onclick = submit;
  return { onKey(e) { if (e.key === 'Enter') { submit(); return true; } } };
}
