function Desk(root, sc, o) {
  root.innerHTML = '<div class="desk"><div class="desk-left"><div data-r="pass"></div>' +
    (o.chooseChain ? '<div class="chainpick" data-r="cp"><span class="lbl">ZUSTÄNDIG?</span>' + ['input', 'forward', 'output'].map((h, i) => '<button class="btn chain" data-chain="' + h + '"><kbd>' + (i + 1) + '</kbd>' + HOOK_LABEL[h] + '</button>').join('') + '</div>' : '') +
    '<div class="stamps"><button class="btn stamp-btn acc" data-v="accept"><kbd>A</kbd>ACCEPT</button><button class="btn stamp-btn drp" data-v="drop"><kbd>D</kbd>DROP</button></div>' +
    '<div class="slip" data-r="slip" hidden></div></div>' +
    '<div class="desk-right"><div class="panel"><div class="panel-h"><span>NETZPLAN</span><span>' + esc(sc.name) + '</span></div><div data-r="map">' + mapHTML(sc) + '</div></div>' +
    '<div class="panel"><div class="panel-h"><span>REGELBUCH</span><span class="upd" data-r="bookstate"></span></div><div class="rules-wrap" data-r="book"></div></div></div></div>';
  const R = k => $('[data-r="' + k + '"]', root);
  let rs = null, pkt = null, choice = null, locked = true, cb = null, given = null;
  function setRuleset(newRs, flash) {
    rs = newRs;
    R('book').innerHTML = bookHTML(rs);
    if (flash) { R('bookstate').textContent = 'NEU AKTUALISIERT'; const r = $('.rules', R('book')); r.classList.add('flash'); }
  }
  function setPacket(p, no) {
    pkt = p; choice = null; locked = false;
    given = o.chooseChain ? null : processPacket(sc, rs, p).hook;
    R('pass').innerHTML = passHTML(sc, p, { showNames: o.showNames, showIif: o.showIif, givenChain: given }, no);
    R('slip').hidden = true;
    $$('.chain', root).forEach(b => { b.classList.remove('sel'); b.disabled = false; });
    $$('.stamp-btn', root).forEach(b => { b.disabled = false; });
    markBook(R('book'), null, given);
    markMap(R('map'), null);
  }
  function pickChain(h) {
    if (locked) return;
    choice = h;
    $$('.chain', root).forEach(b => b.classList.toggle('sel', b.dataset.chain === h));
    AudioFX.play('click');
  }
  function stamp(v) {
    if (locked) return;
    if (o.chooseChain && !choice) {
      const cp = R('cp'); cp.classList.remove('nudge'); void cp.offsetWidth; cp.classList.add('nudge');
      toast('Erst die zuständige Chain wählen: 1, 2 oder 3');
      return;
    }
    locked = true;
    const res = processPacket(sc, rs, pkt);
    const okChain = !o.chooseChain || choice === res.hook;
    const okVerdict = v === res.verdict;
    const passEl = $('.pass', R('pass'));
    const mark = $('.stamp-mark', passEl);
    mark.className = 'stamp-mark ' + (v === 'accept' ? 'acc' : 'drp');
    mark.textContent = v === 'accept' ? 'ACCEPT' : 'DROP';
    mark.hidden = false;
    passEl.classList.add('thud');
    $$('.chain, .stamp-btn', root).forEach(b => { b.disabled = true; });
    markBook(R('book'), res, null);
    markMap(R('map'), pkt, res);
    if (cb) cb({ ok: okChain && okVerdict, okChain, okVerdict, v, chain: choice, res });
  }
  $$('.chain', root).forEach(b => { b.onclick = () => pickChain(b.dataset.chain); });
  $$('.stamp-btn', root).forEach(b => { b.onclick = () => stamp(b.dataset.v); });
  return {
    setRuleset, setPacket, stamp,
    onDecide(fn) { cb = fn; },
    showSlip(html) { const s = R('slip'); s.innerHTML = html; s.hidden = false; return s; },
    hideSlip() { R('slip').hidden = true; },
    clearBookFlag() { R('bookstate').textContent = ''; },
    onKey(e) {
      if (locked) return;
      const k = e.key.toLowerCase();
      if (o.chooseChain && (k === '1' || k === '2' || k === '3')) { pickChain(['input', 'forward', 'output'][+k - 1]); return true; }
      if (k === 'a') { stamp('accept'); return true; }
      if (k === 'd') { stamp('drop'); return true; }
    }
  };
}

function rPacket(card, stage, answer) {
  const sc = SCENARIOS[card.scen], rs = RULESETS[card.rs];
  stage.innerHTML = qHead(card, card.chooseChain ? 'erst Chain, dann Stempel' : 'Stempel wählen') + '<div data-r="deskmount"></div>';
  const desk = Desk($('[data-r="deskmount"]', stage), sc, { chooseChain: card.chooseChain, showNames: card.showNames, showIif: card.showIif });
  desk.setRuleset(rs);
  desk.setPacket(card.pkt, 1);
  desk.onDecide(r => {
    AudioFX.play('stamp');
    answer(r.ok, { x: 'Richtig ist ' + verdictLine(r.res, card.chooseChain) + '.' + explainHTML(sc, card.pkt, r.res) });
  });
  return { onKey: desk.onKey };
}

/* =====================================================================
   SCHICHT (Papers-Please-Modus)
   ===================================================================== */
function drawPackets(sc, rs, pool, n) {
  const all = pool.map(spec => { const pkt = makePacket(sc, spec); return { spec, pkt, v: processPacket(sc, rs, pkt).verdict }; });
  const out = all.filter(x => x.spec.must).slice(0, n);
  const rest = shuffle(all.filter(x => !x.spec.must));
  const cap = Math.ceil(n / 2);
  let acc = out.filter(x => x.v === 'accept').length, drp = out.length - acc;
  rest.forEach(x => {
    if (out.length >= n) return;
    if (x.v === 'accept' && acc < cap) { out.push(x); acc++; }
    else if (x.v === 'drop' && drp < cap) { out.push(x); drp++; }
  });
  rest.forEach(x => { if (out.length < n && out.indexOf(x) < 0) out.push(x); });
  return shuffle(out).map(x => x.pkt);
}
const ZCOL = { eth0: '#41a6f6', eth1: '#ffcd75', eth2: '#ef7d57' };

function runShift(app, day) {
  const sc = SCENARIOS[day.scen];
  let uidc = 0;
  const queue = [];
  day.phases.forEach((ph, pi) => drawPackets(sc, RULESETS[ph.rs], POOLS[ph.pool], ph.count).forEach(pkt => queue.push({ uid: uidc++, pkt, phase: pi, retry: false })));
  const unique = queue.length;
  const st = { i: 0, phase: -1, credits: 0, streak: 0, warnings: 0, firstOk: 0, hearts: day.hearts || 0, since: 0, callIdx: 0, callOk: 0,
    calls: day.calls ? sample(GROUPS[day.calls.group], day.calls.n).map(id => CARDS[id]) : [], mistakes: [], t0: 0, waiting: false, over: false, autoT: null };
  app.innerHTML = '<div class="s-shift">' + hudHTML('TAG ' + day.n + ' · ' + esc(day.title.toUpperCase()), esc(sc.name)) +
    '<div class="booth" aria-hidden="true"><span class="booth-sign">WARTESCHLANGE</span><div class="booth-window"><span>SCHALTER</span></div>' +
    '<div class="booth-pit"><span>/dev/null</span></div><div class="booth-gate"><span>DURCHGANG</span><i class="lamp" data-r="lamp"></i></div><div data-r="q"></div></div>' +
    '<div data-r="desk"></div></div>';
  const R = k => $('[data-r="' + k + '"]', app);
  wireQuit(app, () => go(screenPlan));
  const desk = Desk(R('desk'), sc, { chooseChain: day.chooseChain, showNames: day.showNames, showIif: day.showIif });
  const rsOf = it => RULESETS[day.phases[it.phase].rs];

  /* Warteschlange */
  const qnodes = new Map();
  function envColor(p) { if (p.local) return '#a7f070'; const f = ifByName(sc, p.iif); if (f && f.internet) return '#c77dff'; return ZCOL[p.iif] || '#94b0c2'; }
  function booth() {
    const host = R('q'), vis = queue.slice(st.i, st.i + 9), ids = new Set(vis.map(x => x.uid));
    qnodes.forEach((el, id) => { if (!ids.has(id)) { el.remove(); qnodes.delete(id); } });
    vis.forEach((x, k) => {
      let el = qnodes.get(x.uid);
      if (!el) {
        el = document.createElement('div'); el.className = 'qenv';
        el.innerHTML = spr('env', 3, { X: envColor(x.pkt) });
        el.style.left = 'calc(61% + 28px - ' + ((k + 1) * 54) + 'px)';
        host.appendChild(el); qnodes.set(x.uid, el); void el.offsetWidth;
      }
      el.classList.toggle('cur', k === 0);
      el.style.left = 'calc(61% + 28px - ' + (k * 54) + 'px)';
    });
  }
  function boothLeave(uid, v) {
    const el = qnodes.get(uid); if (!el) return;
    qnodes.delete(uid);
    if (v === 'accept') { el.classList.add('go-acc'); R('lamp').classList.add('on'); later(() => R('lamp').classList.remove('on'), 700); later(() => el.remove(), 700); }
    else { el.classList.add('go-drp'); later(() => el.classList.add('fall'), 430); later(() => el.remove(), 950); }
  }

  function hud() {
    const mins = 8 * 60 + Math.round(Math.min(st.i, unique + 6) * (540 / Math.max(unique, 1)));
    const clock = String(Math.floor(mins / 60)).padStart(2, '0') + ':' + String(mins % 60 - (mins % 60) % 5).padStart(2, '0');
    const mult = st.streak >= 6 ? 3 : st.streak >= 3 ? 2 : 1;
    const items = [{ icon: 'clock', v: clock, title: 'Schichtuhr' }, { icon: 'coin', v: st.credits + ' Cr', title: 'Verdienst heute' }, { icon: 'flame', v: 'x' + mult, cls: 'combo', title: 'Combo' }];
    if (day.hearts) { let hs = ''; for (let i = 0; i < day.hearts; i++) hs += spr(i < st.hearts ? 'heart' : 'heart0', 3); items.push({ html: hs, title: 'Leben' }); }
    else items.push({ icon: 'warn', v: st.warnings, cls: 'warn', title: 'Verwarnungen' });
    items.push({ label: 'Rest', v: Math.max(queue.length - st.i, 0), title: 'Pakete in der Schlange' });
    R('hud').innerHTML = hudItems(items);
  }

  function load() {
    if (st.i >= queue.length) { finish(false); return; }
    const it = queue[st.i];
    if (it.phase !== st.phase) {
      const first = st.phase === -1;
      st.phase = it.phase;
      const ph = day.phases[it.phase];
      desk.setRuleset(RULESETS[ph.rs], !first);
      if (!first && ph.memo) { phaseMemo(ph); return; }
    }
    if (day.calls && st.since >= day.calls.every && st.callIdx < st.calls.length) { st.since = 0; phoneCall(); return; }
    desk.setPacket(it.pkt, st.i + 1);
    booth(); hud();
    st.t0 = performance.now();
    st.waiting = false;
  }
  function insertRetry(it) {
    const tries = (it.tries || 0) + 1;
    if (tries > 2) return false;   /* höchstens zweimal neu anstellen, danach wartet es im Fehlerstapel */
    let last = st.i;
    for (let j = st.i; j < queue.length; j++) if (queue[j].phase === it.phase) last = j;
    const pos = Math.min(st.i + 4, last + 1);
    queue.splice(pos, 0, { uid: uidc++, uid0: it.uid0 != null ? it.uid0 : it.uid, pkt: it.pkt, phase: it.phase, retry: true, tries });
    return true;
  }
  desk.onDecide(r => {
    const it = queue[st.i];
    AudioFX.play('stamp');
    boothLeave(it.uid, r.v);
    const secs = (performance.now() - st.t0) / 1000;
    const key = packetKey(rsOf(it).id, it.pkt);
    let gain = 0, complaint = null;
    if (r.ok) {
      st.streak++;
      if (!it.retry) st.firstOk++;
      const mult = st.streak >= 6 ? 3 : st.streak >= 3 ? 2 : 1;
      gain = (it.retry ? 2 : 5) * mult + (secs < 12 && !it.retry ? 2 : 0);
      st.credits += gain;
      later(() => AudioFX.play('ok'), 150);
      stackHit(key, true);
      if (day.complaints && it.pkt.ct === 'established' && r.res.verdict === 'drop') complaint = COMPLAINTS[Math.floor(Math.random() * COMPLAINTS.length)];
    } else {
      st.streak = 0; st.warnings++; st.credits -= 3;
      later(() => AudioFX.play('bad'), 150);
      const id0 = it.uid0 != null ? it.uid0 : it.uid;
      if (!st.mistakes.some(m => m.id0 === id0)) st.mistakes.push({ id0, pkt: it.pkt, r });
      stackAdd({ key, kind: 'packet', scen: sc.id, rs: rsOf(it).id, pkt: it.pkt, chooseChain: !!day.chooseChain, showNames: !!day.showNames, showIif: !!day.showIif });
      st.requeued = insertRetry(it);
      if (day.hearts) { st.hearts--; if (st.hearts <= 0) st.over = true; }
    }
    hud();
    const withChain = !!day.chooseChain;
    let sub = '';
    if (!r.ok) {
      const mine = (withChain ? (r.chain ? HOOK_LABEL[r.chain] : '?') + ' · ' : '') + r.v.toUpperCase();
      sub = '<div class="slip-sub">Deine Entscheidung: ' + mine + '<br>Richtig wäre: ' + verdictLine(r.res, withChain) + (withChain && !r.okChain ? '<br><b>Falsche Chain!</b>' : '') + '</div>';
    }
    const auto = r.ok && SAVE.settings.auto && !complaint;
    const html = (r.ok ? '<div class="slip-h ok"><span>KORREKT</span><span>+' + gain + ' Cr' + (st.streak >= 3 ? ' · Combo!' : '') + '</span></div>'
      : '<div class="slip-h bad"><span>VERWARNUNG</span><span>-3 Cr' + (day.hearts ? ' · -1 Leben' : '') + '</span></div>') + sub +
      explainHTML(sc, it.pkt, r.res) +
      (complaint ? '<div class="complaint"><b>Anruf:</b> ' + esc(complaint) + '<br>Laut Regelbuch richtig verworfen. Ohne ct-Regel kommen Antworten aber nicht durch.</div>' : '') +
      (!r.ok && !st.over ? '<div class="slip-sub">' + (st.requeued ? 'Das Paket stellt sich gleich noch einmal an.' : 'Das Paket wartet jetzt auf deinem Fehlerstapel.') + '</div>' : '') +
      '<div class="slip-foot">' + (auto ? '<span class="autobar"><i style="animation-duration:1.8s"></i></span>' : '<span></span>') +
      '<button class="btn go" data-act="next">' + (st.over ? 'Kündigung lesen' : 'Nächstes Paket') + ' <kbd>Leertaste</kbd></button></div>';
    const slip = desk.showSlip(html);
    $('[data-act="next"]', slip).onclick = next;
    st.waiting = true;
    if (auto) st.autoT = later(next, 1800);
    later(() => { const b = slip.getBoundingClientRect(); if (b.bottom > window.innerHeight) window.scrollBy({ top: b.bottom - window.innerHeight + 16, behavior: 'smooth' }); }, 80);
  });
  function next() {
    if (!st.waiting) return;
    st.waiting = false;
    clearTimeout(st.autoT);
    if (st.over) { finish(true); return; }
    desk.hideSlip();
    st.i++; st.since++;
    load();
  }
  function phaseMemo(ph) {
    AudioFX.play('memo');
    const m = openModal('<div class="modal-h">' + spr('chef', 4) + '<div><div class="memo-from">MITTEILUNG · 12:00 UHR · CHEFIN BRANDT</div><h2>Neues Regelbuch!</h2></div></div>' +
      '<div class="memo-body" style="font-size:22px">' + ph.memo + '</div><div class="memo-actions"><span></span><button class="btn go" data-act="ok">Verstanden <kbd>Enter</kbd></button></div>', { paper: true });
    const close = () => { closeModal(); load(); };
    $('[data-act="ok"]', m.el).onclick = close;
    m.onKey = e => { if (e.key === 'Enter' || e.key === ' ') { close(); return true; } };
  }
  function phoneCall() {
    const card = st.calls[st.callIdx++];
    AudioFX.play('ring');
    const m = openModal('<div class="modal-h"><div class="ring">' + spr('chef', 4) + '</div><div><div class="memo-from">ANRUF · CHEFIN BRANDT</div><h2>Kurze Frage zwischendurch!</h2></div></div>' +
      '<div class="stage" data-r="cs"></div><div class="verdict" data-r="cv" hidden></div>');
    let answered = false;
    const hang = () => { closeModal(); load(); };
    const ctl = rMC(card, $('[data-r="cs"]', m.el), ok => {
      answered = true;
      if (ok) { st.credits += 8; st.callOk++; AudioFX.play('ok'); stackHit('card:' + card.id, true); }
      else { AudioFX.play('bad'); stackAdd({ key: 'card:' + card.id, kind: 'card', id: card.id }); }
      hud();
      const v = $('[data-r="cv"]', m.el);
      v.hidden = false; v.className = 'verdict ' + (ok ? 'ok' : 'bad');
      v.innerHTML = '<div class="v-head">' + spr(ok ? 'check' : 'cross', 4) + (ok ? 'RICHTIG' : 'FALSCH') + (ok ? '<span class="plus">+8 Cr</span>' : '') + '</div><div class="v-body">' + fmt(card.x) + '</div>' +
        '<div class="v-foot"><span></span><button class="btn go" data-act="hang">Auflegen <kbd>Enter</kbd></button></div>';
      $('[data-act="hang"]', v).onclick = hang;
    });
    m.onKey = e => { if (answered) { if (e.key === 'Enter' || e.key === ' ') { hang(); return true; } return; } return ctl.onKey(e); };
  }
  function finish(lost) {
    let stars, passed;
    if (day.boss) { passed = !lost; stars = lost ? 0 : st.hearts; }
    else { const ratio = st.firstOk / unique; stars = ratio >= 0.9 ? 3 : ratio >= 0.75 ? 2 : ratio >= 0.5 ? 1 : 0; passed = stars > 0; }
    const stats = [['Pakete', unique], ['Beim ersten Mal richtig', st.firstOk + ' / ' + unique], ['Verwarnungen', st.warnings]];
    if (day.calls) stats.push(['Anrufe richtig', st.callOk + ' / ' + st.calls.length]);
    go(screenReport, { kind: 'shift', day, stars, passed, lost, boss: !!day.boss, credits: st.credits, stats,
      mistakes: st.mistakes.map(m => '<div class="mq">' + esc(pktSummary(sc, m.pkt)) + '</div><div class="ma">Richtig: ' + verdictLine(m.r.res, !!day.chooseChain) + '</div>' + explainHTML(sc, m.pkt, m.r.res)) });
  }
  load();
  return {
    onKey(e) {
      if (st.waiting) { if (e.key === ' ' || e.key === 'Enter') { next(); return true; } return; }
      return desk.onKey(e);
    }
  };
}

function runBuild(app, day) {
  const results = [];
  let pi = 0;
  function refName(sc, ref) {
    if (ref === 'lo') return '127.0.0.1 (lo)';
    if (ref.indexOf('R:') === 0) { const f = ifByName(sc, ref.slice(2)); return sc.router + ' ' + f.name + ' (' + f.ip + ')'; }
    return ref;
  }
  function loadPuzzle() {
    const pz = PUZZLES.find(p => p.id === day.puzzles[pi]);
    const sc = SCENARIOS[pz.scen];
    const chains = {}; pz.chains.forEach(c => { chains[c.name] = []; });
    let active = pz.chains[0].name, runs = 0, running = false, solved = false, solShown = false;
    const pkts = pz.tests.map(t => makePacket(sc, t));
    app.innerHTML = '<div class="s-build">' + hudHTML('TAG ' + day.n + ' · BAUMEISTER', 'Auftrag ' + (pi + 1) + ' von ' + day.puzzles.length + ': ' + esc(pz.title)) +
      '<div class="build-top"><div class="panel"><div class="panel-h"><span>AUFTRAG ' + (pi + 1) + '/' + day.puzzles.length + '</span><span>' + esc(pz.title) + '</span></div>' +

      '<div class="panel"><div class="panel-h"><span>NETZPLAN</span><span>' + esc(sc.name) + '</span></div><div data-r="map">' + mapHTML(sc) + '</div></div></div>' +
      '<div class="build-mid"><div class="panel"><div class="panel-h"><span>BAUSTEINE</span><span>beliebig oft nutzbar</span></div><div class="pool" data-r="pool">' +
      shuffle(pz.pool.slice()).map(t => '<button class="brick" draggable="true" data-t="' + esc(t) + '">' + esc(t) + '</button>').join('') + '</div></div>' +
      '<div class="chainboxes" data-r="chains"></div></div>' +
      '<div class="panel"><div class="panel-h"><span>TESTPAKETE</span><span data-r="score"></span></div><div class="tests"><div class="tbl-wrap"><table><thead><tr><th>Paket</th><th>Soll</th><th>Ergebnis</th></tr></thead><tbody>' +
      pz.tests.map(t => '<tr><td>' + esc(t.label || (refName(sc, t.from) + ' → ' + refName(sc, t.to) + ' · ' + SVC[t.svc].name + (t.reply ? ' (Antwort)' : ''))) + '</td><td><span class="pill ' + (t.expect === 'accept' ? 'acc' : 'drp') + '">' + t.expect.toUpperCase() + '</span></td><td class="res">–</td></tr>').join('') +
      '</tbody></table></div><div data-r="lint"></div><div class="build-foot"><button class="btn go big" data-act="sim">Simulation starten <kbd>Enter</kbd></button><span data-r="msg" class="muted"></span>' +
      '<span style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" data-act="sol" hidden>Musterlösung zeigen</button><button class="btn go" data-act="next" hidden>' + (pi + 1 < day.puzzles.length ? 'Nächster Auftrag &gt;' : 'Feierabend &gt;') + '</button></span></div></div></div></div>';
    const R = k => $('[data-r="' + k + '"]', app);
    wireQuit(app, () => go(screenPlan));
    function hud() {
      R('hud').innerHTML = hudItems([{ label: 'Simulationen', v: runs }, { icon: 'star', v: results.reduce((a, r) => a + (r ? r.stars : 0), 0) + '/' + day.puzzles.length * 3, title: 'Sterne bisher' }]);
    }
    function renderChains() {
      R('chains').innerHTML = pz.chains.map(c => '<div class="chainbox ' + (active === c.name ? 'active' : '') + '" data-chain="' + c.name + '">' +
        '<button class="chainbox-h" data-act="activate">chain ' + c.name + ' { type filter hook ' + c.hook + ' priority 0; policy ' + c.policy + ';' + (active === c.name ? '<span class="tag">AKTIV</span>' : '') + '</button>' +
        '<ol class="slots" data-chain="' + c.name + '">' + (chains[c.name].length ? chains[c.name].map((t, i) => '<li class="slot" draggable="true" data-i="' + i + '"><span class="no">#' + (i + 1) + '</span><span class="txt">' + esc(t) + '</span>' +
          '<span class="ctl"><button data-op="up" aria-label="Regel nach oben">&#9650;</button><button data-op="down" aria-label="Regel nach unten">&#9660;</button><button data-op="del" aria-label="Regel entfernen">&#10005;</button></span></li>').join('')
          : '<li class="dropzone-hint">Baustein hierher ziehen oder anklicken</li>') + '</ol>' +
        '<div class="chainbox-f">}  passt keine Regel: policy ' + c.policy + '</div></div>').join('');
      $$('.chainbox', app).forEach(box => {
        const cn = box.dataset.chain;
        $('[data-act="activate"]', box).onclick = () => { active = cn; renderChains(); AudioFX.play('click'); };
        $$('.slot', box).forEach(sl => {
          const i = +sl.dataset.i;
          $$('[data-op]', sl).forEach(b => {
            b.onclick = ev => {
              ev.stopPropagation();
              const arr = chains[cn];
              if (b.dataset.op === 'up' && i > 0) { const t = arr[i - 1]; arr[i - 1] = arr[i]; arr[i] = t; }
              if (b.dataset.op === 'down' && i < arr.length - 1) { const t = arr[i + 1]; arr[i + 1] = arr[i]; arr[i] = t; }
              if (b.dataset.op === 'del') arr.splice(i, 1);
              AudioFX.play('click'); changed(); renderChains();
            };
          });
          sl.addEventListener('dragstart', ev => { ev.dataTransfer.setData('text/plain', 's|' + cn + '|' + i); ev.dataTransfer.effectAllowed = 'move'; sl.classList.add('dragging'); });
          sl.addEventListener('dragend', () => sl.classList.remove('dragging'));
        });
        const list = $('.slots', box);
        const insIndex = y => { const sl = $$('.slot', list); for (let k = 0; k < sl.length; k++) { const r = sl[k].getBoundingClientRect(); if (y < r.top + r.height / 2) return k; } return sl.length; };
        const clearIns = () => { $$('.slot', list).forEach(s => s.classList.remove('ins-before')); list.classList.remove('over'); };
        list.addEventListener('dragover', ev => {
          ev.preventDefault(); list.classList.add('over');
          const k = insIndex(ev.clientY); $$('.slot', list).forEach((s, j) => s.classList.toggle('ins-before', j === k));
        });
        list.addEventListener('dragleave', ev => { if (!list.contains(ev.relatedTarget)) clearIns(); });
        list.addEventListener('drop', ev => {
          ev.preventDefault();
          const k = insIndex(ev.clientY); clearIns();
          const data = ev.dataTransfer.getData('text/plain');
          if (!data) return;
          const parts = data.split('|');
          if (parts[0] === 'p') { chains[cn].splice(k, 0, parts.slice(1).join('|')); }
          else if (parts[0] === 's') {
            const from = parts[1], fi = +parts[2];
            const [t] = chains[from].splice(fi, 1);
            let at = k; if (from === cn && fi < k) at--;
            chains[cn].splice(at, 0, t);
          }
          active = cn; AudioFX.play('click'); changed(); renderChains();
        });
      });
    }
    function changed() { if (!solved) R('msg').textContent = ''; }
    $$('.brick', app).forEach(b => {
      b.onclick = () => { chains[active].push(b.dataset.t); AudioFX.play('click'); changed(); renderChains(); };
      b.addEventListener('dragstart', ev => { ev.dataTransfer.setData('text/plain', 'p|' + b.dataset.t); ev.dataTransfer.effectAllowed = 'copy'; b.classList.add('dragging'); });
      b.addEventListener('dragend', () => b.classList.remove('dragging'));
    });
    function lint(hits) {
      const notes = [];
      pz.chains.forEach(c => chains[c.name].forEach((t, i) => {
        const r = parseRule(t);
        if (c.hook === 'input' && r.m.oif) notes.push('<code>' + esc(t) + '</code> in ' + c.name + ' greift nie: In INPUT gibt es kein Ausgangs-Interface.');
        else if (c.hook === 'output' && r.m.iif) notes.push('<code>' + esc(t) + '</code> in ' + c.name + ' greift nie: Lokal erzeugte Pakete haben kein Eingangs-Interface.');
        else if (hits && !hits[c.name][i]) notes.push('<code>' + esc(t) + '</code> in ' + c.name + ' hat bei keinem Testpaket entschieden. Ist sie überflüssig?');
      }));
      R('lint').innerHTML = notes.length ? '<div class="lint"><b>Hinweise:</b><br>' + notes.join('<br>') + '</div>' : '';
    }
    function simulate() {
      if (running) return;
      if (!pz.chains.some(c => chains[c.name].length)) { toast('Leg zuerst Regeln in eine Chain.'); return; }
      running = true; runs++; hud();
      const rs = buildRS({ id: 'pz', tables: [{ fam: 'inet', name: 'filter', chains: pz.chains.map(c => ({ name: c.name, type: 'filter', hook: c.hook, prio: 0, policy: c.policy, rules: chains[c.name].slice() })) }] });
      const hits = {}; pz.chains.forEach(c => { hits[c.name] = chains[c.name].map(() => 0); });
      const rows = $$('tbody tr', app).filter(tr => tr.closest('.tests'));
      rows.forEach(r => { $('.res', r).textContent = '…'; });
      let passed = 0;
      R('msg').textContent = 'Simulation läuft …';
      pkts.forEach((p, i) => later(() => {
        rows.forEach(r => r.classList.remove('run')); rows[i].classList.add('run');
        const res = processPacket(sc, rs, p), ok = res.verdict === pz.tests[i].expect;
        if (res.chain && res.idx >= 0) hits[res.chain.name][res.idx]++;
        if (ok) passed++;
        $('.res', rows[i]).innerHTML = '<span class="' + (ok ? 'res-ok' : 'res-bad') + '">' + (ok ? 'OK' : 'FALSCH') + '</span> · ' + res.verdict.toUpperCase() +
          ' <span class="muted">(' + (res.chain ? res.chain.name + ' ' + (res.idx >= 0 ? '#' + (res.idx + 1) : 'policy') : 'keine Chain') + ')</span>';
        markMap(R('map'), p, res);
        AudioFX.play(ok ? 'click' : 'step');
        if (i === pkts.length - 1) later(() => done(passed, hits), 300);
      }, 280 * i));
    }
    function done(passed, hits) {
      running = false;
      $$('tbody tr', app).forEach(r => r.classList.remove('run'));
      const total = pz.tests.length;
      R('score').textContent = passed + ' / ' + total + ' bestanden';
      if (passed === total) {
        if (!solved) { solved = true; const stars = solShown ? 1 : runs === 1 ? 3 : runs <= 3 ? 2 : 1; results[pi] = { stars, runs }; }
        AudioFX.play('win');
        R('msg').innerHTML = '<b style="color:var(--ok-hi)">Auftrag erfüllt!</b> ' + starsHTML(results[pi].stars, 3).replace(/<svg/g, '<svg style="display:inline-block"');
        $('[data-act="next"]', app).hidden = false;
        $('[data-act="sol"]', app).hidden = true;
        lint(hits);
      } else {
        AudioFX.play('bad');
        R('msg').textContent = passed + ' von ' + total + ' Tests bestanden. Schau dir die roten Zeilen an und passe die Regeln an.';
        if (runs >= 3 && !solShown) $('[data-act="sol"]', app).hidden = false;
        lint(null);
      }
      hud();
    }
    $('[data-act="sim"]', app).onclick = simulate;
    $('[data-act="sol"]', app).onclick = () => {
      solShown = true;
      pz.chains.forEach(c => { chains[c.name] = (pz.solution[c.name] || []).slice(); });
      renderChains();
      $('[data-act="sol"]', app).hidden = true;
      toast('Musterlösung eingesetzt. Starte die Simulation und schau, warum sie passt.');
    };
    $('[data-act="next"]', app).onclick = () => {
      pi++;
      if (pi < day.puzzles.length) { loadPuzzle(); window.scrollTo(0, 0); }
      else {
        const avg = results.reduce((a, r) => a + r.stars, 0) / results.length;
        go(screenReport, { kind: 'build', day, stars: Math.max(1, Math.round(avg)), passed: true, credits: results.reduce((a, r) => a + r.stars * 6, 0),
          stats: day.puzzles.map((id, k) => [PUZZLES.find(p => p.id === id).title, results[k].stars + ' Sterne · ' + results[k].runs + ' Simulation' + (results[k].runs === 1 ? '' : 'en')]) });
      }
    };
    renderChains(); hud();
    SCREEN = {
      onKey(e) {
        if (e.key === 'Enter' && e.target && e.target.tagName === 'BUTTON') return;
        if (e.key === 'Enter') { if (solved && !$('[data-act="next"]', app).hidden) $('[data-act="next"]', app).click(); else simulate(); return true; }
      }
    };
  }
  loadPuzzle();
  return SCREEN;
}

/* =====================================================================
   TAGESBERICHT
   ===================================================================== */
function screenReport(app, Rp) {
  const day = Rp.day;
  const lines = [];
  let net = Rp.credits;
  if (Rp.kind === 'shift') {
    lines.push(['Verdienst der Schicht', Rp.credits]);
    sample(EXPENSES, 2).forEach(e => { lines.push([e[0], -e[1]]); net -= e[1]; });
  } else lines.push([Rp.kind === 'stack' ? 'Nachsitz-Prämie' : 'Prämie', Rp.credits]);
  SAVE.credits += net;
  if (day && Rp.stars > (SAVE.stars[day.id] || 0)) SAVE.stars[day.id] = Rp.stars;
  persist();
  AudioFX.play(Rp.passed ? 'win' : 'lose');
  let headline = 'TAGESBERICHT', cls = '';
  if (Rp.boss && Rp.passed) { headline = 'FESTANGESTELLT!'; cls = 'win'; }
  else if (Rp.boss) { headline = 'GEKÜNDIGT!'; cls = 'lose'; }
  else if (!Rp.passed) { headline = 'SCHICHT NICHT BESTANDEN'; cls = 'lose'; }
  const sign = v => (v >= 0 ? '+' : '') + v + ' Cr';
  const nextDay = day ? DAYS[DAYS.indexOf(day) + 1] : null;
  const lead = Rp.boss && Rp.passed ? 'Drei Zonen, NAT und Anrufe der Chefin: Du hast alles im Griff. Willkommen im Team!'
    : Rp.boss ? 'Drei Fehler im Rechenzentrum. Lies die Erklärungen unten und versuch es nochmal.'
    : !Rp.passed ? 'Weniger als die Hälfte war beim ersten Mal richtig. Lies die Fehler unten und starte die Schicht neu.'
    : Rp.kind === 'stack' ? 'Gut nachgesessen. Was noch nicht sitzt, bleibt auf dem Stapel.' : 'Schicht erledigt. Hier ist deine Abrechnung.';
  app.innerHTML = '<div class="report"><article class="report-paper">' +
    '<div class="memo-from">' + (day ? 'TAG ' + day.n + ' · ' + esc(day.title.toUpperCase()) : esc(Rp.title || '')) + '</div>' +
    '<div class="verdict-big ' + cls + '">' + headline + '</div>' +
    (day ? '<div class="report-stars">' + starsHTML(Rp.stars, 3).replace(/width="27" height="27"/g, 'width="45" height="45"') + '</div>' : '') +
    '<p style="font-size:22px">' + lead + '</p>' +
    '<dl class="ledger">' + (Rp.stats || []).map(s => '<dt>' + esc(s[0]) + '</dt><dd style="margin:0">' + esc(s[1]) + '</dd>').join('') + '</dl>' +
    '<div class="ledger">' + lines.map(l => '<span>' + esc(l[0]) + '</span><span class="' + (l[1] < 0 ? 'neg' : 'pos') + '">' + sign(l[1]) + '</span>').join('') +
    '<span class="sum">Auf dein Konto</span><span class="sum">' + sign(net) + '</span><span>Kontostand</span><span>' + SAVE.credits + ' Cr</span></div>' +
    (Rp.mistakes && Rp.mistakes.length ? '<h2>Deine Fehler zum Nachlesen</h2><div class="mistakes">' + Rp.mistakes.map(m => '<div class="mistake">' + m + '</div>').join('') + '</div>' +
      '<p style="font-size:20px">Alle Fehler liegen auf deinem <b>Fehlerstapel</b>. Beim Nachsitzen kommen sie wieder, bis du sie zweimal hintereinander richtig hast.</p>' : '') +
    '</article><div class="report-actions">' +
    (day ? '<button class="btn" data-act="again">Nochmal spielen</button>' : '') +
    (SAVE.stack.length ? '<button class="btn warnb" data-act="stack">Nachsitzen (' + SAVE.stack.length + ')</button>' : '') +
    '<button class="btn" data-act="plan">Dienstplan</button>' +
    (nextDay && Rp.passed ? '<button class="btn go" data-act="next">Tag ' + nextDay.n + ' &gt;</button>' : '') + '</div></div>';
  const bind = (a, fn) => { const b = $('[data-act="' + a + '"]', app); if (b) b.onclick = fn; };
  bind('again', () => go(screenMemo, day));
  bind('stack', () => go(screenStack));
  bind('plan', () => go(screenPlan));
  bind('next', () => go(screenMemo, nextDay));
  return {
    onKey(e) {
      if (e.key === 'Enter') { if (nextDay && Rp.passed) go(screenMemo, nextDay); else go(screenPlan); return true; }
      if (e.key === 'Escape') { go(screenPlan); return true; }
    }
  };
}

/* =====================================================================
   NACHSITZEN, SPICKZETTEL, EINSTELLUNGEN
   ===================================================================== */
function stackToCard(s) {
  if (s.kind === 'card') return CARDS[s.id] || null;
  if (s.kind === 'packet' && s.pkt && SCENARIOS[s.scen] && RULESETS[s.rs]) {
    return { type: 'packet', id: s.key, key: s.key, q: 'Ein Paket aus deinem Fehlerstapel. Prüf es nochmal!', scen: s.scen, rs: s.rs, pkt: s.pkt,
      chooseChain: s.chooseChain, showNames: s.showNames, showIif: s.showIif };
  }
  return null;
}
function screenStack(app) {
  SAVE.stack = SAVE.stack.filter(s => stackToCard(s));
  persist();
  const n = SAVE.stack.length;
  const preview = SAVE.stack.slice(0, 8).map(s => {
    const c = stackToCard(s);
    const label = c.type === 'packet' ? pktSummary(SCENARIOS[c.scen], c.pkt) : (c.q || c.title);
    return '<li>' + '<span class="tagpill">' + TYPE_META[c.type] + '</span> ' + fmt(label) + ' <span style="color:#7a6142">(' + s.streak + '/2)</span></li>';
  }).join('');
  app.innerHTML = '<header class="hud"><button class="btn tiny" data-act="home">&lt; Titel</button><div class="hud-title">NACHSITZEN<small>Dein Fehlerstapel</small></div><div class="hud-right"></div></header>' +
    '<div class="memo-wrap"><article class="memo-paper">' +
    '<div class="memo-head"><div class="memo-face">' + spr('chef', 5) + '</div><div><div class="memo-from">NACHSITZEN · CHEFIN BRANDT</div><h2>' + (n ? n + ' Karte' + (n === 1 ? '' : 'n') + ' auf dem Stapel' : 'Der Stapel ist leer!') + '</h2></div></div>' +
    (n ? '<p>Hier landet alles, was du falsch beantwortet hast: Fragen, Befehle, Tabellen und Pakete vom Schalter. Jede Karte muss <b>zweimal hintereinander</b> richtig sein, dann fliegt sie vom Stapel. Eine Runde hat höchstens 15 Karten.</p>' +
      '<ul style="margin:0;padding-left:20px;display:grid;gap:4px;font-size:20px">' + preview + (n > 8 ? '<li>… und ' + (n - 8) + ' weitere</li>' : '') + '</ul>'
      : '<p>Nichts zu wiederholen. Spiel ein paar Tage im Dienstplan. Was du falsch machst, landet automatisch hier.</p>') +
    '<div class="memo-actions"><button class="btn" data-act="home2">&lt; Titel</button>' + (n ? '<button class="btn go big" data-act="start">Nachsitzen starten &gt;</button>' : '<button class="btn go" data-act="plan">Zum Dienstplan</button>') + '</div>' +
    '</article></div>';
  const start = () => go(runCards, { stackMode: true, title: 'NACHSITZEN', sub: 'Fehlerstapel', cards: shuffle(SAVE.stack.slice()).slice(0, 15).map(stackToCard) });
  $('[data-act="home"]', app).onclick = () => go(screenTitle);
  $('[data-act="home2"]', app).onclick = () => go(screenTitle);
  if (n) $('[data-act="start"]', app).onclick = start; else $('[data-act="plan"]', app).onclick = () => go(screenPlan);
  return { onKey(e) { if (e.key === 'Enter' && n) { start(); return true; } if (e.key === 'Escape') { go(screenTitle); return true; } } };
}

    '</div></div>';
  $('[data-act="home"]', app).onclick = () => go(screenTitle);
  return { onKey(e) { if (e.key === 'Escape') { go(screenTitle); return true; } } };
}

function screenSettings(app) {
  const row = (k, label, desc) => '<div class="toggle"><div><div>' + label + '</div><div class="muted" style="font-size:18px">' + desc + '</div></div><button class="btn ' + (SAVE.settings[k] ? 'go' : '') + '" data-k="' + k + '" aria-pressed="' + SAVE.settings[k] + '">' + (SAVE.settings[k] ? 'AN' : 'AUS') + '</button></div>';
  app.innerHTML = '<header class="hud"><button class="btn tiny" data-act="home">&lt; Titel</button><div class="hud-title">EINSTELLUNGEN</div><div class="hud-right"></div></header>' +
    '<div class="settings">' +
    row('sound', 'Sound', '8-Bit-Töne für Stempel, Treffer und Fehler') +
    row('auto', 'Automatisch weiter', 'Nach richtigen Paketen geht es von selbst weiter') +
    row('crt', 'Röhrenmonitor-Effekt', 'Leichte Scanlines über dem Bild') +
    '<div class="toggle"><div><div>Fehlerstapel leeren</div><div class="muted" style="font-size:18px">' + SAVE.stack.length + ' Karten</div></div><button class="btn" data-act="clearstack">Leeren</button></div>' +
    '<div class="toggle"><div><div>Fortschritt zurücksetzen</div><div class="muted" style="font-size:18px">Sterne, Kontostand und Stapel löschen</div></div><button class="btn badb" data-act="reset">Zurücksetzen</button></div>' +
    '<p class="muted" style="font-size:18px">Dein Fortschritt wird nur in diesem Browser gespeichert.</p></div>';
  $$('[data-k]', app).forEach(b => {
    b.onclick = () => { const k = b.dataset.k; SAVE.settings[k] = !SAVE.settings[k]; persist(); applySettings(); AudioFX.play('click'); go(screenSettings); };
  });
  const twoStep = (act, fn) => {
    const b = $('[data-act="' + act + '"]', app);
    let armed = false;
    b.onclick = () => { if (armed) { fn(); return; } armed = true; b.textContent = 'Sicher? Nochmal klicken'; later(() => { armed = false; b.textContent = act === 'reset' ? 'Zurücksetzen' : 'Leeren'; }, 3000); };
  };
  twoStep('clearstack', () => { SAVE.stack = []; persist(); toast('Fehlerstapel geleert.'); go(screenSettings); });
  twoStep('reset', () => { const s = SAVE.settings; SAVE = freshSave(); SAVE.settings = s; persist(); toast('Fortschritt zurückgesetzt.'); go(screenSettings); });
  $('[data-act="home"]', app).onclick = () => go(screenTitle);
  return { onKey(e) { if (e.key === 'Escape') { go(screenTitle); return true; } } };
}

/* ---------- Start ---------- */
function start() { loadSave(); applySettings(); go(screenTitle); }
if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(start); else start();

</script>

</body></html>
