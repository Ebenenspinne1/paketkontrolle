    t.chains.forEach((c, ci) => {
      code += '<div class="nch" data-t="' + ti + '" data-c="' + ci + '"><div class="nl ch i1">chain ' + esc(c.name) + ' {</div><div class="nl meta i2">' + esc(c.meta) + '</div>';
      for (let s = 0; s < c.slots; s++) code += '<div class="nl nslot i2"><select class="sel nf-s" id="nf-' + card.id + '-' + (k++) + '" aria-label="Regel ' + (s + 1) + ' in ' + esc(t.name + ' ' + c.name) + '">' + opt + '</select></div>';
      code += '<div class="nfix i2" hidden></div><div class="nl i1">}</div></div>';
    });
    code += '<div class="nl tb">}</div>';
  });
  stage.innerHTML = qHead(card, 'Regeln einsetzen') + '<div class="nftpl">' + code + '</div>' +
    '<div class="board-actions"><button class="btn go" data-act="sub">Abgeben <kbd>Enter</kbd></button><span class="muted">Nicht benötigte Felder bleiben leer bzw. „none“. Falsche Regeln geben Abzug.</span></div>';
  let done = false;
  function submit() {
    if (done) return;
    done = true;
    let right = 0, wrong = 0;
    const need = nftNeed(card), given = [];
    $$('.nch', stage).forEach(el => {
      const c = card.tables[+el.dataset.t].chains[+el.dataset.c];
      const seen = new Set(), picked = [];
      $$('select', el).forEach(s => {
        s.disabled = true;
        const v = s.value || 'none';
        if (v === 'none') { s.classList.add('nonec'); return; }
        picked.push(v);
        const good = c.need.indexOf(v) >= 0 && !seen.has(v);
        seen.add(v);
        s.classList.add(good ? 'okc' : 'badc');
        if (good) right++; else wrong++;
      });
      given.push(picked);
      const miss = c.need.filter(r => !seen.has(r)), extra = picked.filter(v => c.need.indexOf(v) < 0);
      const parts = [];
      if (miss.length) parts.push('fehlt: ' + miss.map(r => '<code>' + esc(r) + '</code>').join(' '));
      if (extra.length) parts.push('gehört hier nicht hin: ' + extra.map(r => '<code>' + esc(r) + '</code>').join(' '));
      if (parts.length) { const fx = $('.nfix', el); fx.innerHTML = parts.join('<br>'); fx.hidden = false; }
    });
    $('[data-act="sub"]', stage).disabled = true;
    answer(wrong === 0 && right === need, { frac: need ? Math.max(0, right - wrong) / need : (wrong ? 0 : 1), given });
  }
  $('[data-act="sub"]', stage).onclick = submit;
  return { onKey(e) { if (e.key === 'Enter') { submit(); return true; } } };
}

/* =====================================================================
   PROBEKLAUSUR
   ===================================================================== */
const PTS_DEF = { mc: 2, tf: 1, multi: 3, fill: 2, table: 4, path: 2, pick: 1 };
function cardPts(c) {
  if (c.pts) return c.pts;
  if (c.type === 'drops') return c.items.length;
  if (c.type === 'nft') return Math.max(2, nftNeed(c));
  return PTS_DEF[c.type] || 2;
}
const ihkGrade = p => p >= 92 ? 1 : p >= 81 ? 2 : p >= 67 ? 3 : p >= 50 ? 4 : p >= 30 ? 5 : 6;
const GRADE_TXT = ['', 'sehr gut', 'gut', 'befriedigend', 'ausreichend', 'mangelhaft', 'ungenügend'];
const halfPt = v => Math.round(v * 2) / 2;
const deNum = v => String(v).replace('.', ',');
const pad2 = n => String(n).padStart(2, '0');
function topicOf(c) {
  const id = String(c.genOf || c.id || '');
  if (/^(nf|kf|fg|mg)/.test(id)) return 'Firewall & NAT';
  if (/^k/.test(id)) return 'Linux-Konsole';
  if (/^w/.test(id)) return 'Windows';
  if (/^v/.test(id)) return 'Server & Virtualisierung';
  if (/^p/.test(id)) return 'Proxmox, Docker & SSH';
  return 'Grundlagen';
}

function runExam(app, cfg) {
  const day = cfg.day;
  const items = cfg.cards.map((c, i) => ({ c, n: i + 1, pts: cardPts(c), done: false, ok: false, frac: 0, given: undefined, got: 0 }));
  const total = items.reduce((a, it) => a + it.pts, 0);
  const t0 = Date.now(), endAt = t0 + (day.minutes || 45) * 60000;
  let cur = 0, ctl = null, over = false, armed = false;
  app.innerHTML = '<div class="s-cards exam">' + hudHTML(cfg.title, 'Prüfung · ' + items.length + ' Aufgaben · ' + deNum(total) + ' Punkte · Lösungen erst nach der Abgabe') +
    '<div class="exam-grid"><aside class="panel exam-side"><div class="panel-h"><span>PRÜFUNGSBOGEN</span><span class="clock" data-r="clock" aria-label="Restzeit"></span></div>' +
    '<div class="panel-body"><div class="exam-nums" data-r="nums"></div><div class="muted small" data-r="left"></div><button class="btn warnb" data-act="hand">Abgeben</button></div></aside>' +
    '<section class="stage-wrap"><div class="stage" data-r="stage"></div><div class="exam-foot" data-r="foot"></div></section></div></div>';
  const R = k => $('[data-r="' + k + '"]', app);
  wireQuit(app, () => go(screenPlan));
  const nextOpen = from => { for (let k = 1; k <= items.length; k++) { const j = (from + k) % items.length; if (!items[j].done) return j; } return -1; };

  function nums() {
    R('nums').innerHTML = items.map((it, i) => '<button class="en' + (it.done ? ' done' : '') + (i === cur ? ' cur' : '') + '" data-i="' + i + '"' + (it.done ? ' disabled' : '') +
      ' aria-label="Aufgabe ' + it.n + (it.done ? ', beantwortet' : '') + '">' + it.n + '</button>').join('');
    $$('.en', app).forEach(b => { b.onclick = () => { const i = +b.dataset.i; if (!items[i].done && !over) { AudioFX.play('click'); load(i); } }; });
    const open = items.filter(i => !i.done).length;
    R('left').textContent = open ? open + ' von ' + items.length + ' offen. Beantwortete Aufgaben sind gesperrt.' : 'Alles beantwortet. Du kannst abgeben.';
  }
  function foot(answered) {
    const f = R('foot'), nx = nextOpen(cur);
    if (!answered) f.innerHTML = '<span class="muted small">Antwort wählen und abgeben. Rückmeldung gibt es erst am Ende.</span>' + (nx >= 0 ? '<button class="btn ghost" data-act="skip">Später bearbeiten</button>' : '');
    else f.innerHTML = '<span class="saved">ANTWORT GESPEICHERT</span>' + (nx >= 0 ? '<button class="btn go" data-act="next">Nächste Aufgabe <kbd>Enter</kbd></button>' : '<button class="btn warnb" data-act="hand2">Prüfung abgeben <kbd>Enter</kbd></button>');
    const b = (a, fn) => { const el = $('[data-act="' + a + '"]', f); if (el) el.onclick = fn; };
    b('skip', () => load(nx)); b('next', () => load(nx)); b('hand2', () => finish(false));
  }
  function load(i) {
    cur = i;
    const it = items[i], stage = R('stage');
    stage.innerHTML = '';
    ctl = renderCard(it.c, stage, (ok, info) => onAnswer(it, ok, info)) || {};
    stage.insertAdjacentHTML('afterbegin', '<div class="exam-q">AUFGABE ' + it.n + ' VON ' + items.length + ' · ' + deNum(it.pts) + (it.pts === 1 ? ' PUNKT' : ' PUNKTE') + '</div>');
    foot(false); nums();
    const top = stage.getBoundingClientRect().top;
    if (top < 0) window.scrollBy({ top: top - 80 });
  }
  function onAnswer(it, ok, info) {
    if (it.done || over) return;
    it.done = true; it.ok = ok;
    it.frac = ok ? 1 : (info && info.frac != null ? info.frac : 0);
    it.given = info ? info.given : undefined;
    AudioFX.play('click');
    foot(true); nums();
  }
  function tick() {
    if (over) return;
    const left = Math.max(0, endAt - Date.now());
    const c = R('clock');
    c.textContent = Math.floor(left / 60000) + ':' + pad2(Math.floor(left / 1000) % 60);
    c.classList.toggle('low', left < 5 * 60000);
    if (left <= 0) { finish(true); return; }
    later(tick, 1000);
  }
  function handIn() {
    const open = items.filter(i => !i.done).length, b = $('[data-act="hand"]', app);
    if (open && !armed) {
      armed = true; b.textContent = open + ' offen! Trotzdem abgeben?';
      later(() => { armed = false; b.textContent = 'Abgeben'; }, 3200);
      return;
    }
    finish(false);
  }
  function finish(timeUp) {
    if (over) return;
    over = true;
    items.forEach(it => {
      it.got = it.done ? halfPt(it.frac * it.pts) : 0;
      const key = cardKey(it.c);
      if (it.got < it.pts) stackAdd(it.c.inline ? { key, kind: 'inline', card: it.c } : { key, kind: 'card', id: it.c.id });
      else stackHit(key, true);
    });
    go(screenExam, { day, items, total, timeUp, secs: Math.round((Date.now() - t0) / 1000) });
  }
  $('[data-act="hand"]', app).onclick = handIn;
  load(0); tick();
  return {
    onKey(e) {
      if (over) return;
      if (items[cur].done) {
        if (e.key === 'Enter' || e.key === ' ') { const nx = nextOpen(cur); if (nx >= 0) load(nx); else finish(false); return true; }
        return;
      }
      if (e.key === 'Enter' && e.target && e.target.tagName === 'BUTTON' && !e.target.closest('.stage')) return;
      return ctl && ctl.onKey ? ctl.onKey(e) : undefined;
    }
  };
}

/* ---------- Auswertung ---------- */
function ansText(c, t) { return c.preOpts ? '<pre class="rv-pre">' + esc(t) + '</pre>' : fmt(t); }
function solutionText(c) {
  switch (c.type) {
    case 'mc': return ansText(c, c.a[c.c]);
    case 'tf': return c.c ? 'WAHR' : 'FALSCH';
    case 'multi': return c.c.map(i => '• ' + fmt(c.a[i])).join('<br>');
    case 'fill': return '<code>' + esc(c.parts.map(p => typeof p === 'string' ? p : [].concat(p.c)[0]).join(' ')) + '</code>';
    case 'drops': return c.items.map(it => fmt(it.p) + ' → <b>' + esc(it.c) + '</b>').join('<br>');
    case 'nft': return c.tables.map(t => t.chains.filter(ch => ch.need.length).map(ch => t.name + ' ' + ch.name + ': ' + ch.need.map(r => '<code>' + esc(r) + '</code>').join(' ')).join('<br>')).filter(Boolean).join('<br>') || 'keine Regel nötig';
    case 'path': return c.c.map(h => HK[h].l).join(' &gt; ');
    case 'pick': return c.c.map(h => HK[h].l).join(' oder ');
    case 'table': return 'siehe Tabelle im Spiel';
  }
  return '';
}
function reviewHTML(c, it) {
  const g = it.given;
  const yours = (v, good) => '<div class="rv-y' + (good ? ' yes' : ' no') + '"><b>Deine Antwort:</b> ' + v + '</div>';
  const right = v => '<div class="rv-r"><b>Richtig:</b> ' + v + '</div>';
  if (!it.done) return '<div class="rv-y no"><b>Nicht bearbeitet.</b></div>' + right(solutionText(c));
  switch (c.type) {
    case 'mc': return yours(ansText(c, g), it.ok) + (it.ok ? '' : right(ansText(c, c.a[c.c])));
    case 'tf': return yours(esc(g), it.ok) + (it.ok ? '' : right(c.c ? 'WAHR' : 'FALSCH'));
    case 'multi': {
      const chosen = new Set(g || []);
      return '<ul class="rv-list">' + c.a.map((t, i) => {
        const ok = c.c.indexOf(i) >= 0, ch = chosen.has(t);
        const cls = ok && ch ? 'hit' : ch ? 'bad' : ok ? 'miss' : '';
        const tag = ok && ch ? '✓' : ch ? '✗ falsch angekreuzt' : ok ? '○ fehlte' : '';
        return '<li class="' + cls + '">' + fmt(t) + (tag ? ' <span class="tag">' + tag + '</span>' : '') + '</li>';
      }).join('') + '</ul>';
    }
    case 'fill': return yours('<code>' + esc(g) + '</code>', it.ok) + (it.ok ? '' : right(solutionText(c)));
    case 'drops': return '<div class="tblx"><table class="rv-t"><tr><th></th><th>Deine Wahl</th><th>Richtig</th></tr>' + c.items.map((x, i) => {
      const v = g ? g[i] : '', ok = v === x.c;
      return '<tr class="' + (ok ? 'hit' : 'bad') + '"><td>' + (x.h ? '<small>' + esc(x.h) + '</small><br>' : '') + fmt(x.p) + '</td><td>' + esc(v || '–') + '</td><td>' + (ok ? '✓' : '<b>' + esc(x.c) + '</b>') + '</td></tr>';
    }).join('') + '</table></div>';
    case 'nft': {
      let k = 0;
      return c.tables.map(t => t.chains.map(ch => {
        const picked = (g && g[k++]) || [];
        if (!picked.length && !ch.need.length) return '';
        const marks = picked.map(r => '<code class="' + (ch.need.indexOf(r) >= 0 ? 'hit' : 'bad') + '">' + esc(r) + '</code>').join(' ') || '<i>nichts</i>';
        const miss = ch.need.filter(r => picked.indexOf(r) < 0);
        return '<div class="rv-ch"><b>' + esc(t.name + ' ' + ch.name) + ':</b> ' + marks + (miss.length ? '<br><span class="rv-miss">fehlt: ' + miss.map(r => '<code>' + esc(r) + '</code>').join(' ') + '</span>' : '') + '</div>';
      }).join('')).join('');
    }
  }
  return right(solutionText(c));
}
function screenExam(app, X) {

    function save() {
      if (ed.readonly) { denied = true; msg.textContent = '[ Fehler beim Schreiben von ' + ed.path + ': Keine Berechtigung ]'; AudioFX.play('bad'); return false; }
      let v = ta.value;
      if (v && !/\n$/.test(v)) v += '\n';
      writeFile(w, m, ed.path, v, R2);
      dirty = false; saved = true; mod.textContent = '';
      msg.textContent = '[ ' + lines(v) + ' Zeilen geschrieben ]';
      AudioFX.play('click');
      return true;
    }
    function close() {
      closeModal();
      if (saved) { R2.out.forEach(l => buf[cur].push(l)); if (w.explain && FILE_HINT[ed.path]) buf[cur].push({ t: '► ' + FILE_HINT[ed.path], c: 'ex' }); }
      if (denied && w.explain) buf[cur].push({ t: '► Dateien unter /etc darf nur root ändern. Erst "su -", dann nochmal nano.', c: 'ex' });
      renderOut(); renderMap(); progress(); focusIn();
    }
    function exit() { if (dirty) { ask.hidden = false; $('[data-a="y"]', ask).focus(); return; } close(); }
    ta.addEventListener('keydown', e => {
      const k = e.key.toLowerCase();
      if ((e.ctrlKey || e.metaKey) && (k === 'o' || k === 's')) { e.preventDefault(); save(); return; }
      if ((e.ctrlKey || e.metaKey) && k === 'x') { e.preventDefault(); exit(); return; }
      if (e.key === 'Escape') { e.preventDefault(); exit(); return; }
      if (e.key === 'Tab') { e.preventDefault(); ta.setRangeText('\t', ta.selectionStart, ta.selectionEnd, 'end'); ta.dispatchEvent(new Event('input')); }
    });
    $('[data-a="save"]', md.el).onclick = () => { save(); ta.focus(); };
    $('[data-a="exit"]', md.el).onclick = exit;
    $('[data-a="y"]', md.el).onclick = () => { if (save()) close(); else { ask.hidden = true; ta.focus(); } };
    $('[data-a="n"]', md.el).onclick = close;
    $('[data-a="c"]', md.el).onclick = () => { ask.hidden = true; ta.focus(); };
    md.onKey = e => {
      if (e.key === 'Escape') { if (!ask.hidden) { ask.hidden = true; ta.focus(); } else exit(); return true; }
      if (!ask.hidden) {
        const k = e.key.toLowerCase();
        if (k === 'j' || k === 'y') { if (save()) close(); return true; }
        if (k === 'n') { close(); return true; }
      }
    };
    ta.focus(); ta.setSelectionRange(0, 0); ta.scrollTop = 0;
  }

  /* --- Start --- */
  if (tickets) startTicket();
  else { initWorld(); cur = D.start || 'router'; settle(); renderAll(); }
  focusIn();
  return {
    onKey(e) {
      if (e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey && e.target !== inp && !(e.target && e.target.closest && e.target.closest('.sim-tasks'))) { focusIn(); }
    }
  };
}
