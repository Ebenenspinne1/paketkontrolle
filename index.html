<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Paketkontrolle</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Retro-Pixel-Lernspiel zu Firewalls und nftables">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<style>
/* Layout: a night-shift border booth at the router. Beige paper documents lie on a navy desk,
   screens glow in the back. Everything snaps to a 4px pixel grid with hard shadows, no rounding. */
:root {
  --room: #13142a;
  --desk: #1b1f3d;
  --panel: #242a4f;
  --panel-hi: #2e3563;
  --ink: #0a0b18;
  --line: #3c4478;
  --fg: #ecebf7;
  --muted: #a3afd0;
  --dim: #6f7aa3;
  --paper: #f1e2c3;
  --paper-2: #e4d0a8;
  --paper-ink: #2b2236;
  --paper-edge: #b39a6d;
  --ok: #38b764;
  --ok-hi: #a7f070;
  --bad: #b13e53;
  --bad-hi: #ef7d57;
  --warn: #ffcd75;
  --info: #41a6f6;
  --cyan: #73eff7;
  --plum: #5d275d;
  --nat: #c77dff;
  --f-display: 'Press Start 2P', ui-monospace, 'Courier New', monospace;
  --f-body: 'VT323', ui-monospace, 'Lucida Console', 'Courier New', monospace;
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body {
  margin: 0;
  background-color: var(--room);
  background-image: radial-gradient(rgba(255,255,255,.035) 1px, transparent 1.2px);
  background-size: 8px 8px;
  color: var(--fg);
  font-family: var(--f-body);
  font-size: 21px;
  line-height: 1.22;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-font-smoothing: none;
}
.app { max-width: 1320px; margin: 0 auto; padding-block: 14px 40px; overflow-x: clip; overflow-clip-margin: 12px; }
h1, h2, h3, .px { font-family: var(--f-display); font-weight: 400; letter-spacing: .02em; text-wrap: balance; }
h2 { font-size: 16px; line-height: 1.5; margin: 0; }
h3 { font-size: 11px; line-height: 1.5; margin: 0; color: var(--muted); }
p { margin: 0; }
code { font-family: var(--f-body); background: rgba(10,11,24,.55); color: var(--cyan); padding: 0 5px; border: 1px solid var(--line); overflow-wrap: anywhere; }
.pass code, .memo-paper code, .doc code, .slip code, .report-paper code, .modal.paper code { background: rgba(43,34,54,.08); color: #2b4a8a; border-color: rgba(43,34,54,.2); white-space: normal; }
.verdict .trace .miss, .verdict .trace .no { color: var(--muted); }
.verdict .trace { margin-top: 8px; }
kbd { font-family: var(--f-display); font-size: 8px; padding: 3px 4px 2px; background: var(--ink); color: var(--warn); border: 1px solid var(--line); vertical-align: 2px; margin-right: 4px; }
b { font-weight: 700; }
.spr { display: block; image-rendering: pixelated; }
.muted { color: var(--muted); }

/* ---------------- Buttons ---------------- */
.btn {
  font-family: var(--f-display); font-size: 11px; line-height: 1.5; letter-spacing: .03em;
  color: var(--fg); background: var(--panel-hi);
  border: 3px solid var(--ink); padding: 11px 14px 10px; cursor: pointer; text-transform: uppercase;
  box-shadow: inset -3px -3px 0 rgba(0,0,0,.35), inset 3px 3px 0 rgba(255,255,255,.13), 0 4px 0 var(--ink);
  transition: background .08s;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
}
.btn:hover { background: #3a4278; }
.btn:active { transform: translateY(3px); box-shadow: inset 3px 3px 0 rgba(0,0,0,.35), 0 1px 0 var(--ink); }
.btn:focus-visible, .ans:focus-visible, select:focus-visible, .hk:focus-visible, .brick:focus-visible { outline: 3px solid var(--warn); outline-offset: 3px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; transform: none; }
.btn.go { background: var(--ok); color: var(--ink); }
.btn.go:hover { background: #4bd07a; }
.btn.warnb { background: var(--warn); color: var(--ink); }
.btn.badb { background: var(--bad); }
.btn.big { font-size: 14px; padding: 16px 22px 14px; }
.btn.tiny { font-size: 9px; padding: 6px 8px 5px; box-shadow: inset -2px -2px 0 rgba(0,0,0,.35), 0 3px 0 var(--ink); }
.btn.ghost { background: transparent; box-shadow: none; border-color: var(--line); }
.badge { background: var(--bad); color: var(--fg); padding: 2px 5px 1px; font-size: 9px; border: 2px solid var(--ink); }

/* ---------------- HUD ---------------- */
.hud {
  display: flex; align-items: center; gap: var(--s3); flex-wrap: wrap;
  background: var(--panel); border: 3px solid var(--ink); box-shadow: 0 4px 0 var(--ink);
  padding: 8px 10px; margin-bottom: 14px;
}
.hud-title { font-family: var(--f-display); font-size: 11px; line-height: 1.5; flex: 1 1 260px; min-width: 0; }
.hud-title small { display: block; font-family: var(--f-body); font-size: 18px; color: var(--muted); letter-spacing: 0; }
.hud-right { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; font-variant-numeric: tabular-nums; }
.hi { display: inline-flex; align-items: center; gap: 6px; font-size: 22px; }
.hi .spr { flex: none; }
.hi.combo { color: var(--warn); }
.hi.warn { color: var(--bad-hi); }
.hi .lbl { font-size: 17px; color: var(--muted); }

/* ---------------- Title ---------------- */
.title-screen { display: grid; justify-items: center; gap: 22px; padding-top: 18px; text-align: center; }
.parade {
  position: relative; width: min(760px, 100%); height: 96px; border-bottom: 4px solid var(--line);
  display: flex; align-items: flex-end; justify-content: space-between; padding: 0 6px 6px; overflow: hidden;
}
.parade .walker { position: absolute; bottom: 6px; left: 12%; animation: walk 7s linear infinite; }
.parade .walker:nth-child(2) { animation-delay: -2.3s; }
.parade .walker:nth-child(3) { animation-delay: -4.6s; }
.parade .walker .spr { animation: bob .36s steps(2) infinite; }
@keyframes walk { from { left: 14%; } to { left: 74%; } }
@keyframes bob { 50% { transform: translateY(-3px); } }
.logo { margin: 0; font-size: clamp(26px, 6.2vw, 58px); line-height: 1.15; color: var(--warn);
  text-shadow: 4px 4px 0 var(--bad), 8px 8px 0 var(--ink); display: grid; gap: 6px; }
.logo span:last-child { color: var(--fg); text-shadow: 4px 4px 0 var(--info), 8px 8px 0 var(--ink); }
.tagline { max-width: 60ch; color: var(--muted); font-size: 23px; }
.menu { display: grid; gap: 14px; width: min(360px, 100%); }
.menu .btn { width: 100%; }
.idcard {
  display: grid; grid-template-columns: auto 1fr; gap: 6px 18px; text-align: left; align-items: center;
  background: var(--paper); color: var(--paper-ink); border: 3px solid var(--paper-edge); padding: 12px 16px;
  box-shadow: 6px 6px 0 rgba(0,0,0,.45); transform: rotate(-1deg); min-width: min(360px, 100%);
}
.idcard .px { font-size: 9px; grid-column: 1 / -1; color: #7a6142; }
.idcard dt { color: #7a6142; }
.idcard dd { margin: 0; font-size: 24px; font-variant-numeric: tabular-nums; }
.blink { animation: blink 1.1s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0; } }

/* ---------------- Dienstplan ---------------- */
.plan-head { display: flex; justify-content: space-between; align-items: end; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
.plan-head p { color: var(--muted); max-width: 60ch; }
.plan { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 18px; }
.day {
  text-align: left; cursor: pointer; color: var(--paper-ink); font-family: var(--f-body); font-size: 21px;
  background: var(--paper); border: 3px solid var(--ink); padding: 0; box-shadow: 6px 6px 0 var(--ink);
  display: grid; grid-template-rows: auto 1fr auto;
}
.day:hover { transform: translate(-2px, -2px); box-shadow: 8px 8px 0 var(--ink); }
.day:focus-visible { outline: 3px solid var(--warn); outline-offset: 3px; }
.day-top { display: flex; justify-content: space-between; align-items: center; background: var(--paper-ink); color: var(--paper); padding: 8px 10px; font-family: var(--f-display); font-size: 10px; }
.day-top .mode { color: var(--warn); }
.day-body { padding: 10px 12px 4px; display: grid; gap: 4px; }
.day-t { font-family: var(--f-display); font-size: 12px; line-height: 1.5; }
.day-d { color: #6b5a44; font-size: 19px; }
.day-foot { display: flex; justify-content: space-between; align-items: center; padding: 6px 12px 10px; }
.stars { display: inline-flex; gap: 3px; }
.day.next { outline: 3px dashed var(--warn); outline-offset: 4px; }
.day.boss .day-top { background: var(--bad); }
.tagpill { font-family: var(--f-display); font-size: 8px; padding: 4px 5px 3px; border: 2px solid var(--paper-ink); }
.tagpill.done { background: var(--ok); color: var(--ink); border-color: var(--ink); }

/* ---------------- Memo ---------------- */
.memo-wrap { display: grid; place-items: center; padding-top: 10px; }
.memo-paper {
  width: min(760px, 100%); background: var(--paper); color: var(--paper-ink); border: 3px solid var(--paper-edge);
  box-shadow: 8px 8px 0 rgba(0,0,0,.5); padding: 20px 22px; display: grid; gap: 14px; transform: rotate(-.4deg);
  background-image: repeating-linear-gradient(transparent 0 30px, rgba(43,34,54,.06) 30px 31px);
}
.memo-head { display: grid; grid-template-columns: auto 1fr; gap: 16px; align-items: center; }
.memo-face { background: var(--panel); border: 3px solid var(--paper-ink); padding: 4px; }
.memo-from { font-family: var(--f-display); font-size: 9px; color: #7a6142; line-height: 1.6; }
.memo-paper h2 { font-size: 15px; }
.memo-paper p { font-size: 22px; max-width: 64ch; }
.keybox { border: 3px dashed var(--paper-ink); padding: 10px 12px; background: rgba(255,205,117,.25); font-size: 21px; }
.keybox .px { font-size: 9px; display: block; margin-bottom: 6px; }
.controls { font-size: 19px; color: #6b5a44; }
.memo-actions { display: flex; gap: 12px; justify-content: space-between; flex-wrap: wrap; }

/* ---------------- Cards (Quiz) ---------------- */
.cards-grid { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 18px; align-items: start; }
.host { display: grid; gap: 12px; justify-items: start; position: sticky; top: 12px; }
.host-face { background: var(--panel); border: 3px solid var(--ink); padding: 6px; box-shadow: 0 4px 0 var(--ink); }
.bubble {
  position: relative; background: var(--fg); color: var(--ink); border: 3px solid var(--ink); padding: 8px 10px;
  font-size: 20px; box-shadow: 4px 4px 0 var(--ink); min-height: 48px; width: 100%;
}
.bubble::before { content: ''; position: absolute; top: -12px; left: 22px; border: 6px solid transparent; border-bottom-color: var(--ink); }
.jokers { display: flex; gap: 8px; flex-wrap: wrap; }
.progress { width: 100%; display: grid; gap: 4px; }
.progress .bar { display: flex; gap: 3px; flex-wrap: wrap; }
.progress .seg { width: 12px; height: 12px; background: var(--panel); border: 2px solid var(--ink); }
.progress .seg.on { background: var(--ok); }
.progress .seg.re { background: var(--warn); }
.progress small { color: var(--muted); font-size: 18px; }
.stage-wrap { display: grid; gap: 16px; min-width: 0; }
.stage { background: var(--panel); border: 3px solid var(--ink); box-shadow: 0 5px 0 var(--ink); padding: 18px; display: grid; gap: 16px; min-width: 0; }
.q-meta { font-family: var(--f-display); font-size: 9px; color: var(--warn); line-height: 1.6; }
.q { font-size: 27px; line-height: 1.2; max-width: 66ch; }
.answers { display: grid; gap: 10px; }
.answers.tf { grid-template-columns: 1fr 1fr; }
.ans {
  display: flex; align-items: center; gap: 12px; text-align: left; width: 100%;
  font-family: var(--f-body); font-size: 23px; line-height: 1.15; color: var(--fg);
  background: var(--desk); border: 3px solid var(--ink); padding: 10px 12px; cursor: pointer;
  box-shadow: inset -3px -3px 0 rgba(0,0,0,.3), 0 3px 0 var(--ink);
}
.ans:hover:not([disabled]) { background: var(--panel-hi); }
.ans > span:last-child { min-width: 0; overflow-wrap: anywhere; }
.q { overflow-wrap: break-word; }
.ans .k { flex: none; font-family: var(--f-display); font-size: 10px; width: 26px; height: 26px; display: grid; place-items: center; background: var(--ink); color: var(--warn); }
.ans.sel { background: #2b4a8a; }
.ans.sel .k { background: var(--warn); color: var(--ink); }
.ans.right { background: #1f5e3a; border-color: var(--ok-hi); }
.ans.wrong { background: #5c1f2e; border-color: var(--bad-hi); }
.ans.gone { visibility: hidden; }
.ans[disabled] { cursor: default; }
.tf .ans { justify-content: center; font-family: var(--f-display); font-size: 14px; padding: 18px; }
.verdict { border: 3px solid var(--ink); box-shadow: 0 5px 0 var(--ink); padding: 14px 16px; display: grid; gap: 10px; background: var(--panel); }
.verdict.ok { border-color: var(--ok); }
.verdict.bad { border-color: var(--bad-hi); }
.v-head { font-family: var(--f-display); font-size: 13px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.verdict.ok .v-head { color: var(--ok-hi); }
.verdict.bad .v-head { color: var(--bad-hi); }
.v-head .plus { color: var(--warn); font-size: 10px; }
.v-body { font-size: 22px; max-width: 72ch; }
.v-foot { display: flex; justify-content: space-between; gap: 12px; align-items: center; flex-wrap: wrap; }
.again { color: var(--warn); font-size: 19px; }

/* Hook board */
.board {
  position: relative; width: 100%; max-width: 820px; aspect-ratio: 100 / 46; container-type: inline-size;
  background: var(--desk); border: 3px solid var(--ink); justify-self: center;
  background-image: linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px);
  background-size: 2% 4.35%;
}
.board svg.wires { position: absolute; inset: 0; width: 100%; height: 100%; }
.board .wires line, .board .wires polyline { stroke: var(--line); stroke-width: 3; fill: none; }
.board .wires polygon { fill: var(--line); }
.board .wires text { fill: var(--muted); font-family: var(--f-body); font-size: 2.1px; }
.hk, .lp {
  position: absolute; display: grid; place-items: center; text-align: center;
  font-family: var(--f-display); font-size: clamp(7px, 1.45cqw, 12px); line-height: 1.3; color: var(--fg);
  background: var(--panel-hi); border: 3px solid var(--ink); box-shadow: 0 3px 0 var(--ink); padding: 2px;
}
.hk { cursor: pointer; }
.hk:hover { background: #3a4278; }
.lp { background: var(--plum); font-size: clamp(7px, 1.25cqw, 11px); cursor: default; }
.lp small { display: block; font-family: var(--f-body); font-size: clamp(12px, 1.9cqw, 18px); color: var(--muted); }
.diamond { position: absolute; background: var(--warn); border: 3px solid var(--ink); transform: rotate(45deg); }
.hk .ord { position: absolute; top: -12px; right: -10px; width: 22px; height: 22px; display: grid; place-items: center; background: var(--warn); color: var(--ink); border: 2px solid var(--ink); font-size: 10px; }
.hk .ord:empty { display: none; }
.hk.chosen { background: #2b4a8a; }
.hk.good { background: var(--ok); color: var(--ink); }
.hk.badh { background: var(--bad); }
.hk.miss { outline: 3px dashed var(--ok-hi); outline-offset: 2px; }
.board.static .hk { cursor: default; }
.pk { position: absolute; transform: translate(-50%, -50%); transition: left .28s linear, top .28s linear; z-index: 3; pointer-events: none; }
.pk[hidden] { display: none; }
.board-actions { display: flex; gap: 10px; flex-wrap: wrap; }
.path-line { font-family: var(--f-display); font-size: 10px; color: var(--muted); line-height: 1.8; min-height: 1.8em; }
.path-line b { color: var(--warn); font-weight: 400; }

/* Terminal */
.term { background: #07080f; border: 3px solid var(--ink); box-shadow: 0 5px 0 var(--ink); min-width: 0; }
.term-bar { display: flex; gap: 6px; align-items: center; padding: 6px 10px; background: var(--panel-hi); font-family: var(--f-display); font-size: 9px; color: var(--muted); }
.term-bar i { width: 10px; height: 10px; display: inline-block; background: var(--bad); border: 2px solid var(--ink); }
.term-bar i:nth-child(2) { background: var(--warn); }
.term-bar i:nth-child(3) { background: var(--ok); }
.term-body { padding: 12px 14px 16px; display: grid; gap: 10px; color: #c9f7d4; font-size: 23px; overflow-x: auto; }
.term-plan { color: var(--muted); }
.term-plan::before { content: '# '; color: var(--dim); }
.cmd { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; }
.cmd .prompt { color: var(--ok-hi); }
.cmd .tok { color: #e8f5ff; }
.sel {
  font-family: var(--f-body); font-size: 22px; color: var(--warn); background: #141a33; border: 2px solid var(--warn);
  padding: 1px 4px; cursor: pointer; max-width: 100%;
}
.sel.okc { border-color: var(--ok-hi); color: var(--ok-hi); }
.sel.badc { border-color: var(--bad-hi); color: var(--bad-hi); }
.term-out { white-space: pre-wrap; }
.term-out .okl { color: var(--ok-hi); }
.term-out .badl { color: var(--bad-hi); }

/* IHK table */
.doc { background: var(--paper); color: var(--paper-ink); border: 3px solid var(--paper-edge); padding: 14px 16px; display: grid; gap: 10px; box-shadow: 6px 6px 0 rgba(0,0,0,.45); min-width: 0; }
.doc-h { font-family: var(--f-display); font-size: 11px; line-height: 1.6; }
.doc p { font-size: 21px; max-width: 80ch; }
.tbl-wrap { overflow-x: auto; }
table.ihk { border-collapse: collapse; font-size: 20px; min-width: 100%; }
.ihk th, .ihk td { border: 2px solid var(--paper-ink); padding: 4px 6px; text-align: left; vertical-align: top; }
.ihk th { background: var(--paper-2); font-family: var(--f-display); font-size: 8px; line-height: 1.5; }
.ihk td.given { color: #6b5a44; }
.ihk td.okc { background: rgba(56,183,100,.25); }
.ihk td.badc { background: rgba(177,62,83,.22); }
.ihk .fix { display: block; color: var(--bad); font-size: 18px; }
.ihk select { font-family: var(--f-body); font-size: 20px; color: var(--paper-ink); background: #fff8e8; border: 2px solid var(--paper-ink); padding: 0 2px; max-width: 13ch; }
.rownote { font-size: 18px; color: #3d5c2e; }

/* ---------------- Shift / Desk ---------------- */
.booth {
  position: relative; height: 92px; margin-bottom: 14px; overflow: hidden;
  background: linear-gradient(#20254a 0 66%, #2b2f55 66% 70%, #171a33 70%);
  border: 3px solid var(--ink); box-shadow: 0 4px 0 var(--ink);
}
.booth::before { /* wall bricks */
  content: ''; position: absolute; inset: 0 0 34% 0; opacity: .5;
  background-image: linear-gradient(rgba(0,0,0,.25) 2px, transparent 2px), linear-gradient(90deg, rgba(0,0,0,.25) 2px, transparent 2px);
  background-size: 32px 14px;
}
.booth-window { position: absolute; left: 61%; top: 6px; width: 92px; height: 52px; background: #0c1022; border: 3px solid var(--ink); display: grid; place-items: center; }
.booth-window span, .booth-gate span, .booth-pit span, .booth-sign { font-family: var(--f-display); font-size: 7px; color: var(--muted); }
.booth-window::after { content: ''; position: absolute; inset: 6px; border: 2px solid rgba(115,239,247,.25); }
.booth-gate { position: absolute; right: 8px; top: 8px; display: grid; gap: 4px; justify-items: end; }
.booth-gate .lamp { width: 14px; height: 14px; background: #133; border: 2px solid var(--ink); }
.booth-gate .lamp.on { background: var(--ok-hi); box-shadow: 0 0 10px var(--ok-hi); }
.booth-pit { position: absolute; left: 78%; bottom: 0; width: 70px; height: 14px; background: #000; border: 3px solid var(--ink); border-bottom: 0; display: grid; place-items: center; }
.booth-pit span { position: absolute; top: -14px; }
.booth-sign { position: absolute; left: 8px; top: 8px; color: var(--warn); }
.qenv { position: absolute; bottom: 26px; transition: left .4s steps(6), transform .4s, opacity .4s; }
.qenv .spr { animation: bob .4s steps(2) infinite; }
.qenv.cur .spr { animation: none; }
.qenv.go-acc { left: 104% !important; }
.qenv.go-drp { left: calc(78% + 22px) !important; }
.qenv.fall { transform: translateY(60px) scale(.6); opacity: 0; }

.desk { display: grid; grid-template-columns: minmax(300px, 410px) minmax(0, 1fr); gap: 16px; align-items: start; }
.desk-left { display: grid; gap: 14px; min-width: 0; }
.desk-right { display: grid; gap: 14px; min-width: 0; }
.pass {
  position: relative; background: var(--paper); color: var(--paper-ink); border: 3px solid var(--paper-edge);
  padding: 12px 14px 14px; box-shadow: 6px 6px 0 rgba(0,0,0,.5); transform: rotate(var(--rot, -1deg));

<script>
/* =====================================================================
   ENGINE – Routing, nftables-Auswertung, Pakete
   ===================================================================== */

const SVC = {
  ssh:        { proto: 'tcp', port: 22,   name: 'SSH' },
  telnet:     { proto: 'tcp', port: 23,   name: 'Telnet' },
  smtp:       { proto: 'tcp', port: 25,   name: 'SMTP' },
  dns:        { proto: 'udp', port: 53,   name: 'DNS' },
  http:       { proto: 'tcp', port: 80,   name: 'HTTP' },
  pop3:       { proto: 'tcp', port: 110,  name: 'POP3' },
  imap:       { proto: 'tcp', port: 143,  name: 'IMAP' },
  https:      { proto: 'tcp', port: 443,  name: 'HTTPS' },
  smb:        { proto: 'tcp', port: 445,  name: 'SMB' },
  smtps:      { proto: 'tcp', port: 465,  name: 'SMTPS' },
  submission: { proto: 'tcp', port: 587,  name: 'Submission' },
  imaps:      { proto: 'tcp', port: 993,  name: 'IMAPS' },
  mysql:      { proto: 'tcp', port: 3306, name: 'MySQL' },
  rdp:        { proto: 'tcp', port: 3389, name: 'RDP' },
  ping:       { proto: 'icmp', icmp: 'echo-request', name: 'Ping' }
};
const PORT_LABEL = {};
Object.keys(SVC).forEach(k => { if (SVC[k].port) PORT_LABEL[SVC[k].port] = SVC[k].name; });
const PORT_NAMES = { ssh: 22, telnet: 23, smtp: 25, domain: 53, http: 80, pop3: 110, imap: 143,
  https: 443, smtps: 465, submission: 587, imaps: 993, mysql: 3306, rdp: 3389 };
const CT_LABEL = { new: 'NEU', established: 'ESTABLISHED', related: 'RELATED' };

const IPU = {
  int(ip) { return ip.split('.').reduce((a, b) => a * 256 + (+b), 0); },
  inNet(ip, net) {
    if (!ip) return false;
    if (net === 'any' || net === '0.0.0.0/0') return true;
    const parts = net.split('/');
    if (parts.length === 1) return ip === net;
    const bits = +parts[1];
    const mask = bits === 0 ? 0 : (0xFFFFFFFF << (32 - bits)) >>> 0;
    return ((IPU.int(ip) & mask) >>> 0) === ((IPU.int(parts[0]) & mask) >>> 0);
  }
};

/* ---------- Regel-Parser für die nftables-Teilmenge im Spiel ---------- */
function parseRule(text) {
  const toks = text.match(/"[^"]*"|\{[^}]*\}|\S+/g) || [];
  const unq = t => t.replace(/^"|"$/g, '');
  const list = t => (t.startsWith('{') ? t.slice(1, -1).split(',') : [t])
    .map(x => unq(x.trim())).filter(Boolean);
  const port = x => (PORT_NAMES[x] !== undefined ? PORT_NAMES[x] : +x);
  const m = {}; let v = null, to = null, i = 0;
  while (i < toks.length) {
    const t = toks[i++];
    if (t === 'ct') {
      if (toks[i] === 'state') i++;
      m.ct = list(toks[i++]).flatMap(x => x.split(',')).map(x => x.trim()).filter(Boolean);
    } else if (t === 'iif' || t === 'iifname') m.iif = list(toks[i++]);
    else if (t === 'oif' || t === 'oifname') m.oif = list(toks[i++]);
    else if (t === 'ip' || t === 'ip6') { const k = toks[i++]; m[k] = list(toks[i++]); }
    else if (t === 'tcp' || t === 'udp') {
      m.proto = t;
      if (toks[i] === 'dport') { i++; m.dport = list(toks[i++]).map(port); }
    } else if (t === 'icmp') {
      m.proto = 'icmp';
      if (toks[i] === 'type') { i++; m.icmp = toks[i++]; }
    } else if (t === 'accept' || t === 'drop' || t === 'reject' || t === 'masquerade') v = t;
    else if (t === 'dnat' || t === 'snat') { v = t; if (toks[i] === 'to') i++; to = toks[i++]; }
    else if (t === 'counter' || t === 'log') { /* nicht-terminal */ }
    else throw new Error('Regel nicht verstanden: "' + t + '" in: ' + text);
  }
  return { t: text, m, v, to };
}

/* ruleset definition -> evaluierbares Objekt */
function buildRS(def) {
  const tables = def.tables.map(t => ({
    fam: t.fam, name: t.name,
    chains: t.chains.map(c => ({
      name: c.name, type: c.type, hook: c.hook, prio: c.prio, policy: c.policy,
      tname: t.name, tfam: t.fam, rules: c.rules.map(parseRule)
    }))
  }));
  return { id: def.id, tables, chains: tables.flatMap(t => t.chains) };
}

/* ---------- Szenario / Routing ---------- */
function mkScen(def) {
  def.byId = {};
  def.hosts.forEach(h => { def.byId[h.id] = h; });
  return def;
}
function ifByName(sc, n) { return sc.ifs.find(f => f.name === n) || null; }
function routerIfByIp(sc, ip) { return sc.ifs.find(f => f.ip === ip) || null; }
function isRouterIp(sc, ip) { return ip === '127.0.0.1' || !!routerIfByIp(sc, ip); }
function routeOut(sc, dst) {
  if (dst === '127.0.0.1') return 'lo';
  const f = sc.ifs.find(x => x.net && IPU.inNet(dst, x.net));
  return f ? f.name : (sc.wan || null);
}
function hostByIp(sc, ip) { return sc.hosts.find(h => h.ip === ip) || null; }
function nameOfIp(sc, ip) {
  const h = hostByIp(sc, ip); if (h) return h.id;
  const f = routerIfByIp(sc, ip); if (f) return sc.router + ' (' + f.name + ')';
  if (ip === '127.0.0.1') return sc.router + ' (lo)';
  return 'Internet';
}

let RNG = Math.random;
function pickOne(a) { return a[Math.floor(RNG() * a.length)]; }
function ephemeral() { return 49152 + Math.floor(RNG() * 16000); }

function resolveRef(sc, ref) {
  if (ref === 'R') return { local: true };
  if (ref === 'lo') return { ip: '127.0.0.1', iif: 'lo' };
  if (ref.indexOf('R:') === 0) { const f = ifByName(sc, ref.slice(2)); return { ip: f.ip, iif: null, router: true }; }
  if (ref[0] === '@') {
    const ifn = ref.slice(1);
    const h = pickOne(sc.hosts.filter(x => x.if === ifn && !x.fixed));
    return { ip: h.ip, iif: h.if, id: h.id };
  }
  const h = sc.byId[ref];
  if (h) return { ip: h.ip, iif: h.if, id: h.id };
  return { ip: ref, iif: routeOut(sc, ref) };
}

/* spec: {from, to, svc, reply?} -> Paket */
function makePacket(sc, spec) {
  const s = SVC[spec.svc];
  if (!s) throw new Error('Unbekannter Dienst ' + spec.svc);
  const a = resolveRef(sc, spec.from), b = resolveRef(sc, spec.to);
  const p = { scen: sc.id, proto: s.proto, ct: spec.reply ? 'established' : 'new', svc: spec.svc, reply: !!spec.reply };
  p.dst = b.ip;
  if (a.local) { p.local = true; p.src = ifByName(sc, routeOut(sc, p.dst)).ip; p.iif = null; }
  else { p.local = false; p.src = a.ip; p.iif = a.iif; }
  if (s.icmp) p.icmp = spec.reply ? 'echo-reply' : s.icmp;
  if (s.port) {
    if (spec.reply) { p.sport = s.port; p.dport = ephemeral(); }
    else { p.sport = ephemeral(); p.dport = s.port; }
  }
  if (spec.note) p.note = spec.note;
  return p;
}

function packetKey(rsId, p) {
  return ['pkt', p.scen, rsId, p.src, p.dst, p.proto, p.reply ? p.sport : p.dport, p.ct, p.local ? 1 : 0, p.icmp || ''].join('|');
}

/* ---------- Auswertung ---------- */
function mismatch(m, p, ctx) {
  if (m.ct && m.ct.indexOf(p.ct) < 0)
    return 'Paket ist ' + CT_LABEL[p.ct] + ', die Regel gilt nur für ' + m.ct.join(',');
  if (m.iif) {
    if (!p.iif) return 'lokal erzeugt, also kein Eingangs-Interface';
    if (m.iif.indexOf(p.iif) < 0) return 'kam über ' + p.iif + ', die Regel will ' + m.iif.join('/');
  }
  if (m.oif) {
    if (!ctx.oif) return 'in INPUT gibt es kein Ausgangs-Interface';
    if (m.oif.indexOf(ctx.oif) < 0) return 'geht über ' + ctx.oif + ' raus, die Regel will ' + m.oif.join('/');
  }
  if (m.saddr && !m.saddr.some(n => IPU.inNet(p.src, n)))
    return 'Quelle ' + p.src + ' passt nicht zu ' + m.saddr.join(', ');
  if (m.daddr && !m.daddr.some(n => IPU.inNet(p.dst, n)))
    return 'Ziel ' + p.dst + ' passt nicht zu ' + m.daddr.join(', ');
  if (m.proto && m.proto !== p.proto)
    return 'Protokoll ' + p.proto.toUpperCase() + ', die Regel will ' + m.proto.toUpperCase();
  if (m.dport && m.dport.indexOf(p.dport) < 0)
    return 'Ziel-Port ' + p.dport + (m.dport.length > 1 ? ' nicht in { ' + m.dport.join(', ') + ' }' : ' statt ' + m.dport[0]);
  if (m.icmp && p.icmp !== m.icmp) return 'kein ICMP ' + m.icmp;
  return null;
}

function evalChain(ch, p, ctx) {
  const trace = [];
  for (let i = 0; i < ch.rules.length; i++) {
    const r = ch.rules[i];
    const why = mismatch(r.m, p, ctx);
    if (why) { trace.push({ i, ok: false, why }); continue; }
    trace.push({ i, ok: true });
    if (r.v) {
      const verdict = (r.v === 'drop' || r.v === 'reject') ? r.v : 'accept';
      return { verdict, idx: i, rule: r, trace, policy: false };
    }
  }
  return { verdict: ch.policy || 'accept', idx: -1, rule: null, trace, policy: true };
}

function processPacket(sc, rs, pkt) {
  const p = Object.assign({}, pkt);
  let dnat = null;
  if (!p.local) {
    const pre = rs.chains.find(c => c.hook === 'prerouting' && c.type === 'nat');
    if (pre) {
      const r = evalChain(pre, p, { oif: null });
      if (r.rule && r.rule.v === 'dnat') { dnat = { from: p.dst, to: r.rule.to, idx: r.idx, chain: pre, rule: r.rule }; p.dst = r.rule.to; }
    }
  }
  const hook = p.local ? 'output' : (isRouterIp(sc, p.dst) ? 'input' : 'forward');
  const oif = hook === 'input' ? null : routeOut(sc, p.dst);
  const chain = rs.chains.find(c => c.hook === hook && c.type === 'filter') || null;
  const r = chain ? evalChain(chain, p, { oif }) : { verdict: 'accept', idx: -1, trace: [], policy: false, noChain: true };
  let snat = null;
  if (r.verdict === 'accept' && hook !== 'input') {
    const post = rs.chains.find(c => c.hook === 'postrouting' && c.type === 'nat');
    if (post) {
      const s = evalChain(post, p, { oif });
      if (s.rule && (s.rule.v === 'masquerade' || s.rule.v === 'snat')) {
        snat = { v: s.rule.v, to: s.rule.v === 'masquerade' ? (ifByName(sc, oif) || {}).ip : s.rule.to, idx: s.idx, chain: post, rule: s.rule };
      }
    }
  }
  return {
    hook, oif, chain, p, dnat, snat,
    verdict: r.verdict === 'accept' ? 'accept' : 'drop',
    raw: r.verdict, idx: r.idx, trace: r.trace, policy: !!r.policy, noChain: !!r.noChain
  };
}

const HOOK_LABEL = { input: 'INPUT', forward: 'FORWARD', output: 'OUTPUT', prerouting: 'PREROUTING', postrouting: 'POSTROUTING' };

/* Erklärsatz zur Hook-Bestimmung (Text, ohne HTML) */
function hookReason(sc, pkt, res) {
  const d = res.p.dst;
  if (res.hook === 'output') return 'Absender ist der Router selbst (lokaler Prozess), also OUTPUT';
  if (res.hook === 'input') {
    if (d === '127.0.0.1') return 'Ziel 127.0.0.1 ist das Loopback des Routers, also INPUT';
    const f = routerIfByIp(sc, d);
    let s = 'Ziel ' + d + ' gehört dem Router' + (f ? ' (' + f.name + ')' : '') + '. Das Paket ist FÜR den Router, also INPUT';
    if (f && pkt.iif && f.name !== pkt.iif) s += '. Es kommt trotzdem über ' + pkt.iif + ' rein, nicht über ' + f.name + '!';
    return s;
  }
  return 'Ziel ' + d + ' liegt hinter dem Router (raus über ' + res.oif + '). Durchgeleitet, also FORWARD';
}

}

    x: 'Weicht etwas stark vom Normalen ab (z. B. nachts 5 GB Upload), schlägt sie an. Vorteil: Sie findet auch Unbekanntes. Nachteil: mehr False Positives.' },
  { id: 'g08', type: 'mc', q: 'Was unterscheidet ein HIDS von einem NIDS?',
    a: ['Das HIDS läuft auf einem einzelnen Rechner, das NIDS überwacht den Netzwerkverkehr', 'Das HIDS blockiert, das NIDS meldet nur', 'Das HIDS ist für IPv6, das NIDS für IPv4', 'Es gibt keinen Unterschied'], c: 0,
    hint: 'H = Host, N = Network.',
    x: 'Ein HIDS sieht z. B. Logdateien und Dateiänderungen auf einem Rechner. Ein NIDS sieht den Verkehr im Netz, typischerweise am Mirror-Port eines Switches.' },
  { id: 'g09', type: 'mc', q: 'Auf welchen OSI-Schichten filtert ein klassischer Paketfilter?',
    a: ['Schicht 3 und 4 (Vermittlung, Transport)', 'Schicht 1 und 2', 'Schicht 5', 'Schicht 7'], c: 0,
    hint: 'IP-Adressen und Ports.',
    x: 'Er liest IP-Adressen (Schicht 3) und Ports bzw. Protokolle (Schicht 4) aus dem Header. Den Inhalt versteht er nicht.' },
  { id: 'g10', type: 'tf', q: 'Ein Paketfilter kann erkennen, ob eine HTTP-Anfrage einen SQL-Injection-Angriff enthält.', c: false,
    x: 'Falsch. Der Paketfilter sieht nur IPs und Ports. Den Inhalt (Schicht 7) prüfen ALG, WAF oder NGFW.' },
  { id: 'g11', type: 'tf', q: 'Eine SPI-Firewall erkennt anhand ihrer Zustandstabelle, ob ein Paket zu einer bestehenden Verbindung gehört.', c: true,
    x: 'Richtig. SPI = Stateful Packet Inspection. Sie merkt sich Verbindungen (State Table) und lässt passende Antwortpakete automatisch durch.' },
  { id: 'g12', type: 'mc', q: 'Woran erkennt eine SPI-Firewall den Zustand einer TCP-Verbindung?',
    a: ['An den TCP-Flags wie SYN, ACK, FIN und RST', 'An der MAC-Adresse', 'Am Inhalt der Webseite', 'An der TTL'], c: 0,
    x: 'SYN, dann SYN/ACK, dann ACK: Die Verbindung steht (established). FIN oder RST bedeuten Abbau. Einträge laufen nach einem Timeout ab.' },
  { id: 'g13', type: 'mc', q: 'Warum muss man bei einem stateless Paketfilter extra Regeln für Antwortpakete anlegen?',
    a: ['Weil er sich keine Verbindungen merkt und jedes Paket einzeln prüft', 'Weil Antwortpakete immer verschlüsselt sind', 'Weil er nur ausgehenden Verkehr sieht', 'Muss man nicht, er erlaubt Antworten automatisch'], c: 0,
    x: 'Ohne Gedächtnis weiß er nicht, dass ein Paket eine Antwort ist. Darum braucht es eine Rückregel (z. B. Quell-Port 80 zum Client).' },
  { id: 'g14', type: 'mc', q: 'Welcher Firewall-Typ arbeitet auf Schicht 7 und trennt die Verbindung (Client ↔ Proxy ↔ Server)?',
    a: ['Application Level Gateway (Proxy)', 'Stateless Paketfilter', 'SPI-Firewall', 'Circuit Level Gateway'], c: 0,
    x: 'Das ALG baut zwei getrennte Verbindungen auf und versteht das Protokoll (z. B. HTTP). Sehr sicher, aber langsamer.' },
  { id: 'g15', type: 'mc', q: 'Ein Circuit Level Gateway arbeitet auf …',
    a: ['Schicht 5 (Sitzung) und prüft nur den Verbindungsaufbau', 'Schicht 2', 'Schicht 7 und prüft jeden Inhalt', 'Schicht 1'], c: 0,
    x: 'Beispiel SOCKS: Es kontrolliert, ob eine Sitzung aufgebaut werden darf, schaut aber nicht in die Daten.' },
  { id: 'g16', type: 'mc', q: 'Was zeichnet eine Personal Firewall aus?',
    a: ['Sie läuft auf dem Endgerät selbst und kann auch einzelne Programme kontrollieren', 'Sie schützt ein ganzes Firmennetz am Internetzugang', 'Sie ist immer ein eigenes Hardware-Gerät', 'Sie arbeitet nur auf Schicht 2'], c: 0,
    x: 'Beispiel: die Windows-Firewall. Sie schützt genau diesen einen Rechner, auch im fremden WLAN.' },
  { id: 'g17', type: 'multi', q: 'Welche zwei Punkte sind Vorteile einer Next Generation Firewall gegenüber einem klassischen Paketfilter?',
    a: ['Sie erkennt Anwendungen unabhängig vom Port (Deep Packet Inspection)', 'Sie hat ein integriertes IPS', 'Sie braucht keine Regeln mehr', 'Sie ist grundsätzlich schneller als jeder Paketfilter', 'Sie macht Virenschutz auf den Clients überflüssig'], c: [0, 1],
    x: 'NGFW = SPI plus Anwendungserkennung (DPI) plus IPS, oft auch TLS-Inspection und benutzerbasierte Regeln. Regeln braucht sie weiterhin.' },
  { id: 'g18', type: 'multi', q: 'Wovor schützt eine Firewall NICHT?',
    a: ['Angriffe von einem Rechner innerhalb des eigenen LANs', 'Schadsoftware im erlaubten E-Mail-Anhang', 'SQL-Injection über den erlaubten Port 443', 'Portscans aus dem Internet', 'Zugriffe auf nicht freigegebene Ports'], c: [0, 1, 2],
    x: 'Eine Firewall kontrolliert nur Verkehr, der durch sie hindurch läuft. Ein Paketfilter prüft dabei nur Header-Merkmale. Was über erlaubte Wege kommt oder innen bleibt, sieht sie nicht.' },
  { id: 'g19', type: 'mc', q: 'Der Webserver der Event GmbH ist durch eine SPI-Firewall geschützt, trotzdem gelingt eine SQL-Injection. Warum?',
    a: ['Der Angriff steckt im Inhalt einer erlaubten HTTP(S)-Anfrage, die SPI prüft aber nur Schicht 3/4', 'Die SPI-Firewall war falsch herum angeschlossen', 'SQL-Injection nutzt UDP, das die SPI nicht kennt', 'SPI-Firewalls lassen nachts alles durch'], c: 0,
    x: 'Für die SPI ist das ein ganz normales Paket an Port 443 einer bestehenden Verbindung. Schutz bieten eine WAF, Prepared Statements und Eingabeprüfung.' },
  { id: 'g20', type: 'mc', q: 'Was schützt gezielt Webanwendungen vor SQL-Injection und Cross-Site-Scripting?',
    a: ['Web Application Firewall (WAF)', 'Stateless Paketfilter', 'Ein Switch mit VLANs', 'Ein IDS am Mirror-Port'], c: 0,
    x: 'Die WAF versteht HTTP und prüft Formulareingaben, URLs und Cookies auf Angriffsmuster (Schicht 7).' },
  { id: 'g21', type: 'mc', q: 'Wozu dient eine DMZ?',
    a: ['Öffentlich erreichbare Server werden in ein eigenes Netzsegment gestellt, getrennt vom internen LAN', 'Sie beschleunigt den Internetzugang', 'Sie verschlüsselt den Verkehr ins Internet', 'Sie ersetzt die Firewall'], c: 0,
    x: 'Wird ein DMZ-Server (z. B. der Webserver) gehackt, steht der Angreifer immer noch VOR dem internen Netz. Die Firewall trennt DMZ und LAN.' },
  { id: 'g22', type: 'multi', q: 'Welche Server gehören typischerweise in die DMZ?',
    a: ['Webserver', 'Mailserver (Mail-Relay)', 'Domain Controller', 'Dateiserver mit Personalakten', 'Datenbankserver der Buchhaltung'], c: [0, 1],
    x: 'In die DMZ kommt, was aus dem Internet erreichbar sein muss. Interne Dienste wie DC, Dateiserver oder interne Datenbanken bleiben im LAN.' },
  { id: 'g23', type: 'mc', q: 'Was ist eine zweistufige DMZ (Screened Subnet)?',
    a: ['Die DMZ liegt zwischen zwei Firewalls, einer äußeren und einer inneren', 'Eine Firewall mit drei Anschlüssen', 'Zwei DMZs nebeneinander an einem Switch', 'Eine DMZ ohne Firewall'], c: 0,
    x: 'Ein Angreifer müsste zwei Firewalls überwinden, am besten von zwei Herstellern. Die einstufige Variante (Three-legged) hat eine Firewall mit drei Anschlüssen. Beispiel zweistufig: REXIT GmbH.' },
  { id: 'g24', type: 'mc', q: 'Was ist der Nachteil einer einstufigen DMZ (eine Firewall mit drei Anschlüssen)?',
    a: ['Die eine Firewall ist ein Single Point of Failure. Fällt sie aus oder wird sie geknackt, ist alles offen.', 'Sie ist teurer als die zweistufige', 'Webserver können darin nicht betrieben werden', 'Sie funktioniert nur mit IPv6'], c: 0,
    x: 'Einstufig ist günstiger und einfacher, aber alles hängt an einem Gerät.' },
  { id: 'g25', type: 'mc', q: 'Auf welchen zwei OSI-Schichten filtert eine SPI-Firewall? (REXIT-Aufgabe)',
    a: ['Vermittlungsschicht (3) und Transportschicht (4)', 'Sicherungsschicht (2) und Vermittlungsschicht (3)', 'Transportschicht (4) und Anwendungsschicht (7)', 'Bitübertragung (1) und Sicherung (2)'], c: 0,
    x: 'Schicht 3: IP-Adressen. Schicht 4: Ports, TCP-Flags, Verbindungszustand.' },
  { id: 'g26', type: 'mc', q: 'Was ist ein Nachteil einer stateful Firewall gegenüber einer stateless?',
    a: ['Ihre Zustandstabelle kann durch DDoS (z. B. SYN-Flood) überlastet werden', 'Sie kann keine Antwortpakete erkennen', 'Sie arbeitet nur auf Schicht 7', 'Sie ist unsicherer'], c: 0,
    x: 'Jede Verbindung kostet einen Eintrag im Speicher. Stateless ist schneller und günstiger, aber unsicherer.' },
  { id: 'g27', type: 'tf', q: 'Eine Firewall am Internetzugang kann Verkehr zwischen zwei PCs am selben Switch blockieren.', c: false,
    x: 'Falsch. Dieser Verkehr läuft gar nicht über die Firewall, sondern direkt über den Switch. Dagegen helfen eine Personal Firewall oder Segmentierung (VLANs).' },
  { id: 'g28', type: 'tf', q: 'Ein IPS kann durch einen Fehlalarm (False Positive) legitimen Verkehr blockieren.', c: true,
    x: 'Richtig. Das ist das Risiko beim IPS, denn es greift aktiv ein. Ein IDS würde nur einen unnötigen Alarm schicken.' },

  /* ---------- Tag 2: Hook-Wege ---------- */
  { id: 'h01', type: 'path', q: 'PC-A (Büro, eth0) ruft die Webseite auf Web-B (Server-Netz, eth1) auf.', c: ['pre', 'fwd', 'post'],
    x: 'Das Ziel liegt HINTER dem Router, also wird durchgeleitet: PREROUTING, FORWARD, POSTROUTING.' },
  { id: 'h02', type: 'path', q: 'PC-A baut eine SSH-Verbindung zum Router selbst auf (192.168.10.1).', c: ['pre', 'in'],
    x: 'Das Ziel ist der Router selbst. Nach der Routing-Entscheidung geht es hoch zu INPUT und dann zum lokalen Prozess (sshd).' },
  { id: 'h03', type: 'path', q: 'Der Router lädt selbst Updates aus dem Internet (das erste Paket seiner Anfrage).', c: ['out', 'post'],
    x: 'Vom Router selbst erzeugt: OUTPUT, dann POSTROUTING. PREROUTING sieht das Paket nie, weil es nicht von außen kommt.' },
  { id: 'h04', type: 'path', q: 'Der Router antwortet auf einen Ping von PC-A (Echo-Reply).', c: ['out', 'post'],
    x: 'Die Antwort erzeugt der Router selbst, also OUTPUT und dann POSTROUTING.' },
  { id: 'h05', type: 'path', q: 'Web-B schickt die Antwort (die Webseite) an PC-A zurück.', c: ['pre', 'fwd', 'post'],
    x: 'Auch Antworten werden durchgeleitet, also FORWARD. Deshalb braucht die forward-Chain `ct state established,related accept`.' },
  { id: 'h06', type: 'path', q: 'PC-A (eth0) pingt 10.0.0.1. Das ist die Router-Adresse auf der ANDEREN Seite (eth1).', c: ['pre', 'in'],
    x: 'Falle! Auch die Adresse auf eth1 gehört dem Router. Ziel = Router, also INPUT. Hier wird nichts weitergeleitet.' },
  { id: 'h07', type: 'path', q: 'Ein Kunde ruft 203.0.113.1:80 auf (öffentliche Router-IP). Eine DNAT-Regel leitet auf den Webserver in der DMZ um.', c: ['pre', 'fwd', 'post'],
    x: 'DNAT passiert in PREROUTING, also VOR der Routing-Entscheidung. Danach ist der Webserver das Ziel: FORWARD, POSTROUTING.' },
  { id: 'h08', type: 'path', q: 'Der Router schickt eine Log-Meldung an den Syslog-Server im Server-Netz.', c: ['out', 'post'],
    x: 'Der Router ist der Absender: OUTPUT, POSTROUTING.' },
  { id: 'h09', type: 'pick', q: 'Wo passiert DNAT (Portweiterleitung, Zieladresse ändern)?', c: ['pre'],
    x: 'In PREROUTING. Das Ziel muss VOR der Routing-Entscheidung feststehen.' },
  { id: 'h10', type: 'pick', q: 'Wo passiert SNAT bzw. Masquerade (Quelladresse ändern)?', c: ['post'],
    x: 'In POSTROUTING, ganz am Ende. Erst dann ist klar, über welches Interface das Paket rausgeht.' },
  { id: 'h11', type: 'pick', q: 'In welchem Hook hat ein Paket NIE ein Eingangs-Interface (iif)?', c: ['out'],
    x: 'OUTPUT sieht nur Pakete, die der Router selbst erzeugt. Die kamen über kein Interface herein.' },
  { id: 'h12', type: 'pick', q: 'Welcher Hook sieht NUR Pakete, die durch den Router hindurchgehen?', c: ['fwd'],
    x: 'FORWARD. Pakete an den Router (INPUT) und vom Router (OUTPUT) kommen hier nie vorbei.' },
  { id: 'h13', type: 'pick', q: 'Welcher Hook kommt VOR der Routing-Entscheidung?', c: ['pre'],
    x: 'PREROUTING ist der erste Kontakt mit einem eingehenden Paket, noch bevor feststeht, wohin es geht.' },
  { id: 'h14', type: 'pick', q: 'Ein Paket ist für den Router selbst bestimmt. Welcher Filter-Hook entscheidet, ob es hinein darf?', c: ['in'],
    x: 'INPUT. Hier schützt man die Dienste des Routers (SSH, DNS …).' },
  { id: 'h15', type: 'pick', q: 'In welchem Hook kann eine Regel mit `oifname` nie zutreffen?', c: ['in', 'pre'],
    x: 'In INPUT bleibt das Paket im Router, ein Ausgangs-Interface gibt es nicht. In PREROUTING ist es noch nicht entschieden. Beide Antworten zählen.' },

  /* ---------- Tag 2: nftables-Begriffe ---------- */
  { id: 'n01', type: 'mc', q: 'Was legt fest, AN WELCHER STELLE im Paketweg eine Chain Pakete bekommt?',
    a: ['hook', 'type', 'priority', 'policy'], c: 0, hint: 'Die Kontrollstelle wird an einem Kontrollpunkt „eingehängt“.',
    x: 'Der Hook ist der Kontrollpunkt: prerouting, input, forward, output, postrouting.' },
  { id: 'n02', type: 'mc', q: 'Was legt der Chain-Type fest?',
    a: ['Wofür die Chain da ist: filtern, NAT oder Routing', 'An welcher Stelle sie greift', 'Was passiert, wenn keine Regel passt', 'Für welche IP-Version sie gilt'], c: 0,
    x: 'type filter / nat / route. Die Stelle legt der Hook fest, die IP-Version die Familie der Table.' },
  { id: 'n03', type: 'mc', q: 'Was bestimmt die Policy einer Chain?',
    a: ['Was mit einem Paket passiert, auf das keine Regel passt', 'In welcher Reihenfolge die Regeln geprüft werden', 'Welche Interfaces erlaubt sind', 'Ob IPv4 oder IPv6 gefiltert wird'], c: 0,
    x: '`policy drop` bedeutet: Alles, was nicht ausdrücklich erlaubt ist, wird verworfen. Das ist das Whitelist-Prinzip.' },
  { id: 'n04', type: 'mc', q: 'Zwei Chains hängen am selben Hook, eine mit priority -100, eine mit priority 0. Welche läuft zuerst?',
    a: ['-100, die kleinere Zahl kommt zuerst', '0, die größere Zahl kommt zuerst', 'Beide gleichzeitig', 'Die zuerst angelegte'], c: 0,
    x: 'Deshalb hat DNAT -100 (vor dem Filter mit 0) und SNAT +100 (danach).' },
  { id: 'n05', type: 'mc', q: 'Was ist eine Table in nftables?',
    a: ['Ein Behälter für Chains, der die Familie festlegt (ip, ip6, inet …)', 'Eine einzelne Filterregel', 'Ein Kontrollpunkt im Kernel', 'Die Standardaktion einer Chain'], c: 0,
    x: 'Die Table filtert selbst nichts. Sie sortiert Chains und legt fest, welche Pakete sie sieht (z. B. inet = IPv4 + IPv6).' },
  { id: 'n06', type: 'mc', q: 'Was bedeutet die Familie `inet`?',
    a: ['Die Table gilt für IPv4 und IPv6', 'Nur für IPv4', 'Nur für Pakete aus dem Internet', 'Nur für interne Netze'], c: 0,
    x: 'ip = nur IPv4, ip6 = nur IPv6, inet = beides. Daneben gibt es arp, bridge und netdev.' },
  { id: 'n07', type: 'mc', q: 'Gegeben: `chain input { type filter hook forward priority 0; policy drop; }`. Welche Pakete prüft diese Chain?',
    a: ['Durchgeleitete Pakete, denn entscheidend ist der Hook, nicht der Name', 'Pakete an den Router selbst, sie heißt ja input', 'Gar keine, das ist ein Syntaxfehler', 'Alle Pakete'], c: 0,
    x: 'Der Name einer Chain ist frei wählbar. Was sie prüft, bestimmt allein `hook`.' },
  { id: 'n08', type: 'mc', q: 'Eine Chain ohne `hook`-Angabe (Regular Chain) bekommt Pakete …',
    a: ['nur, wenn eine andere Chain mit `jump` oder `goto` dorthin springt', 'automatisch an allen Hooks', 'nur von IPv6', 'nie, sie ist nutzlos'], c: 0,
    x: 'Regular Chains dienen zum Ordnen (z. B. eine eigene Chain „ssh_regeln“). Nur Base Chains (mit hook) hängen direkt im Paketfluss.' },
  { id: 'n09', type: 'mc', q: 'In welcher Reihenfolge werden die Regeln einer Chain geprüft?',
    a: ['Von oben nach unten, die erste passende Regel mit accept/drop entscheidet', 'Von unten nach oben', 'Alle gleichzeitig, drop gewinnt immer', 'Zufällig'], c: 0,
    x: 'Deshalb ist die Reihenfolge so wichtig: Ein drop weiter oben schlägt ein accept weiter unten.' },
  { id: 'n10', type: 'mc', q: 'Welcher Befehl zeigt das komplette nftables-Regelwerk an?',
    a: ['nft list ruleset', 'nft show all', 'iptables -L', 'ip rule show'], c: 0,
    x: '`nft list ruleset` zeigt alle Tables, Chains und Regeln.' },
  { id: 'n11', type: 'tf', q: 'Eine Table filtert selbst Pakete, wenn man ihr eine Policy gibt.', c: false,
    x: 'Falsch. Tables haben keine Policy. Policy, Hook und Type gehören zur (Base) Chain.' },
  { id: 'n12', type: 'mc', q: 'Was ist der Unterschied zwischen `drop` und `reject`?',
    a: ['drop verwirft still, reject schickt dem Absender eine Fehlermeldung (ICMP/TCP-Reset)', 'drop gilt nur für TCP, reject für UDP', 'Es gibt keinen Unterschied', 'reject leitet das Paket an den Admin weiter'], c: 0,
    x: 'Bei drop wartet der Absender bis zum Timeout. reject antwortet sofort mit „abgelehnt“.' },
  { id: 'n13', type: 'mc', q: 'Warum steht in fast jeder input-Chain `iif "lo" accept`?',
    a: ['Damit Programme auf dem Router über das Loopback-Interface miteinander reden können', 'Damit das Internet den Router erreicht', 'Damit IPv6 funktioniert', 'Damit Logs geschrieben werden'], c: 0,
    x: 'Viele Dienste sprechen intern über 127.0.0.1. Ohne diese Regel blockiert man sich selbst.' },
  { id: 'n14', type: 'mc', q: 'Was bewirkt `ct state established,related accept`?',
    a: ['Pakete, die zu einer bereits erlaubten Verbindung gehören (z. B. Antworten), werden durchgelassen', 'Neue Verbindungen werden immer erlaubt', 'Nur verschlüsselte Pakete werden erlaubt', 'Alle Pakete werden protokolliert'], c: 0,
    x: 'ct = Connection Tracking. Das ist der „stateful“-Teil: Antworten brauchen keine eigene Regel.' },

function spr(name, px, sub) {
  const rows = SPRITES[name];
  const w = Math.max.apply(null, rows.map(r => r.length)), h = rows.length;
  const at = (row, x) => { let ch = row[x] || '.'; if (sub && sub[ch]) ch = sub[ch]; return ch; };
  let out = '';
  rows.forEach((row, y) => {
    let x = 0;
    while (x < w) {
      const ch = at(row, x);
      if (ch === '.') { x++; continue; }
      let x2 = x + 1;
      while (x2 < w && at(row, x2) === ch) x2++;
      out += '<rect x="' + x + '" y="' + y + '" width="' + (x2 - x) + '" height="1" fill="' + (PAL[ch] || ch) + '"/>';
      x = x2;
    }
  });
  return '<svg class="spr" viewBox="0 0 ' + w + ' ' + h + '" width="' + (w * px) + '" height="' + (h * px) + '" shape-rendering="crispEdges" aria-hidden="true">' + out + '</svg>';
}
const starsHTML = (n, of) => { let s = ''; for (let i = 0; i < of; i++) s += spr(i < n ? 'star' : 'star0', 3); return s; };

let SAVE = freshSave();
function loadSave() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return;
    const s = JSON.parse(raw);
    if (!s || s.v !== 1) return;
    const d = freshSave();
    SAVE = Object.assign(d, s);
    SAVE.settings = Object.assign(freshSave().settings, s.settings || {});
    if (!Array.isArray(SAVE.stack)) SAVE.stack = [];

  } catch (e) { /* ohne Speicher weiterspielen */ }
}
function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(SAVE)); } catch (e) { /* egal */ } }
function totalStars() { return DAYS.reduce((a, d) => a + (SAVE.stars[d.id] || 0), 0); }

function stackAdd(item) {
  const ex = SAVE.stack.find(s => s.key === item.key);
  if (ex) ex.streak = 0; else SAVE.stack.push(Object.assign({ streak: 0 }, item));
  persist();
}
function stackHit(key, ok) {
  const ex = SAVE.stack.find(s => s.key === key);
  if (!ex) return null;
  if (!ok) { ex.streak = 0; persist(); return 0; }
  ex.streak++;
  if (ex.streak >= 2) { SAVE.stack = SAVE.stack.filter(s => s !== ex); persist(); return 'cleared'; }
  persist();
  return ex.streak;
}

/* ---------- 8-Bit-Sound ---------- */
const AudioFX = (() => {
  let ac = null;
  function ctx() {
    if (!ac) { const C = window.AudioContext || window.webkitAudioContext; if (!C) return null; ac = new C(); }
    if (ac.state === 'suspended') ac.resume();
    return ac;
  }
  function tone(freq, dur, o) {
    o = o || {};
    const a = ctx(); if (!a) return;
    const t = a.currentTime + (o.at || 0);
    const osc = a.createOscillator(), g = a.createGain();
    osc.type = o.type || 'square';
    osc.frequency.setValueAtTime(freq, t);
    if (o.to) osc.frequency.exponentialRampToValueAtTime(o.to, t + dur);
    g.gain.setValueAtTime(o.vol || 0.045, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(g); g.connect(a.destination);
    osc.start(t); osc.stop(t + dur + 0.03);
  }
  function noise(dur, vol) {
    const a = ctx(); if (!a) return;
    const n = Math.floor(a.sampleRate * dur), buf = a.createBuffer(1, n, a.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const src = a.createBufferSource(); src.buffer = buf;
    const f = a.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 800;
    const g = a.createGain(); g.gain.value = vol;
    src.connect(f); f.connect(g); g.connect(a.destination); src.start();
  }
  const fx = {
    click() { tone(660, 0.04, { vol: 0.025 }); },
    step() { tone(330, 0.03, { vol: 0.018 }); },
    stamp() { noise(0.12, 0.22); tone(120, 0.12, { type: 'triangle', vol: 0.12, to: 55 }); },
    ok() { tone(523, 0.07); tone(659, 0.07, { at: 0.07 }); tone(784, 0.13, { at: 0.14 }); },
    bad() { tone(220, 0.16, { type: 'sawtooth', vol: 0.04, to: 110 }); tone(150, 0.22, { at: 0.11, vol: 0.035, to: 90 }); },
    win() { [523, 659, 784, 1046].forEach((f, i) => tone(f, 0.11, { at: i * 0.1 })); tone(1046, 0.35, { at: 0.42, type: 'triangle', vol: 0.06 }); },
    lose() { [392, 330, 262, 196].forEach((f, i) => tone(f, 0.18, { at: i * 0.16, type: 'triangle', vol: 0.07 })); },
    ring() { for (let i = 0; i < 3; i++) { tone(880, 0.06, { at: i * 0.17 }); tone(1100, 0.06, { at: i * 0.17 + 0.07 }); } },
    memo() { tone(440, 0.05, { vol: 0.03 }); tone(554, 0.06, { at: 0.06, vol: 0.03 }); }
  };
  return { play(n) { if (!SAVE.settings.sound) return; try { if (fx[n]) fx[n](); } catch (e) { /* kein Ton */ } } };
})();

/* ---------- Bildschirm-Steuerung ---------- */
let TIMERS = [];
function later(fn, ms) { const t = setTimeout(fn, ms); TIMERS.push(t); return t; }
let SCREEN = {};
let MODAL = null;
function go(fn, arg) {
  TIMERS.forEach(clearTimeout); TIMERS = [];
  closeModal();
  const app = $('#app');
  app.innerHTML = '';
  SCREEN = fn(app, arg) || {};
  window.scrollTo(0, 0);
}
document.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const tag = e.target && e.target.tagName;
  if (tag === 'INPUT' || tag === 'TEXTAREA') return;
  if (tag === 'SELECT' && e.key !== 'Enter') return;
  /* Normale Knöpfe außerhalb des Spielfelds reagieren selbst auf Enter/Leertaste */
  if ((e.key === 'Enter' || e.key === ' ') && tag === 'BUTTON' && !e.target.disabled && !e.target.closest('.stage, .desk, .modal')) return;
  const h = MODAL ? MODAL.onKey : SCREEN.onKey;
  if (h && h(e) === true) e.preventDefault();
});
function openModal(html, opts) {
  closeModal();
  const back = document.createElement('div');
  back.className = 'modal-back';
  back.innerHTML = '<div class="modal ' + (opts && opts.paper ? 'paper' : '') + '" role="dialog" aria-modal="true">' + html + '</div>';
  document.body.appendChild(back);
  MODAL = { el: back, onKey: null };
  return MODAL;
}
function closeModal() { if (MODAL) { MODAL.el.remove(); MODAL = null; } }
let toastTimer = null;
function toast(msg) {
  let t = $('.toast');
  if (!t) { t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); document.body.appendChild(t); }
  t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 2300);
}
function hudHTML(title, sub) {
  return '<header class="hud"><button class="btn tiny" data-act="quit">&lt; Zurück</button><div class="hud-title">' + title +
    (sub ? '<small>' + sub + '</small>' : '') + '</div><div class="hud-right" data-r="hud"></div></header>';
}
function hudItems(items) {
  return items.map(it => it.html ? '<span class="hi ' + (it.cls || '') + '" title="' + esc(it.title || '') + '">' + it.html + '</span>' :
    '<span class="hi ' + (it.cls || '') + '" title="' + esc(it.title || '') + '">' + (it.icon ? spr(it.icon, 3) : '') +
    (it.label ? '<span class="lbl">' + it.label + '</span>' : '') + '<span>' + it.v + '</span></span>').join('');
}
function wireQuit(root, back) {
  const b = $('[data-act="quit"]', root);
  let armed = false;
  b.onclick = () => {
    if (armed) { back(); return; }
    armed = true; b.textContent = 'Wirklich abbrechen?'; b.classList.add('warnb');
    later(() => { armed = false; b.innerHTML = '&lt; Zurück'; b.classList.remove('warnb'); }, 2600);
  };
}
function applySettings() { document.documentElement.classList.toggle('no-crt', !SAVE.settings.crt); }

}

/* =====================================================================
   KARTEN-MODUS (Quizshow, Hook-Wege, Terminal, IHK-Tabellen, Nachsitzen)
   ===================================================================== */
const TYPE_META = { mc: 'MULTIPLE CHOICE', tf: 'WAHR ODER FALSCH', multi: 'MEHRERE RICHTIG', path: 'HOOK-WEG', pick: 'HOOK FINDEN',
  fill: 'TERMINAL', table: 'IHK-TABELLE', packet: 'NACHSITZEN AM SCHALTER' };
const PRAISE = ['Stark!', 'Genau so.', 'Sauber gelöst.', 'Richtig, weiter so!', 'Läuft bei dir.', 'Das sitzt.'];
const COMFORT = ['Knapp daneben. Die Frage kommt gleich nochmal.', 'Nicht schlimm, lies dir die Erklärung durch.', 'Fehler sind zum Lernen da. Die kommt wieder.'];
const INTRO = ['Nächste Frage!', 'Konzentration …', 'Nimm dir Zeit.', 'Die hier ist beliebt in Prüfungen.', 'Weiter geht\'s.'];
const cardKey = c => c.type === 'packet' ? c.key : 'card:' + c.id;
function qHead(card, extra) {
  return '<div class="q-meta">' + TYPE_META[card.type] + (extra ? ' · ' + extra : '') + '</div><div class="q">' + fmt(card.q || 'Ergänze die fehlenden Felder.') + '</div>';
}

function runCards(app, cfg) {
  const stackMode = !!cfg.stackMode;
  const items = cfg.cards.map((c, k) => ({ c, k, tries: 0, ok: false }));
  const queue = items.slice();
  const total = items.length;
  const st = { pos: 0, firstOk: 0, credits: 0, streak: 0, jokers: { fifty: 2, hint: 2 }, answered: false, ctl: null, cleared: 0 };
  app.innerHTML = '<div class="s-cards">' + hudHTML(cfg.title, cfg.sub || '') +
    '<div class="cards-grid"><aside class="host"><div class="host-face">' + spr('chef', 5) + '</div>' +
    '<div class="bubble" data-r="bubble" aria-live="polite"></div><div class="jokers" data-r="jokers"></div><div class="progress" data-r="progress"></div></aside>' +
    '<section class="stage-wrap"><div class="stage" data-r="stage"></div><div class="verdict" data-r="verdict" hidden></div></section></div></div>';
  const R = k => $('[data-r="' + k + '"]', app);
  wireQuit(app, () => go(stackMode ? screenTitle : screenPlan));
  const say = t => { R('bubble').innerHTML = t; };

  function hud() {
    R('hud').innerHTML = hudItems([
      { icon: 'coin', v: st.credits + ' Cr', title: 'Verdienst' },
      { icon: 'flame', v: 'x' + (st.streak >= 3 ? 2 : 1), cls: 'combo', title: 'Serie' },
      { label: stackMode ? 'Vom Stapel' : 'Gelöst', v: (stackMode ? st.cleared : items.filter(i => i.ok).length) + '/' + total }
    ]);
  }
  function progress() {
    R('progress').innerHTML = '<small>' + (stackMode ? 'Zweimal hintereinander richtig = vom Stapel' : 'Fortschritt') + '</small><div class="bar">' +
      items.map(i => '<span class="seg ' + (i.ok ? 'on' : i.tries ? 're' : '') + '"></span>').join('') + '</div>';
  }
  function jokers() {
    const card = queue[st.pos] && queue[st.pos].c;
    const hint = card && (card.hint || TYPE_HINT[card.type]);
    R('jokers').innerHTML = '<button class="btn tiny" data-j="fifty" ' + (st.jokers.fifty && card && card.type === 'mc' && !st.answered ? '' : 'disabled') + '>50:50 (' + st.jokers.fifty + ')</button>' +
      '<button class="btn tiny" data-j="hint" ' + (st.jokers.hint && hint && !st.answered ? '' : 'disabled') + '>Tipp (' + st.jokers.hint + ')</button>';
    $('[data-j="fifty"]', app).onclick = () => { if (st.ctl && st.ctl.fifty && st.ctl.fifty()) { st.jokers.fifty--; AudioFX.play('click'); say('Zwei falsche Antworten sind weg.'); jokers(); } };
    $('[data-j="hint"]', app).onclick = () => { st.jokers.hint--; AudioFX.play('click'); say('<b>Tipp:</b> ' + fmt(hint)); jokers(); };
  }
  function load() {
    const it = queue[st.pos];
    st.answered = false;
    R('verdict').hidden = true;
    const stage = R('stage');
    stage.innerHTML = '';
    st.ctl = renderCard(it.c, stage, onAnswer) || {};
    say(it.tries ? 'Die kennst du schon. Diesmal klappt\'s!' : (stackMode ? 'Aus deinem Fehlerstapel.' : INTRO[Math.floor(Math.random() * INTRO.length)]));
    hud(); progress(); jokers();
  }
  function onAnswer(ok, info) {
    if (st.answered) return;
    st.answered = true;
    const it = queue[st.pos];
    const key = cardKey(it.c);
    let gain = 0, again = '';
    if (stackMode) {
      const r = stackHit(key, ok);
      if (ok && r === 'cleared') { it.ok = true; st.cleared++; gain = 2; again = 'Vom Stapel geflogen!'; }
      else if (ok) { queue.push(it); again = 'Noch einmal richtig, dann fliegt sie vom Stapel.'; gain = 1; }
      else { it.tries++; queue.splice(Math.min(st.pos + 3, queue.length), 0, it); again = 'Kommt gleich nochmal.'; }
    } else if (ok) {
      it.ok = true;
      if (!it.tries) st.firstOk++;
      gain = it.tries ? 1 : 3 + (st.streak >= 2 ? 1 : 0);
      stackHit(key, true);
    } else {
      it.tries++;
      stackAdd(it.c.type === 'packet' ? { key, kind: 'packet' } : { key, kind: 'card', id: it.c.id });
      queue.splice(Math.min(st.pos + 3, queue.length), 0, it);
      again = 'Kommt gleich nochmal und liegt auf deinem Fehlerstapel.';
    }
    st.streak = ok ? st.streak + 1 : 0;
    st.credits += gain;
    AudioFX.play(ok ? 'ok' : 'bad');
    say(ok ? PRAISE[Math.floor(Math.random() * PRAISE.length)] : COMFORT[Math.floor(Math.random() * COMFORT.length)]);
    const v = R('verdict');
    v.className = 'verdict ' + (ok ? 'ok' : 'bad');
    v.hidden = false;
    v.innerHTML = '<div class="v-head">' + spr(ok ? 'check' : 'cross', 4) + (ok ? 'RICHTIG' : 'LEIDER FALSCH') + (gain ? '<span class="plus">+' + gain + ' Cr</span>' : '') + '</div>' +
      '<div class="v-body">' + (info && info.x ? info.x : fmt(it.c.x)) + '</div>' +
      '<div class="v-foot"><span class="again">' + again + '</span><button class="btn go" data-act="next">Weiter <kbd>Enter</kbd></button></div>';
    $('[data-act="next"]', v).onclick = next;
    hud(); progress(); jokers();
    later(() => { const r = v.getBoundingClientRect(); if (r.bottom > window.innerHeight) window.scrollBy({ top: r.bottom - window.innerHeight + 20, behavior: 'smooth' }); }, 60);
  }
  function next() {
    if (!st.answered) return;
    st.pos++;
    if (st.pos >= queue.length) { finish(); return; }
    load();
    const top = R('stage').getBoundingClientRect().top;
    if (top < 0) window.scrollBy({ top: top - 80, behavior: 'smooth' });
  }
  function finish() {
    if (stackMode) {
      go(screenReport, { kind: 'stack', title: 'NACHSITZEN', credits: st.credits, passed: true,
        stats: [['Karten bearbeitet', total], ['Vom Stapel geflogen', st.cleared], ['Noch auf dem Stapel', SAVE.stack.length]] });
      return;
    }
    const ratio = st.firstOk / total;
    const stars = ratio >= 0.9 ? 3 : ratio >= 0.7 ? 2 : 1;
    const wrong = items.filter(i => i.tries);
    go(screenReport, { kind: 'cards', day: cfg.day, title: cfg.title, stars, passed: true, credits: st.credits,
      stats: [['Karten', total], ['Beim ersten Versuch richtig', st.firstOk + ' / ' + total], ['Fehlversuche', items.reduce((a, i) => a + i.tries, 0)]],
      mistakes: wrong.map(i => '<div class="mq">' + fmt(i.c.q || i.c.title) + '</div><div class="ma">' + fmt(i.c.x) + '</div>') });
  }
  load();
  return {
    onKey(e) {
      if (st.answered) { if (e.key === 'Enter' || e.key === ' ') { next(); return true; } return; }
      if (e.key === 'Enter' && e.target && e.target.tagName === 'BUTTON' && !e.target.closest('.stage')) return;
      return st.ctl && st.ctl.onKey ? st.ctl.onKey(e) : undefined;
    }
  };
}

function renderCard(card, stage, answer) {
  switch (card.type) {
    case 'mc': return rMC(card, stage, answer);
    case 'tf': return rTF(card, stage, answer);
    case 'multi': return rMulti(card, stage, answer);
    case 'path': return rPath(card, stage, answer);
    case 'pick': return rPick(card, stage, answer);
    case 'fill': return rFill(card, stage, answer);
    case 'table': return rTable(card, stage, answer);
    case 'packet': return rPacket(card, stage, answer);
  }
  return {};
}

function rMC(card, stage, answer) {
  const opts = shuffle(card.a.map((t, i) => ({ t, ok: i === card.c })));
  stage.innerHTML = qHead(card) + '<div class="answers">' + opts.map((o, i) => '<button class="ans" data-i="' + i + '"><span class="k">' + (i + 1) + '</span><span>' + fmt(o.t) + '</span></button>').join('') + '</div>';
  const btns = $$('.ans', stage);
  let done = false;
  function choose(i) {
    if (done || !btns[i] || btns[i].disabled) return;
    done = true;
    btns.forEach((b, j) => { b.disabled = true; if (opts[j].ok) b.classList.add('right'); });
    if (!opts[i].ok) btns[i].classList.add('wrong');
    answer(opts[i].ok);
  }
  btns.forEach((b, i) => { b.onclick = () => choose(i); });
  return {
    onKey(e) { const n = parseInt(e.key, 10); if (n >= 1 && n <= opts.length) { choose(n - 1); return true; } },
    fifty() {
      const wrong = btns.filter((b, j) => !opts[j].ok && !b.disabled);
      if (wrong.length < 2) return false;
      shuffle(wrong).slice(0, wrong.length - 1).forEach(b => { b.classList.add('gone'); b.disabled = true; });
      return true;
    }
  };
}
function rTF(card, stage, answer) {
  stage.innerHTML = qHead(card) + '<div class="answers tf"><button class="ans" data-v="1"><span class="k">W</span>WAHR</button><button class="ans" data-v="0"><span class="k">F</span>FALSCH</button></div>';
  const btns = $$('.ans', stage);
  let done = false;
  function choose(v) {
    if (done) return;
    done = true;
    btns.forEach(b => { b.disabled = true; const bv = b.dataset.v === '1'; if (bv === card.c) b.classList.add('right'); else if (bv === v) b.classList.add('wrong'); });

    }
  };
}
